function applyChromaKey(img) {
  img.loadPixels();
  let w = img.width;
  let h = img.height;
  for (let i = 0; i < img.pixels.length; i += 4) {
    let r = img.pixels[i], g = img.pixels[i+1], b = img.pixels[i+2];
    let contrastAmt = 1.08; 
    r = constrain((r - 128) * contrastAmt + 128, 0, 255);
    g = constrain((g - 128) * contrastAmt + 128, 0, 255);
    b = constrain((b - 128) * contrastAmt + 128, 0, 255);
    let y = floor((i/4) / w);
    let isGreenKey = (g > 110 && g > r * 1.3 && g > b * 1.05);
    img.pixels[i+3] = (y < h * 0.33 || y > h * 0.78) ? 255 : (isGreenKey ? 0 : 255);
    img.pixels[i] = r; img.pixels[i+1] = g; img.pixels[i+2] = b;
  }
  img.updatePixels();
}

function getPaletteByTime() {
    let h = hour(), m = minute(), totalMins = h * 60 + m;
    if (showLinesMode || showWavesMode) return { colors: PURPLE_PEACH_PALETTE, type: "PURPLE_PEACH" };
    
    // Specific Window: 2:22 PM (862 mins) to 7:07 PM (1147 mins)
    if (totalMins >= 862 && totalMins <= 1147) return { colors: SPECIFIC_WINDOW_PALETTE, type: "WINDOW_SPECIFIC" };

    if (totalMins >= 732 && totalMins <= 932) return { colors: ELECTRIC_LASER_PALETTE, type: "ELECTRIC_LASER" };
    if (totalMins >= 1075 && totalMins <= 1207) return { colors: ELECTRIC_LASER_PALETTE, type: "ELECTRIC_LASER_NEON" };
    if (totalMins >= 491 && totalMins <= 610) return { colors: AM_METALLIC_PALETTE, type: "AM_METALLIC" };
    if (totalMins >= 1211 && totalMins <= 1329) return { colors: PM_METALLIC_PALETTE, type: "PM_METALLIC" };
    if (totalMins >= 611 && totalMins < 732) return { colors: MAROON_PALETTE, type: "MAROON" };
    if (totalMins >= 933 && totalMins <= 1074) return { colors: MINT_PALETTE, type: "MINT" };
    if (totalMins >= 1330 || totalMins <= 141) return { colors: BORDEAUX_PALETTE, type: "BORDEAUX" };
    if (totalMins >= 213 && totalMins <= 419) return { colors: DAWN_PALETTE_BASE, type: "DAWN" };
    if (totalMins >= 660 && totalMins <= 979 && (totalMins < 732 || totalMins > 932)) return { colors: DESERT_PALETTE, type: "DESERT" };
    if (totalMins >= 540 && totalMins < 611) return { colors: BRIGHTS_PALETTE, type: "BRIGHTS" };
    if ((h === 16 && m >= 20) || (h === 17)) return { colors: LIME_PALETTE, type: "LIME" };
    if (h >= 18 && h < 21 && (totalMins > 1207)) return { colors: TWILIGHT_PALETTE, type: "TWILIGHT" };
    if (h >= 21 || h < 3) return { colors: NIGHT_PALETTE, type: "NIGHT" };
    return { colors: DAY_PALETTE, type: "DAY" };
}

function startAudioContext() { if (getAudioContext().state !== 'running') getAudioContext().resume(); }

function updatePalette() {
    let result = getPaletteByTime();
    if (result.type !== lastPaletteType) {
        let newSet = [...result.colors];
        if (result.type === "DAWN" || result.type === "BRIGHTS" || result.type.includes("ELECTRIC")) newSet.sort(() => random() - 0.5); 
        targetPaletteHex = newSet;
        lastPaletteType = result.type;
    }
}

function lerpPalettes() {
    let targetLen = targetPaletteHex.length;
    for (let i = 0; i < targetLen; i++) {
        let targetColor = color('#' + targetPaletteHex[i]);
        if (colorsPalette[i]) colorsPalette[i] = lerpColor(colorsPalette[i], targetColor, paletteLerpRate);
        else colorsPalette[i] = targetColor;
    }
    if (colorsPalette.length > targetLen) colorsPalette.splice(targetLen);
}

  }
  if (showAffirmation && affirmationFrozen) waitingForKeyDismissal = true;
  lastTapTime = currentTime;
}

    }
  } else if (key === 't' || key === 'T') {
    if (scene === 2) { showAffirmation = !showAffirmation; if (showAffirmation) { affirmationStartTime = millis(); affirmationFrozen = false; waitingForKeyDismissal = false; } }
  } else if (key === 'f' || key === 'F') { if (showAffirmation) affirmationFrozen = true; }
  else if (key === 'a' || key === 'A') { if (scene === 2) { showAlternateView = !showAlternateView; if (showAlternateView) { isDeveloperMode = false; videoBlaqqatDevV.pause(); showControlsMenu = false; } } }
  else if (key === 'c' || key === 'C') { if (scene === 2) showCompanionView = !showCompanionView; }
  else if (key === 'l' || key === 'L') { if (scene === 2) showLinesMode = !showLinesMode; }
  else if (key === 'w' || key === 'W') { if (scene === 2) showWavesMode = !showWavesMode; }
  else if (key === 's' || key === 'S') { if (scene === 2) showMountainMode = !showMountainMode; }
  else if (key === 'o' || key === 'O') { if (scene === 2) { showRingMode = !showRingMode; if (showRingMode) ripples = []; } }
  else if (key === 'q' || key === 'Q') { if (scene === 2) isQuietMode = !isQuietMode; }
  else if (key === 'i' || key === 'I') { if (scene === 2) { showControlsMenu = !showControlsMenu; if (showControlsMenu) { isDeveloperMode = false; videoBlaqqatDevV.pause(); showAlternateView = false; } } }
  else if (key === 'd' || key === 'D') { if (scene === 2) { isDeveloperMode = !isDeveloperMode; if (isDeveloperMode) { showControlsMenu = false; showAlternateView = false; } } }
  else if (key === 'm' || key === 'M') { if (scene === 2 && isDeveloperMode) { isDevVideoMuted = !isDevVideoMuted; videoBlaqqatDevV.elt.muted = isDevVideoMuted; } }
  else if (key === 'ArrowUp') { fearGreedIndex = min(100, fearGreedIndex + 5); }
  else if (key === 'ArrowDown') { fearGreedIndex = max(0, fearGreedIndex - 5); }
}

function drawOmbreBackground() {
  if (colorsPalette.length < 2) return;
  colorMode(HSL, 360, 100, 100, 1);
  let cPurple = color(284, 100, 53, 1), cLime = color(77, 100, 64, 1);
  colorMode(RGB, 255);
  const gradientColors = colorsPalette; 
  let totalMins = hour() * 60 + minute(), isDawnTime = (totalMins >= 213 && totalMins <= 419);
  noFill(); strokeWeight(2); 
  let timeShift = frameCount * 0.006, drift = sin(frameCount * 0.002) * 0.05;
  for (let y = 0; y < height; y += 2) {
    let inter = map(y, 0, height, 0, 1);
    let wave = sin(y * 0.0015 + timeShift) * 0.12;
    let animatedInter = constrain(inter + wave + drift, 0, 1);
    let finalCol = isDawnTime ? lerpColor(cPurple, cLime, animatedInter) : (function(){
        let palettePos = map(animatedInter, 0, 1, 0, gradientColors.length - 1);
        let idx = floor(palettePos), f = palettePos % 1;
        return lerpColor(gradientColors[idx], gradientColors[(idx + 1) % gradientColors.length], f);
    })();
    stroke(finalCol); line(0, y, width, y);
  }
}

function drawMountainPattern() {
  push(); blendMode(LIGHTEST); noStroke();
  for (let i = 0; i < 8; i++) {
    let cBase = color('#' + METAL_PALETTE[i % METAL_PALETTE.length]);
    fill(red(cBase), green(cBase), blue(cBase), 180);
    beginShape(); vertex(0, height);
    for (let x = 0; x <= width; x += 10) {
      let noiseVal = noise(x * 0.002, i * 20, frameCount * 0.001);
      vertex(x, (height * 0.3 + (i * 80)) + map(noiseVal, 0, 1, -150, 150));
    }
    vertex(width, height); endShape(CLOSE);
  }
  pop();
}

function drawUndulatingWavePattern() {
  push(); blendMode(showCompanionView ? ADD : SCREEN); strokeWeight(showCompanionView ? 4 : 3); noFill();
  const patternColors = colorsPalette.map(c => color(red(c), green(c), blue(c), 180));
  let numLines = 55, density = map(sin(frameCount * 0.005), -1, 1, 0.005, 0.015);
  for (let i = 0; i < numLines; i++) {
    let y = map(i, 0, numLines, 0, height);
    // Cycle colors more rapidly for 'more colorful' look
    let colorIdx = (i + floor(frameCount * 0.02)) % patternColors.length;
    let c1 = patternColors[colorIdx]; 
    let c2 = patternColors[(colorIdx + 2) % patternColors.length];
    
    for (let x = 0; x < width; x += 15) {
        let lerpFactor = map(x, 0, width, 0, 1);
        let finalColor = lerpColor(c1, c2, lerpFactor);
        let w1 = sin(frameCount * 0.03 + y * density + x * 0.001) * 60 + sin(frameCount * 0.01 + x * 0.03) * 25;
        let w2 = sin(frameCount * 0.03 + y * density + (x + 15) * 0.001) * 60 + sin(frameCount * 0.01 + (x + 15) * 0.03) * 25;
        stroke(finalColor); line(x, y + w1, x + 15, y + w2);
    }
  }
  pop();
}

function drawWhimsicalOrganicLines() {
  push(); blendMode(showCompanionView ? SCREEN : BLEND); noFill();
  let time = frameCount * 0.006;
  for (let i = 0; i < 16; i++) {
    let c = colorsPalette[i % max(1, colorsPalette.length - 1)];
    stroke(red(c), green(c), blue(c), map(sin(time + i * 0.3), -1, 1, 150, 230));
    strokeWeight(noise(i * 5, time * 0.5) * 3 + (showCompanionView ? 2.5 : 1.2));
    beginShape(); let yBase = (height / 17) * (i + 1);
    for (let x = -200; x <= width + 200; x += 40) {
      let yOffset = (noise(x * 0.0008, i * 1.5, time * 0.5) * 550 - 275) + (noise(x * 0.004, time * 0.7) * 120 - 60);
      curveVertex(x, yBase + yOffset + sin(x * 0.0012 + time * 1.5 + i * 0.8) * 90);
    }
    endShape();
  }
  pop();
}

function handleRingMode() {
  if (!showRingMode) return;
  let spawnChance = map(fearGreedIndex, 0, 100, 0.003, 0.02);
  if (random(1) < spawnChance) spawnRipple(random(width), random(height));
  if (dist(mouseX, mouseY, pmouseX, pmouseY) > 5 && frameCount % 12 === 0) spawnRipple(mouseX, mouseY, true);
  push(); blendMode(SCREEN);
  for (let i = ripples.length - 1; i >= 0; i--) {
    ripples[i].update(); ripples[i].display();
    if (ripples[i].isDead()) ripples.splice(i, 1);
  }
  pop();
}

function spawnRipple(x, y, isMouse = false) {
    let baseComplexity = floor(map(fearGreedIndex, 0, 100, 4, 16));
    let ringCount = isMouse ? 5 : baseComplexity;
    let delayStep = isMouse ? 12 : map(fearGreedIndex, 0, 100, 35, 8);
    for (let i = 0; i < ringCount; i++) {
        // Individual colors per ring to make it 'more colorful'
        let col = colorsPalette[(i + floor(random(colorsPalette.length))) % colorsPalette.length];
        ripples.push(new Ripple(x, y, i * delayStep, col)); 
    }
}

class Ripple {
  constructor(x, y, delay, col) {
    this.x = x; this.y = y; this.r = 0;
    this.maxR = min(width, height) * 1.6;
    this.alpha = 230; this.delay = delay;
    this.col = col;
    this.decayRate = map(fearGreedIndex, 0, 100, 2.2, 0.15);
    this.baseWeight = map(fearGreedIndex, 0, 100, 30, 5);
    this.weight = this.baseWeight;
    this.growth = random(0.9, 1.3); 
  }
  update() {
    if (this.delay > 0) { this.delay--; return; }
    this.r += this.growth; this.alpha -= this.decayRate; 
    this.weight = map(this.r, 0, this.maxR, this.baseWeight, 0.05);
  }
  display() {
    if (this.delay > 0 || this.alpha <= 0) return;
    let d = dist(mouseX, mouseY, this.x, this.y);
    let interactiveGlow = 1;
    if (abs(d - this.r) < 140) interactiveGlow = map(abs(d - this.r), 0, 140, 2.2, 1);
    push(); noFill();
    let layers = floor(map(fearGreedIndex, 0, 100, 2, 6));
    for (let i = 0; i < layers; i++) {
      let layerAlpha = this.alpha * (1 - i * 0.15) * interactiveGlow;
      stroke(red(this.col), green(this.col), blue(this.col), constrain(layerAlpha, 0, 255));
      strokeWeight(this.weight * (1 + i * 0.35) * interactiveGlow);
      ellipse(this.x, this.y, this.r + i * 6);
    }
    pop();
  }
  isDead() { return this.alpha <= 0 || this.r > this.maxR; }
}

function drawAffirmation() {
  if (!showAffirmation) return;
  let elapsed = millis() - affirmationStartTime, alphaVal = 255;
  if (!affirmationFrozen) {
    if (elapsed > 120000) { showAffirmation = false; return; }
    else if (elapsed > 60000) alphaVal = map(elapsed, 60000, 120000, 255, 0);
  }
  push(); rectMode(CENTER); textAlign(CENTER, CENTER); textFont(fontRock3D);
  let fontSize = map(width, 400, 2000, 24, 48); textSize(fontSize);
  fill(0, alphaVal * 0.5); text(affirmationText, width/2 + 2, height/2 + 2, width * 0.85);
  fill(255, alphaVal);
  if (affirmationFrozen) { let glow = map(sin(frameCount * 0.1), -1, 1, 200, 255); fill(glow, glow, 255, alphaVal); }
  text(affirmationText, width/2, height/2, width * 0.85); pop();
}

function draw() {
  updatePalette(); lerpPalettes(); background(0);
  if (scene === 0 || scene === 1) { drawOmbreBackground(); drawWelcomeScreen(); }
  if (scene === 2) {
    drawVideoScreen(); handleAudioVolume();
    if (showControlsMenu) drawGenesisOverlay();
    if (isDeveloperMode) drawCommunityCardOverlay();
    if (showAlternateView) drawAlternateImageOverlay();
    drawAffirmation();
  }
  if (scene === 0) { animateButton(); handleHoverEffects(); button.show(); }
  else if (scene === 1) { handleFadeOut(); button.hide(); }
  else if (scene === 2) { handleFadeIn(); }
}

function drawGenesisOverlay() {
  if (imgGenesisControl && imgGenesisControl.width > 0) {
    push(); blendMode(SCREEN); tint(255, 230); 
    let ratio = max(width / imgGenesisControl.width, height / imgGenesisControl.height);
    image(imgGenesisControl, width / 2, height / 2, imgGenesisControl.width * ratio, imgGenesisControl.height * ratio);
    pop(); 
  }
}

function drawCommunityCardOverlay() {
  if (imgCommunityCard && imgCommunityCard.width > 0) {
    push(); blendMode(SCREEN); tint(255, 255); 
    let ratio = max(width / imgCommunityCard.width, height / imgCommunityCard.height);
    image(imgCommunityCard, width / 2, height / 2, imgCommunityCard.width * ratio, imgCommunityCard.height * ratio);
    pop();
  }
}

function drawAlternateImageOverlay() {
    if (!imgSkelevaggio || imgSkelevaggio.width === 0) return;
    push(); blendMode(BLEND); 
    let ratioImg = max(width / imgSkelevaggio.width, height / imgSkelevaggio.height);
    image(imgSkelevaggio, width / 2, height / 2, imgSkelevaggio.width * ratioImg, imgSkelevaggio.height * ratioImg);
    pop(); 
}

function handleHoverEffects() {
  if (isHovering) {
    let cX = width / 2, cY = height * 0.75 + 110;
    for (let i = 0; i < 2; i++) bubbles.push(new Bubble(cX + random(-10, 10), cY + random(-10, 10)));
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    bubbles[i].update(); bubbles[i].display();
    if (bubbles[i].isDead()) bubbles.splice(i, 1);
  }
}

function handleAudioVolume() {
  if (audioVCurious && audioVCurious.isPlaying()) audioVCurious.setVolume(lerp(audioVCurious.getVolume(), isQuietMode ? 0.0 : 0.5, LERP_RATE));
  if (audioVLinesUnderh20) {
    if (showLinesMode && scene === 2 && !isQuietMode) {
      if (!audioVLinesUnderh20.isPlaying()) audioVLinesUnderh20.loop();
      audioVLinesUnderh20.setVolume(lerp(audioVLinesUnderh20.getVolume(), 0.6, LERP_RATE));
    } else {
      let currentVol = audioVLinesUnderh20.getVolume();
      audioVLinesUnderh20.setVolume(lerp(currentVol, 0.0, LERP_RATE));
      if (currentVol < 0.01 && audioVLinesUnderh20.isPlaying()) audioVLinesUnderh20.pause();
    }
  }
}

function drawWelcomeScreen() {
  if (imgAbstractiaSummerNights && imgAbstractiaSummerNights.width > 0) {
    push(); blendMode(BLEND); tint(255, 230); 
    let r = max(width / imgAbstractiaSummerNights.width, height / imgAbstractiaSummerNights.height);
    image(imgAbstractiaSummerNights, width / 2, height / 2, imgAbstractiaSummerNights.width * r, imgAbstractiaSummerNights.height * r);
    pop();
  }
}

function drawVideoScreen() {
    drawOmbreBackground(); 
    if (!showAlternateView && imgAbstractLindiaGif && imgAbstractLindiaGif.width > 0) {
        imgAbstractLindiaGif.loop();
        push(); blendMode(showCompanionView ? SCREEN : BLEND); 
        let r = max(width / imgAbstractLindiaGif.width, height / imgAbstractLindiaGif.height);
        image(imgAbstractLindiaGif, width / 2, height / 2, imgAbstractLindiaGif.width * r, imgAbstractLindiaGif.height * r);
        pop();
    }
    if (showCompanionView) { push(); blendMode(OVERLAY); drawOmbreBackground(); pop(); }
    if (showLinesMode) drawWhimsicalOrganicLines();
    if (showWavesMode) drawUndulatingWavePattern();
    if (showMountainMode) drawMountainPattern(); 
    if (showRingMode) handleRingMode();
}

function animateButton() {
  button.style('transform', `translate(-50%, -50%) scale(${map(sin(frameCount * 0.05), -1, 1, 1, 1.05)})`);
}

function handleDiveIn() {
  startAudioContext();
  if (audioSoftMystical && audioSoftMystical.isLoaded()) audioSoftMystical.play();
  if (videoCultOfAbstractia) videoCultOfAbstractia.pause();
  if (scene === 0) { scene = 1; button.attribute('disabled', ''); }
}

function handleFadeOut() {
  fadeAlpha += fadeRate; fill(0, fadeAlpha); rect(0, 0, width, height);
  if (fadeAlpha >= 255) { fadeAlpha = 255; scene = 2; if (audioVCurious && !audioVCurious.isPlaying()) audioVCurious.play(); }
}

function handleFadeIn() { fadeAlpha -= fadeRate; fill(0, fadeAlpha); rect(0, 0, width, height); if (fadeAlpha <= 0) fadeAlpha = 0; }

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  if (button) button.position(width / 2, height * 0.75 + 110);
}

class Bubble {
  constructor(x, y) {
    this.pos = createVector(x, y); this.vel = p5.Vector.fromAngle(random(TWO_PI), random(2, 5));
    this.lifespan = 255; this.size = random(18, 36);
  }
  update() {
    this.pos.add(this.vel); this.vel.y = lerp(this.vel.y, -2, 0.05); 
    this.vel.mult(0.98); this.lifespan -= 2.5; 
  }
  display() {
    push(); textSize(this.size); textAlign(CENTER, CENTER); fill(255, this.lifespan); 
    text("🫧", this.pos.x, this.pos.y); pop();
  }
  isDead() { return this.lifespan < 0; }
}
  </script>
