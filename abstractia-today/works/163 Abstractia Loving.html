<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@0.7.0/lib/addons/p5.sound.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "mediabunny": "https://cdn.jsdelivr.net/npm/mediabunny@1.25.8/+esm"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      display: flex;
      width: 100vw;
      height: 100vh;
      justify-content: center;

      background: transparent;

    main {
      height: 100%;
      display: flex;
      overflow: auto;
      justify-content: center;
      align-items: center;
    }

    #p5_loading {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      animation-delay: 1s;
      color: #4e5d7b;
      font-family: "FK Grotesk Regular", sans-serif;

      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
  <title>163 Abstractia Loving | Made on juno.transient.xyz</title>
</head>
<body>
  
    
  <script>
    let cnv;
let isMobile;
let imgAbstractiaLovingDay;
let imgVIControls;
let imgBlaqqatDevContact;
let audioPresence; 
let audioLovingOneness;   
let audioInterlopr; 
let audioLovingStandard;  
let audioGenesis; 
let button;
let fontEthnocentric;

let scene = 0; 
let fadeAlpha = 0;
let introAlpha = 0; 
let fadeRate = 5;
let showAlternateView = false;
let isCMode = false; 
let lastCycleTime = 0;
let isGMode = false;
let isGenesisMode = false; 
let showLinesMode = false; 
let wavesState = 0; 
let showMountainMode = false; 
let showHeartMode = true; 
const LERP_RATE = 0.05;
let isQuietMode = false; 
let isHushed = false;    
let showControlsMenu = false;
let isDeveloperMode = false;
let isHovering = false;
let devModeStartTime = 0;

let bubbles = []; 
let bgParticles = [];

let colorsPalette = []; 
let targetPaletteHex = [];
let paletteLerpRate = 0.015; 
let lastPaletteChangeTime = 0;
let nextPaletteChangeDelay = 10000; 

let videoProcessorFrame;
let pgO, pgW;
let videoAbstractiaFountainHires;

const PALETTE_C_MODE = ["28d6c0", "f633a2", "ecd444", "7371fc", "e57a44"];
const PALETTE_G_MODE = ["4a0c73", "f633a2", "f89221", "f9e22c", "f12b7e", "28d6c0"];
const PALETTE_EVENING_555_908 = ["355F73", "2E2255", "831D24", "3B0201", "B07E47"];
const PALETTE_MORNING_808_1110 = ["F19858", "3A0F03", "355F73", "C8B09A", "4EA89D", "AC433C", "B95E76"];
const PALETTE_AFTERNOON_1212_554 = ["DD4F5E", "920101", "355F73", "B9050E", "4EA89D", "AC433C", "B95E76", "AD8838", "460C12"];
const PALETTE_LATE_1010_443 = ["5FAD9D", "123B02", "417B32", "8BB573", "97C973", "4C792C", "AD8838", "914176", "2A431A"];

const DAY_PALETTE_DEFAULT = ["0000FF", "007FFF", "0096c7", "00b4d8", "1E90FF"];
const NIGHT_PALETTE_DEFAULT = ["4B0082", "800080", "9400D3", "9932CC", "BA55D3"];

function preload() {
  fontEthnocentric = loadFont("https://dae.transientusercontent.xyz/uploads/4d52b653-e4a3-4bd1-822c-e54174d52181"); 
  imgAbstractiaLovingDay = loadImage("https://dae.transientusercontent.xyz/uploads/094f73fa-402e-490b-ae94-96563a9cd0d9");
  imgVIControls = loadImage("https://dae.transientusercontent.xyz/uploads/87bb683d-f32e-417e-a02e-75788f11cd73"); 
  imgBlaqqatDevContact = loadImage("https://dae.transientusercontent.xyz/uploads/da2ae626-093c-4129-95c9-d8c6d90af274");
  
  audioLovingOneness = loadSound("https://dae.transientusercontent.xyz/uploads/452d787f-bee5-4646-a66d-17414bb18da8"); 
  audioLovingStandard = loadSound("https://dae.transientusercontent.xyz/uploads/6495615e-b429-45c9-8dfb-c92bd7d84e1c"); 
  
  audioPresence = loadSound("https://dae.transientusercontent.xyz/uploads/29c38ae5-bd52-4a53-80b8-670c28196c76"); 
  audioInterlopr = loadSound("https://dae.transientusercontent.xyz/uploads/93eeb7f7-2549-4b9f-8c96-3222014ba270");
  audioGenesis = loadSound("https://dae.transientusercontent.xyz/uploads/eb2550c4-b13e-477f-86ce-2f847b16136a");
}

function getPaletteByTime() {
    if (isGMode) return { colors: PALETTE_G_MODE, type: "G_MODE" };
    if (isCMode) return { colors: PALETTE_C_MODE, type: "CYCLING" };
    
    let h = hour();
    let m = minute();
    let totalMins = h * 60 + m;
    
    if (totalMins >= 1075 && totalMins <= 1268) return { colors: PALETTE_EVENING_555_908, type: "EVENING" };
    if (totalMins >= 488 && totalMins <= 670) return { colors: PALETTE_MORNING_808_1110, type: "MORNING" };
    if (totalMins >= 732 && totalMins <= 1074) return { colors: PALETTE_AFTERNOON_1212_554, type: "AFTERNOON" };
    if (totalMins >= 1330 || totalMins <= 283) return { colors: PALETTE_LATE_1010_443, type: "LATE_NIGHT" };
    
    if (h >= 20 || h < 6) return { colors: NIGHT_PALETTE_DEFAULT, type: "NIGHT" };
    return { colors: DAY_PALETTE_DEFAULT, type: "DAY" };
}

function setup() {
  cnv = createCanvas(windowWidth, windowHeight);
  imageMode(CENTER);
  isMobile = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && width < 767;
  cnv.elt.style.touchAction = 'none';
  cnv.elt.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
  
  pgO = createGraphics(windowWidth, windowHeight);
  pgW = createGraphics(windowWidth, windowHeight);

  videoAbstractiaFountainHires = createVideo('https://dae.transientusercontent.xyz/uploads/a4d44ed0-4f96-4ae3-afc3-2d462435e053');
  configureVideo(videoAbstractiaFountainHires);

  if (audioPresence) { audioPresence.setLoop(true); audioPresence.setVolume(0); }
  if (audioLovingOneness) { audioLovingOneness.setLoop(true); audioLovingOneness.setVolume(0); }
  if (audioInterlopr) { audioInterlopr.setLoop(true); audioInterlopr.setVolume(0); }
  if (audioLovingStandard) { audioLovingStandard.setLoop(true); audioLovingStandard.setVolume(0); }
  if (audioGenesis) { audioGenesis.setLoop(true); audioGenesis.setVolume(0); }

  // Inject Font Face for DOM Button
  let styleEl = createElement('style', `
    @font-face {
      font-family: 'Ethnocentric';
      src: url('https://dae.transientusercontent.xyz/uploads/4d52b653-e4a3-4bd1-822c-e54174d52181');
    }
  `);

  button = createButton('Get Abstract');
  button.mousePressed(handleDiveIn);
  button.mouseOver(() => { isHovering = true; });
  button.mouseOut(() => { isHovering = false; });
  
  styleButton();
  
  let initial = getPaletteByTime(); 
  targetPaletteHex = [...initial.colors];
  for (let hex of targetPaletteHex) colorsPalette.push(color('#' + hex));
  for (let i = 0; i < 30; i++) bgParticles.push(new BackgroundParticle());
}

function configureVideo(v) {
  v.elt.muted = true;
  v.elt.setAttribute('playsinline', '');
  v.elt.setAttribute('webkit-playsinline', '');
  v.elt.crossOrigin = 'anonymous'; 
  v.loop();
  v.hide();
}

function styleButton() {
  button.style('font-family', "'Ethnocentric', sans-serif"); 
  button.style('font-size', isMobile ? '24px' : '38px'); 
  button.style('padding', '10px 40px');
  button.style('border', 'none');
  button.style('background-color', 'transparent');
  button.style('color', 'transparent');
  button.style('-webkit-text-stroke', '1.2px white');
  button.style('cursor', 'pointer');
  button.style('white-space', 'nowrap'); 
  button.style('display', 'inline-block');
  // Lowered by an additional 15px
  button.position(width / 2 - button.width / 2, height * 0.75 + 15);
}

function updatePalette() {
  let now = millis();
  if (isCMode && now - lastCycleTime > 2000) {
      let first = targetPaletteHex.shift();
      targetPaletteHex.push(first);
      lastCycleTime = now;
  }
  if (!isCMode && now - lastPaletteChangeTime > nextPaletteChangeDelay) {
    let result = getPaletteByTime();
    let newSet = [...result.colors];
    while(newSet.length < 5) newSet.push(newSet[newSet.length - 1]);
    if (!isGMode) newSet.sort(() => random() - 0.5); 
    targetPaletteHex = newSet;
    lastPaletteChangeTime = now;
  }
}

function lerpPalettes() {
    for (let i = 0; i < targetPaletteHex.length; i++) {
        let targetColor = color('#' + targetPaletteHex[i]);
        if (colorsPalette[i]) {
            colorsPalette[i] = lerpColor(colorsPalette[i], targetColor, paletteLerpRate);
        } else {
            colorsPalette[i] = targetColor;
        }
    }
}

function keyPressed() {
  if (key === 'b' || key === 'B') {
    resetToWelcome();
  } else if (scene === 2) {
    handleInGameKeys();
  }
}

function handleInGameKeys() {
  if (key === 'a' || key === 'A') {
    showAlternateView = !showAlternateView;
    if (showAlternateView) { isDeveloperMode = false; showControlsMenu = false; }
  } else if (key === 'c' || key === 'C') {
    isCMode = !isCMode;
    isGMode = false;
    if (isCMode) {
      targetPaletteHex = [...PALETTE_C_MODE];
      lastCycleTime = millis();
    }
  } else if (key === 'g' || key === 'G') {
    isGMode = !isGMode;
    isCMode = false; 
    lastPaletteChangeTime = 0; 
  } else if (key === 'e' || key === 'E') {
    isGenesisMode = !isGenesisMode;
    if (isGenesisMode) {
      if (audioGenesis && !audioGenesis.isPlaying()) audioGenesis.loop();
    } else {
      if (audioGenesis) audioGenesis.stop();
    }
  } else if (key === 'l' || key === 'L') { 
    showLinesMode = !showLinesMode;
  } else if (key === 'w' || key === 'W') { 
    wavesState = (wavesState + 1) % 3; 
  } else if (key === 's' || key === 'S') { 
    showMountainMode = !showMountainMode;
  } else if (key === 'o' || key === 'O') { 
    showHeartMode = !showHeartMode;
  } else if (key === 'q' || key === 'Q') { 
    isQuietMode = !isQuietMode;
  } else if (key === 'h' || key === 'H') {
    isHushed = !isHushed; 
  } else if (key === 'i' || key === 'I') {
    showControlsMenu = !showControlsMenu;
    if (showControlsMenu) { isDeveloperMode = false; showAlternateView = false; }
  } else if (key === 'd' || key === 'D') { 
    isDeveloperMode = !isDeveloperMode;
    if (isDeveloperMode) { 
      showControlsMenu = false; 
      showAlternateView = false;
      devModeStartTime = millis(); 
    }
  }
}

function resetToWelcome() {
  scene = 0; fadeAlpha = 0; introAlpha = 0;
  showAlternateView = isCMode = isGMode = isGenesisMode = showLinesMode = showMountainMode = isDeveloperMode = false;
  showHeartMode = true; 
  wavesState = 0;
  if (audioPresence) audioPresence.setVolume(0);
  if (audioLovingOneness) audioLovingOneness.setVolume(0);
  if (audioInterlopr) audioInterlopr.setVolume(0);
  if (audioLovingStandard) audioLovingStandard.setVolume(0);
  if (audioGenesis) audioGenesis.stop();
  button.show();
  button.removeAttribute('disabled');
  bubbles = [];
}

function drawComplexBackground() {
  push(); blendMode((isCMode || isGMode) ? DIFFERENCE : SCREEN);
  let t = frameCount * 0.002; noStroke();
  let layers = colorsPalette.length;
  
  if (showLinesMode) {
    // Vertical Axis Mirroring for horizontal undulating column
    for (let i = 0; i < layers; i++) {
      let c = colorsPalette[i];
      fill(red(c), green(c), blue(c), 60);
      beginShape();
      for (let y = -20; y <= height + 20; y += 15) {
        let n = noise(y * 0.005, i * 0.5, t);
        let xOffset = map(n, 0, 1, 50, 400) * sin(t + y * 0.002);
        vertex(width/2 + xOffset, y);
      }
      for (let y = height + 20; y >= -20; y -= 15) {
        let n = noise(y * 0.005, i * 0.5, t);
        let xOffset = map(n, 0, 1, 50, 400) * sin(t + y * 0.002);
        vertex(width/2 - xOffset, y);
      }
      endShape(CLOSE);
    }
  } else {
    for (let i = 0; i < layers; i++) {
      let c = colorsPalette[i];
      let alpha = map(i, 0, layers, 30, 80);
      fill(red(c), green(c), blue(c), alpha);
      for (let side = -1; side <= 1; side += 2) {
        if (side === 0) continue;
        beginShape(); vertex(width/2, height);
        for (let x = 0; x <= width/2; x += 15) {
          let norm = x / (width/2);
          let n = noise(norm * 0.4, i * 0.2, t);
          let wave = sin(t * 1.5 + norm * TWO_PI) * 50;
          let y = height * 0.85 - (n * height * 0.6) + wave;
          vertex(width/2 + (x * side), y);
        }
        vertex(side === 1 ? width : 0, height); endShape(CLOSE);
      }
    }
  }
  pop();
}

function checkHeartBoundary(x, y, dSize, scaleIn = 1.0) {
  let xn = map(x, -dSize/2, dSize/2, -1.2, 1.2) / scaleIn;
  let yn = map(y, -dSize/2, dSize/2, 1.1, -1.4) / scaleIn;
  return (pow(xn*xn + yn*yn - 1, 3) - xn*xn*yn*yn*yn < 0);
}

function drawMountainPattern() {
  push(); blendMode((isCMode || isGMode) ? DIFFERENCE : SCREEN); noFill();
  let layers = 6; let cx = width / 2; let cy = height / 2 + 160;
  let dSize = min(width, height) * 0.85;
  for (let i = 0; i < layers; i++) {
    let c1 = colorsPalette[i % colorsPalette.length];
    let c2 = colorsPalette[(i + 2) % colorsPalette.length];
    if (!c1 || !c2) continue;
    let baseLineY = height / 2 + (i - 2.5) * 80;
    for (let x = -1200; x <= width + 1200; x += 40) {
      let inter = map(x, -1200, width + 1200, 0, 1);
      let lineCol = lerpColor(c1, c2, inter);
      stroke(red(lineCol), green(lineCol), blue(lineCol), map(sin(frameCount * 0.003 + i), -1, 1, 100, 210));
      strokeWeight(1.5);
      let px = x - 40;
      let p_targetY = baseLineY + map(noise(px * 0.002, i * 15, frameCount * 0.003), 0, 1, -200, 200);
      let targetY = baseLineY + map(noise(x * 0.002, i * 15, frameCount * 0.003), 0, 1, -200, 200);
      if (showHeartMode) {
        if (checkHeartBoundary(px - cx, p_targetY - cy, dSize)) p_targetY = cy - 200;
        if (checkHeartBoundary(x - cx, targetY - cy, dSize)) targetY = cy - 200;
      }
      line(px, p_targetY, x, targetY);
    }
  } pop();
}

function drawHeartWireframe(target = null) {
  let g = target || window;
  g.push();
  // Lowered by 40px (from 120 to 160)
  if (target) g.translate(g.width / 2, g.height / 2 + 160);
  else { translate(width / 2, height / 2 + 160); blendMode((isCMode || isGMode) ? EXCLUSION : SCREEN); }
  g.noFill();
  let rows = 45; let cols = 45;
  let dSize = min(width, height) * 0.8; 
  let t = frameCount * 0.015;
  let hColor = colorsPalette[colorsPalette.length - 1] || color(255);

  for (let i = 0; i < rows; i++) {
    g.stroke(red(hColor), green(hColor), blue(hColor), 220); g.strokeWeight(1.4);
    g.beginShape();
    for (let j = 0; j < cols; j++) {
      let x = map(j, 0, cols - 1, -dSize/2, dSize/2);
      let y = map(i, 0, rows - 1, -dSize/2, dSize/2);
      
      let dMouse = dist(x + width/2, y + height/2 + 160, mouseX, mouseY);
      let mouseInf = map(min(dMouse, 300), 0, 300, 45, 0);

      // Heart-shaped void logic (scaleIn 0.35 creates nested heart hole)
      if (checkHeartBoundary(x, y, dSize) && !checkHeartBoundary(x, y, dSize, 0.35)) {
        let xn = map(x, -dSize/2, dSize/2, -1.2, 1.2);
        let yn = map(y, -dSize/2, dSize/2, 1.1, -1.4);
        let heartVal = pow(xn*xn + yn*yn - 1, 3) - xn*xn*yn*yn*yn;
        let mScale = map(heartVal, -1.5, 0, 1, 0);
        let n = noise(x * 0.005, y * 0.005, t) * 320 * mScale;
        g.vertex(x + random(-mouseInf, mouseInf), y + (y < 0 ? -n : n) + random(-mouseInf, mouseInf));
      } else { g.endShape(); g.beginShape(); }
    } g.endShape();
  } g.pop();
}

function drawLModeRibs() {
    push(); blendMode((isCMode || isGMode) ? DIFFERENCE : SCREEN); noFill();
    let cx = width/2; let cy = height/2 + 160; let dSize = min(width, height) * 0.85;
    let t = frameCount * 0.01;
    let numRibs = 40;
    for (let i = 0; i < numRibs; i++) {
        let cIdx = (i + floor(frameCount/8)) % colorsPalette.length;
        let c = colorsPalette[cIdx];
        // 70% Opacity
        stroke(red(c), green(c), blue(c), 178); strokeWeight(2.5);
        
        beginShape();
        for (let y = -50; y <= height + 50; y += 30) {
            let xOffset = sin(t + y * 0.004 + i * 0.1) * 150;
            let vx = width/2 + xOffset + (i - numRibs/2) * 25;
            let vy = y;
            
            if (showHeartMode) {
                let dx = vx - cx, dy = vy - cy;
                let d = dist(vx, vy, cx, cy);
                if (d < dSize * 0.75 && d > dSize * 0.1) {
                    let angle = atan2(dy, dx);
                    vx += cos(angle) * 45 * sin(t * 12 + i);
                    vy += sin(angle) * 45 * sin(t * 12 + i);
                    let tracerCol = colorsPalette[(cIdx + 2) % colorsPalette.length];
                    stroke(red(tracerCol), green(tracerCol), blue(tracerCol), 120); 
                    if (checkHeartBoundary(dx, dy, dSize, 0.35)) { beginShape(); continue; }
                }
            }
            vertex(vx, vy);
        } endShape();
    } pop();
}

function drawFlowingVeils(target = null) {
  let g = target || window; g.push();
  if (!target) g.blendMode(ADD); g.noFill();
  let t = frameCount * 0.008; let paths = isMobile ? 8 : 15;
  let cx = width/2; let cy = height/2 + 160; let dSize = min(width, height) * 0.85;

  for (let i = 0; i < paths; i++) {
    let c = colorsPalette[i % (colorsPalette.length - 1)]; 
    if (!c) continue;
    g.stroke(red(c), green(c), blue(c), map(sin(t + i), -1, 1, 20, 100));
    g.strokeWeight(map(i, 0, paths, 2, 8)); g.beginShape();
    for (let x = -100; x <= width + 100; x += 60) {
      let yBase = map(i, 0, paths, 0, height) + noise(x * 0.003, i * 0.5, t) * height * 0.6 - height * 0.3;
      let vx = x, vy = yBase;
      if (showHeartMode) {
        let dx = vx - cx, dy = vy - cy;
        let d = dist(vx, vy, cx, cy);
        if (d < dSize * 0.65 && d > dSize * 0.1) {
            let angle = atan2(dy, dx);
            vx += cos(angle) * 20 * sin(t * 10);
            vy += sin(angle) * 20 * sin(t * 10);
            g.stroke(255, 255, 255, 180);
            if (checkHeartBoundary(dx, dy, dSize, 0.35)) { g.endShape(); g.beginShape(); continue; }
        }
      }
      g.curveVertex(vx, vy);
    } g.endShape();
  } g.pop();
}

function drawChromakeyVideo(v) {
  if (!v || v.width === 0 || v.elt.readyState < 2) return;
  if (!videoProcessorFrame || videoProcessorFrame.width !== v.width) videoProcessorFrame = createImage(v.width, v.height);
  v.loadPixels();
  if (v.pixels.length > 0) {
    videoProcessorFrame.loadPixels();
    for (let i = 0; i < v.pixels.length; i += 4) {
      let r = v.pixels[i], g = v.pixels[i+1], b = v.pixels[i+2];
      if (g > 100 && g > r * 1.15 && g > b * 1.15) videoProcessorFrame.pixels[i+3] = 0; 
      else { videoProcessorFrame.pixels[i] = r; videoProcessorFrame.pixels[i+1] = g; videoProcessorFrame.pixels[i+2] = b; videoProcessorFrame.pixels[i+3] = 255; }
    } videoProcessorFrame.updatePixels();
  }
  let ratio = max(width / videoProcessorFrame.width, height / videoProcessorFrame.height);
  image(videoProcessorFrame, width / 2, height / 2, videoProcessorFrame.width * ratio, videoProcessorFrame.height * ratio);
}

function drawDevAnimation() {
  push(); textAlign(CENTER, CENTER); textFont(fontEthnocentric);
  let privateLine = "A portal to the artist and the works";
  let urlPart1 = "get", urlPart2 = "abstract.maxximillian.art";
  let elapsed = millis() - devModeStartTime;
  let chars1 = min(floor(elapsed / 45), privateLine.length);
  let chars2 = chars1 >= privateLine.length ? min(floor((elapsed - (privateLine.length * 45) - 500) / 45), (urlPart1 + urlPart2).length) : 0;
  let cursor = (floor(frameCount / 20) % 2 === 0) ? "_" : " ";
  textSize(isMobile ? 18 : 32); fill(255, 180 + sin(frameCount * 0.04) * 50);
  text(privateLine.substring(0, chars1) + (chars1 < privateLine.length ? cursor : ""), width/2, height/2 - (isMobile ? 100 : 160));
  if (chars2 > 0) {
    textSize(isMobile ? 28 : 72);
    let color1 = colorsPalette[1] || color(255), color2 = colorsPalette[colorsPalette.length - 2] || color(200);
    let w1 = textWidth(urlPart1), totalW = w1 + textWidth(urlPart2);
    let startX = width/2 - totalW/2;
    let t2P1 = urlPart1.substring(0, min(chars2, urlPart1.length)), t2P2 = chars2 > urlPart1.length ? urlPart2.substring(0, chars2 - urlPart1.length) : "";
    for (let i = 0; i < 5; i++) {
        let alpha = map(i, 0, 5, 255, 40), yPos = height/2 + sin(frameCount * 0.05 + i * 0.8) * (isMobile ? 8 : 18);
        textAlign(LEFT, CENTER); fill(red(color1), green(color1), blue(color1), alpha);
        text(t2P1, startX, yPos + i*6); fill(red(color2), green(color2), blue(color2), alpha); text(t2P2, startX + w1, yPos + i*6);
    }
  } pop();
}

function draw() {
  updatePalette(); lerpPalettes(); background(0);
  let masterScale = isQuietMode ? 0 : 1;

  if (scene <= 1) {
    drawComplexBackground();
    for (let p of bgParticles) { p.update(); p.display(); }
    drawWelcomeScreen();
    if (audioLovingStandard && audioLovingStandard.isLoaded()) {
      audioLovingStandard.setVolume(lerp(audioLovingStandard.getVolume(), isGenesisMode ? 0 : (0.8 * masterScale), 0.02));
    }
  } else {
    drawVideoScreen(); 
    if (isGenesisMode) {
      if (audioPresence) audioPresence.setVolume(0); if (audioLovingOneness) audioLovingOneness.setVolume(0); if (audioInterlopr) audioInterlopr.setVolume(0); if (audioLovingStandard) audioLovingStandard.setVolume(0);
      if (videoAbstractiaFountainHires) videoAbstractiaFountainHires.volume(0);
      if (audioGenesis && audioGenesis.isLoaded()) audioGenesis.setVolume(lerp(audioGenesis.getVolume(), 0.9 * masterScale, LERP_RATE));
    } else {
      if (audioGenesis) audioGenesis.setVolume(0);
      if (audioPresence) audioPresence.setVolume(lerp(audioPresence.getVolume(), 0.3 * masterScale, LERP_RATE));
      
      // Loving Oneness exclusively for O mode
      if (audioLovingOneness) audioLovingOneness.setVolume(lerp(audioLovingOneness.getVolume(), (showHeartMode && !isHushed) ? 0.8 * masterScale : 0, LERP_RATE));
      if (audioInterlopr) audioInterlopr.setVolume(lerp(audioInterlopr.getVolume(), (wavesState > 0) ? 0.45 * masterScale : 0, LERP_RATE));
      
      // Default atmos when heart is off
      let atmosVol = (showHeartMode) ? 0 : 0.8 * masterScale;
      if (audioLovingStandard) audioLovingStandard.setVolume(lerp(audioLovingStandard.getVolume(), atmosVol, LERP_RATE));
      
      if (videoAbstractiaFountainHires) {
         let targetV = (showAlternateView && !isHushed) ? 1.0 * masterScale : 0;
         let v = lerp(videoAbstractiaFountainHires.volume(), targetV, LERP_RATE);
         videoAbstractiaFountainHires.volume(v); videoAbstractiaFountainHires.elt.muted = (v < 0.01);
      }
    }
    
    // Prevent flash on video loop
    if (videoAbstractiaFountainHires && videoAbstractiaFountainHires.duration() > 0) {
      if (videoAbstractiaFountainHires.time() >= videoAbstractiaFountainHires.duration() - 0.05) {
        videoAbstractiaFountainHires.time(0);
        videoAbstractiaFountainHires.play();
      }
    }

    if (showControlsMenu) drawOverlay(imgVIControls, HARD_LIGHT, 230);
    if (isDeveloperMode) drawDevAnimation();
  }
  handleSceneTransitions();
}

function handleSceneTransitions() {
  if (scene === 0) {
    introAlpha = lerp(introAlpha, 230, 0.02); 
    button.style('transform', `scale(${map(sin(frameCount * 0.05), -1, 1, 1, 1.05)})`);
    if (isHovering) { 
        let bx = width/2 + random(-100, 100);
        let by = height*0.75 + 15 + random(-10, 10);
        for (let i = 0; i < 2; i++) bubbles.push(new Bubble(bx, by)); 
    }
    for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].update(); bubbles[i].display(); if (bubbles[i].isDead()) bubbles.splice(i, 1); }
    button.show();
  } else if (scene === 1) {
    introAlpha = lerp(introAlpha, 0, 0.08); 
    fadeAlpha += fadeRate; fill(0, fadeAlpha); rect(0, 0, width, height);
    if (fadeAlpha >= 255) { 
      scene = 2; showHeartMode = true; wavesState = 0; showLinesMode = false; showMountainMode = false;
      if (audioPresence && !audioPresence.isPlaying()) audioPresence.play();
      if (audioLovingOneness && !audioLovingOneness.isPlaying()) audioLovingOneness.play();
      if (audioInterlopr && !audioInterlopr.isPlaying()) audioInterlopr.play();
    } button.hide();
  } else {
    fadeAlpha = max(0, fadeAlpha - fadeRate); if (fadeAlpha > 0) { fill(0, fadeAlpha); rect(0, 0, width, height); }
    button.hide();
  }
}

function drawWelcomeScreen() {
  if (!imgAbstractiaLovingDay) return;
  push(); tint(255, introAlpha); 
  let r = max(width / imgAbstractiaLovingDay.width, height / imgAbstractiaLovingDay.height);
  image(imgAbstractiaLovingDay, width / 2, height / 2, imgAbstractiaLovingDay.width * r, imgAbstractiaLovingDay.height * r);
  pop();
}

function drawVideoScreen() {
    drawComplexBackground(); if (showMountainMode) drawMountainPattern(); 
    if (showLinesMode) drawLModeRibs();
    if (showHeartMode && wavesState > 0) {
        pgO.clear(); pgW.clear();
        drawHeartWireframe(pgO); drawFlowingVeils(pgW);
        let imgM = pgO.get(), imgW = pgW.get(); imgW.mask(imgM);
        drawHeartWireframe(); push(); imageMode(CENTER); image(imgW, width/2, height/2 + 160); pop();
    } else {
        if (showHeartMode) drawHeartWireframe();
        if (wavesState > 0) drawFlowingVeils();
    }
    if (showAlternateView) drawChromakeyVideo(videoAbstractiaFountainHires);
}

function drawOverlay(media, bMode, alphaVal) {
  if (!media || media.width === 0) return;
  push(); blendMode(bMode); tint(255, alphaVal);
  let r = max(width / media.width, height / media.height);
  image(media, width / 2, height / 2, media.width * r, media.height * r);
  pop();
}

function handleDiveIn() {
  if (getAudioContext().state !== 'running') getAudioContext().resume();
  if (audioLovingStandard && !audioLovingStandard.isPlaying()) audioLovingStandard.play();
  if (scene === 0) { scene = 1; button.attribute('disabled', ''); }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight); styleButton();
  if (pgO) pgO.resizeCanvas(windowWidth, windowHeight);
  if (pgW) pgW.resizeCanvas(windowWidth, windowHeight);
}

class Bubble {
  constructor(x, y) { this.pos = createVector(x, y); this.vel = p5.Vector.fromAngle(random(-PI, 0), random(2, 5)); this.lifespan = 255; this.size = random(20, 48); }
  update() { this.pos.add(this.vel); this.vel.y -= 0.1; this.lifespan -= 4; }
  display() { push(); textSize(this.size); textAlign(CENTER, CENTER); fill(255, this.lifespan); text("💍", this.pos.x, this.pos.y); pop(); }
  isDead() { return this.lifespan < 0; }
}

class BackgroundParticle {
  constructor() { this.reset(); }
  reset() { this.pos = createVector(random(width), random(height)); this.vel = createVector(random(-0.5, 0.5), random(-0.2, -0.8)); this.size = random(2, 6); this.alpha = random(50, 150); }
  update() { this.pos.add(this.vel); if (this.pos.y < -10) this.pos.y = height + 10; }
  display() { push(); noStroke(); let c = colorsPalette[floor(random(colorsPalette.length))]; if (c) fill(red(c), green(c), blue(c), this.alpha); circle(this.pos.x, this.pos.y, this.size); pop(); }
}
