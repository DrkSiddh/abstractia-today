<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ABSTRACTIA</title>
<style>
  /* ============================================================
     FONT POOL — served from the shared library, cached across
     every work. Sovereign. No CDN anywhere in this file.
     ============================================================ */
  @font-face{font-family:'ZY Harmony';src:url('library/fonts/ZY_Harmony.ttf')}
  @font-face{font-family:'ZY Twinkle';src:url('library/fonts/ZY_Twinkle.ttf')}
  @font-face{font-family:'Pollo Pueblo';src:url('library/fonts/Pollo_Pueblo.ttf')}
  @font-face{font-family:'AlphaMusicMan';src:url('library/fonts/AlphaMusicMan.ttf')}
  @font-face{font-family:'Atomic Marker';src:url('library/fonts/Atomic_Marker.ttf')}
  @font-face{font-family:'Shizuru';src:url('library/fonts/Shizuru-Regular.ttf')}
  @font-face{font-family:'Kingthings Pique';src:url('library/fonts/Kingthings_Pique_n_meex.ttf')}
  @font-face{font-family:'Rock3D';src:url('library/fonts/Rock3D-Regular.ttf')}
  @font-face{font-family:'Futura Light';src:url('library/fonts/FuturaLTPro-Light.ttf')}
  /* ZY Superb — drop the file in library/fonts/ and uncomment:
  @font-face{font-family:'ZY Superb';src:url('library/fonts/ZY_Superb.ttf')}
  */

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* CTA — Rock3D, always Rock3D, only Rock3D */
  #beginBtn{
    position:fixed;left:50%;bottom:16%;transform:translateX(-50%);
    font-family:'Rock3D',Georgia,serif;font-size:40px;letter-spacing:4px;
    padding:16px 38px;border:none;border-radius:8px;cursor:pointer;
    color:#fff;background:transparent;white-space:nowrap;z-index:10;
    text-shadow:0 0 24px rgba(255,255,255,0.55);
    transition:text-shadow 0.3s;
  }
  #beginBtn:hover{text-shadow:0 0 46px rgba(255,255,255,0.95)}

  #hint{
    position:fixed;left:50%;bottom:7%;transform:translateX(-50%);
    font-family:'Futura Light',Georgia,serif;font-size:25px;letter-spacing:3px;
    color:rgba(255,255,255,0.88);z-index:10;pointer-events:none;
    opacity:0;transition:opacity 1.2s ease;text-align:center;white-space:nowrap;
    text-shadow:0 0 18px rgba(0,0,0,0.6);
  }
  #hint.on{opacity:1}
</style>
</head>
<body>
<canvas id="art"></canvas>
<button id="beginBtn">Get Abstract</button>
<div id="hint">PRESS I FOR THE MENU &middot; OR TAP WITH TWO FINGERS</div>

<script>
"use strict";
/* ============================================================
   ABSTRACTIA — LITE TEMPLATE
   Zero external graphics. Pure code, pure typography, pure
   gradient. The ultra-lightweight member of the family.
   Fonts + optional sound stems come from the shared library.
   ============================================================ */

const WORK = {
  number: 0,                 // set per work
  numeral: "",               // set per work
  title: "ABSTRACTIA",
  credit1: "INTERACTIVE FINE ART",
  credit2: "by Maxximillian",
  telegram: "t.me/abstractians",

  // ---- TITLE FONT — pick one from the pool -------------------
  // Options: "ZY Harmony" | "ZY Twinkle" | "Pollo Pueblo" |
  //          "AlphaMusicMan" | "Atomic Marker" | "Shizuru" |
  //          "Kingthings Pique" | "ZY Superb" (once the file lands)
  titleFont: "ZY Harmony",

  // ---- SOUND STEMS — layered, with hierarchy ------------------
  // Oneness is the floor, always present. Waves and Lines fade in
  // when their mode wakes. All optional — "" skips gracefully.
  sounds: {
    base:    "library/sounds/",
    oneness: "",              // e.g. "oneness/floor-01.mp3"
    waves:   "",              // e.g. "waves/stem-03.mp3"
    lines:   ""               // e.g. "lines/stem-02.mp3"
  },

  // ---- TIME PALETTES (8 hexes each) ---------------------------
  palettes: {
    MORNING: ["dff6ff","caf0f8","ade8f4","90e0ef","bde0fe","a2d2ff","cdb4db","ffc8dd"],
    DAY:     ["03045e","023e8a","0077b6","0096c7","00b4d8","48cae4","90e0ef","ade8f4"],
    SUNSET:  ["ae7981","543d4f","2d2c34","62354c","36222b","6d3b47","8a4a5c","ff8c69"],
    NIGHT:   ["10002b","240046","3c096c","5a189a","7b2cbf","9d4edd","c77dff","e0aaff"],
    GRASS:   ["004b23","006400","007200","008000","38b000","70e000","9ef01a","ccff33"]
  },
  schedule: [
    { from:"05:00", to:"10:59", palette:"MORNING" },
    { from:"11:00", to:"17:59", palette:"DAY"     },
    { from:"18:00", to:"20:59", palette:"SUNSET"  },
    { from:"21:00", to:"04:59", palette:"NIGHT"   }
  ],
  grassWindow: { from:"16:20", to:"16:43" },  // Touching Grass Mode

  // ---- LAGNIAPPE (typographic) --------------------------------
  // key -> lines of hidden text, drawn in the title font over the
  // living gradient. Never listed in the menu. Sauce stays secret.
  // Example: "s": ["FOR THE ONES", "WHO STAYED"]
  lagniappe: {}
};

/* ============================================================
   ENGINE
   ============================================================ */

const cv = document.getElementById("art");
const ctx = cv.getContext("2d");
const beginBtn = document.getElementById("beginBtn");
const hintEl = document.getElementById("hint");

const UI_FONT = "Futura Light";
const CTA_FONT = "Rock3D";

let W = 0, H = 0, frame = 0;
let scene = 0;
let fadeAlpha = 0;
const FADE_RATE = 6;

let modeLines = false;       // L
let modeWaves = false;       // W
let modeQuiet = false;       // Q
let modeMenu = false;        // I
let modeDev = false;         // D — typographic community card
let activeLagniappe = null;

// C — Color shift: the collector holds the remote.
// -1 = live time. Otherwise locked to a palette of their choosing.
let colorShiftIdx = -1;
const SHIFT_ORDER = ["MORNING","DAY","SUNSET","NIGHT","GRASS"];

let currentPalette = [];
let targetKey = "";
const LERP_RATE = 0.015;

let menuHits = [];
let devHits = [];

/* ---------- helpers ---------- */
function hexToRgb(h){
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function minutesOf(str){
  const p = str.split(":");
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function nowMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function inWindow(now, from, to){
  const f = minutesOf(from), t = minutesOf(to);
  return f <= t ? (now >= f && now <= t) : (now >= f || now <= t);
}
function paletteKeyForNow(){
  const now = nowMinutes();
  if(inWindow(now, WORK.grassWindow.from, WORK.grassWindow.to)) return "GRASS";
  for(const s of WORK.schedule){
    if(inWindow(now, s.from, s.to)) return s.palette;
  }
  return "DAY";
}
function activePaletteKey(){
  return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : paletteKeyForNow();
}
function lerp(a,b,t){ return a + (b-a)*t; }
function rgba(c, a){ return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")"; }
function lerpRgb(c1, c2, t){
  return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)];
}

/* ---------- palette lifecycle ---------- */
function snapPalette(key){
  targetKey = key;
  currentPalette = WORK.palettes[key].map(hexToRgb);
}
function updatePalette(){
  const key = activePaletteKey();
  if(key !== targetKey) targetKey = key;
  const target = WORK.palettes[targetKey].map(hexToRgb);
  for(let i=0;i<8;i++){
    currentPalette[i] = lerpRgb(currentPalette[i], target[i], LERP_RATE);
  }
}

/* ---------- SOUND STEMS — the mix IS the state ---------- */
const stems = { oneness:null, waves:null, lines:null };
const stemVol = { oneness:0, waves:0, lines:0 };
function loadStems(){
  for(const name of ["oneness","waves","lines"]){
    const file = WORK.sounds[name];
    if(!file) continue;
    const a = new Audio(WORK.sounds.base + file);
    a.loop = true; a.volume = 0;
    stems[name] = a;
  }
}
function startStems(){
  // begun inside the user gesture so autoplay never blocks
  for(const k in stems){ if(stems[k]) stems[k].play().catch(function(){}); }
}
function stopStems(){
  for(const k in stems){
    if(stems[k]){ stems[k].pause(); stems[k].currentTime = 0; stemVol[k] = 0; }
  }
}
function mixStems(){
  // hierarchy: oneness is the floor and politely ducks as layers
  // arrive; waves and lines ride on top; Q fades the whole stack
  const layers = (modeWaves?1:0) + (modeLines?1:0);
  const t = {
    oneness: modeQuiet ? 0 : Math.max(0.22, 0.5 - 0.12*layers),
    waves:   (modeQuiet || !modeWaves) ? 0 : 0.45,
    lines:   (modeQuiet || !modeLines) ? 0 : 0.45
  };
  for(const k in stems){
    if(!stems[k]) continue;
    stemVol[k] = lerp(stemVol[k], t[k], 0.05);
    stems[k].volume = Math.max(0, Math.min(1, stemVol[k]));
  }
}

/* ---------- THE OMBRE — smooth mode, the serene default ------ */
const strip = document.createElement("canvas");
const stripCtx = strip.getContext("2d");
function drawOmbre(targetCtx, w, h){
  strip.width = 1;
  strip.height = h;
  const id = stripCtx.createImageData(1, h);
  const d = id.data;
  const n = 8;
  const dNow = new Date();
  const timeFactor = (dNow.getHours() + dNow.getMinutes()/60) * 0.1;
  const scroll = -frame * 0.01;
  for(let y=0; y<h; y++){
    let pos = (y/h) * (n - 1.001) + scroll + timeFactor * 0.5;
    pos = pos % n; if(pos < 0) pos += n;
    const i1 = Math.floor(pos), i2 = (i1+1) % n, t = pos % 1;
    const c = lerpRgb(currentPalette[i1], currentPalette[i2], t);
    const k = y*4;
    d[k]=c[0]; d[k+1]=c[1]; d[k+2]=c[2]; d[k+3]=255;
  }
  stripCtx.putImageData(id, 0, 0);
  targetCtx.imageSmoothingEnabled = false;
  targetCtx.drawImage(strip, 0, 0, w, h);
  targetCtx.imageSmoothingEnabled = true;
}

/* ---------- WAVES — the exact original motion ---------- */
function drawWaves(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 2;
  const numLines = 50;
  for(let i=0; i<numLines; i++){
    const y = (i/numLines) * H;
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    for(let x=0; x<W; x+=10){
      const t = x / W;
      const c = lerpRgb(c1, c2, t);
      const y1 = y + Math.sin(frame*0.025 + y*0.01)*50 + Math.sin(frame*0.015 + x*0.02)*20;
      const y2 = y + Math.sin(frame*0.025 + y*0.01)*50 + Math.sin(frame*0.015 + (x+10)*0.02)*20;
      ctx.strokeStyle = rgba(c, 0.7);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+10, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- LINES — the exact original shimmer ---------- */
function drawLines(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 1.5;
  const numLines = 150;
  for(let i=0; i<numLines; i++){
    const y = i * (H/numLines);
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    for(let x=0; x<W; x+=20){
      const t = x / W;
      const c = lerpRgb(c1, c2, t);
      const y1 = y + Math.sin(frame*0.03 + y*0.01)*10 + Math.sin(frame*0.01 + x*0.02)*5;
      const y2 = y + Math.sin(frame*0.03 + y*0.01)*10 + Math.sin(frame*0.01 + (x+20)*0.02)*5;
      ctx.strokeStyle = rgba(c, 0.7);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+20, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- OPENING — the title IS the opening movie --------- */
function drawOpening(){
  drawOmbre(ctx, W, H);
  const title = WORK.title;
  const size = Math.min(W * 0.115, H * 0.2, 160);

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = size + "px '" + WORK.titleFont + "',Georgia,serif";
  const letters = title.split("");
  const widths = letters.map(function(ch){ return ctx.measureText(ch).width; });
  const spacing = size * 0.05;
  const total = widths.reduce(function(a,b){return a+b;},0) + spacing*(letters.length-1);
  let x = W/2 - total/2;
  const baseY = H * 0.38;

  for(let i=0;i<letters.length;i++){
    const c = currentPalette[(i + Math.floor(frame*0.02)) % 8];
    const yOff = Math.sin(frame*0.03 + i*0.7) * size*0.06;
    ctx.shadowColor = rgba(c, 0.9);
    ctx.shadowBlur = 28 + Math.sin(frame*0.05 + i)*10;
    ctx.fillStyle = "rgba(255,255,255,0.96)";
    ctx.fillText(letters[i], x + widths[i]/2, baseY + yOff);
    x += widths[i] + spacing;
  }

  // the credit — Interactive Fine Art by Maxximillian
  ctx.shadowBlur = 0;
  const credSize = Math.max(24, size * 0.2);
  ctx.font = credSize + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawTracked(WORK.credit1, W/2, baseY + size*0.72, credSize*0.35);
  const c2 = currentPalette[6];
  ctx.fillStyle = rgba(c2, 0.95);
  drawTracked(WORK.credit2, W/2, baseY + size*0.72 + credSize*1.7, credSize*0.18);

  if(WORK.numeral){
    ctx.font = (size*0.34) + "px '" + UI_FONT + "',Georgia,serif";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    drawTracked(WORK.numeral, W/2, baseY + size*0.72 + credSize*3.6, credSize*0.3);
  }
  ctx.restore();

  const s = 1 + Math.sin(frame*0.05)*0.025;
  beginBtn.style.transform = "translateX(-50%) scale(" + s + ")";
}
// letterspaced centered text — canvas has no letter-spacing of its own
function drawTracked(text, cx, y, track){
  const chars = text.split("");
  const widths = chars.map(function(ch){ return ctx.measureText(ch).width; });
  const total = widths.reduce(function(a,b){return a+b;},0) + track*(chars.length-1);
  let x = cx - total/2;
  for(let i=0;i<chars.length;i++){
    ctx.fillText(chars[i], x + widths[i]/2, y);
    x += widths[i] + track;
  }
}

/* ---------- COMMUNITY CARD (D) — typography only -------------
   The Telegram doorway, drawn in code, tappable on any device. */
function drawCommunityCard(){
  devHits = [];
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.68)";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const big = Math.min(W*0.09, H*0.11, 96);
  ctx.font = big + "px '" + WORK.titleFont + "',Georgia,serif";
  const c = currentPalette[5];
  ctx.shadowColor = rgba(c, 0.9);
  ctx.shadowBlur = 30;
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  ctx.fillText("ABSTRACTIANS", W/2, H*0.34);

  ctx.shadowBlur = 0;
  const sub = Math.max(25, big*0.32);
  ctx.font = sub + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawTracked("THE DAILY RITUAL, DELIVERED", W/2, H*0.34 + big*0.95, sub*0.25);

  // the link — a real doorway, boxed and glowing
  const linkSize = Math.max(28, Math.min(W*0.05, 44));
  ctx.font = linkSize + "px '" + UI_FONT + "',Georgia,serif";
  const lw = ctx.measureText(WORK.telegram).width;
  const boxW = lw + linkSize*2.2, boxH = linkSize*2.4;
  const boxX = W/2 - boxW/2, boxY = H*0.56 - boxH/2;
  ctx.fillStyle = rgba(c, 0.18);
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = rgba(c, 0.95);
  ctx.lineWidth = 2;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.fillText(WORK.telegram, W/2, H*0.56);
  devHits.push({ x:boxX, y:boxY, w:boxW, h:boxH, act:"link" });

  ctx.font = "24px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("tap to join \u00b7 tap anywhere else to return", W/2, H*0.56 + boxH);
  ctx.restore();
}

/* ---------- LAGNIAPPE — typographic, from the config ---------- */
function drawLagniappe(){
  const linesArr = WORK.lagniappe[activeLagniappe];
  if(!linesArr) return;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const size = Math.min(W*0.08, H*0.12, 90);
  ctx.font = size + "px '" + WORK.titleFont + "',Georgia,serif";
  const startY = H/2 - ((linesArr.length-1)*size*1.3)/2;
  for(let i=0;i<linesArr.length;i++){
    const c = currentPalette[(i*2+1) % 8];
    ctx.shadowColor = rgba(c, 0.95);
    ctx.shadowBlur = 34;
    ctx.fillStyle = "rgba(255,255,255,0.97)";
    ctx.fillText(linesArr[i], W/2, startY + i*size*1.3);
  }
  ctx.restore();
}

/* ---------- INTERACTIVE MENU ---------- */
const MENU_ROWS = [
  { k:"w", label:"Waves" },
  { k:"l", label:"Lines" },
  { k:"c", label:"Color shift" },
  { k:"q", label:"All quiet" },
  { k:"d", label:"Community" },
  { k:"b", label:"Begin again" },
  { k:"x", label:"Close menu" }
];
function stateText(k){
  if(k==="w") return modeWaves ? "ON" : "OFF";
  if(k==="l") return modeLines ? "ON" : "OFF";
  if(k==="q") return modeQuiet ? "ON" : "OFF";
  if(k==="c") return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : "LIVE";
  return "";
}
function stateOn(k){
  if(k==="w") return modeWaves;
  if(k==="l") return modeLines;
  if(k==="q") return modeQuiet;
  if(k==="c") return colorShiftIdx >= 0;
  return false;
}
function drawMenu(){
  menuHits = [];
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.62)";
  ctx.fillRect(0,0,W,H);

  ctx.textBaseline = "middle";
  const fs = Math.max(26, Math.min(W,H)*0.04);
  const rowH = Math.max(56, fs*2.1);
  const startY = H/2 - (MENU_ROWS.length*rowH)/2;
  const rowW = Math.min(W*0.86, 560);
  const rowX = W/2 - rowW/2;

  for(let i=0;i<MENU_ROWS.length;i++){
    const r = MENU_ROWS[i];
    const y = startY + i*rowH;
    const on = stateOn(r.k);
    const c = currentPalette[i % 8];

    ctx.fillStyle = on ? rgba(c, 0.38) : "rgba(255,255,255,0.07)";
    ctx.fillRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    if(on){
      ctx.strokeStyle = rgba(c, 0.95);
      ctx.lineWidth = 2;
      ctx.strokeRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    }

    ctx.font = fs + "px '" + UI_FONT + "',Georgia,serif";
    ctx.textAlign = "left";
    ctx.fillStyle = rgba(c, 1);
    ctx.fillText(r.k === "x" ? "\u2715" : r.k.toUpperCase(), rowX + rowW*0.06, y + rowH/2);

    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText(r.label, rowX + rowW*0.17, y + rowH/2);

    const st = stateText(r.k);
    if(st){
      ctx.textAlign = "right";
      ctx.fillStyle = on ? rgba(c,1) : "rgba(255,255,255,0.3)";
      ctx.fillText(st, rowX + rowW*0.94, y + rowH/2);
    }

    menuHits.push({ x:rowX, y:y, w:rowW, h:rowH, k:r.k });
  }

  ctx.textAlign = "center";
  ctx.font = Math.max(24, fs*0.75) + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  const tag = "ABSTRACTIA" + (WORK.numeral ? " " + WORK.numeral : "");
  ctx.fillText(tag, W/2, startY + MENU_ROWS.length*rowH + rowH*0.5);
  ctx.restore();
}

/* ---------- LIVE SCENE ---------- */
function drawLive(){
  drawOmbre(ctx, W, H);        // Smooth — the serene default
  if(modeLines) drawLines();
  if(modeWaves) drawWaves();
  if(activeLagniappe) drawLagniappe();
  if(modeDev) drawCommunityCard();
  if(modeMenu) drawMenu();
}

/* ---------- main loop ---------- */
function loop(){
  frame++;
  updatePalette();
  ctx.clearRect(0,0,W,H);

  if(scene === 0){
    drawOpening();
  } else if(scene === 1){
    drawOpening();
    fadeAlpha += FADE_RATE;
    ctx.fillStyle = "rgba(0,0,0," + Math.min(1, fadeAlpha/255) + ")";
    ctx.fillRect(0,0,W,H);
    if(fadeAlpha >= 255){
      fadeAlpha = 255;
      scene = 2;
      beginBtn.style.display = "none";
      showHint();
    }
  } else {
    drawLive();
    mixStems();
    if(fadeAlpha > 0){
      fadeAlpha -= FADE_RATE;
      ctx.fillStyle = "rgba(0,0,0," + Math.max(0, fadeAlpha/255) + ")";
      ctx.fillRect(0,0,W,H);
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- hint: after Begin, gone in eight seconds ---------- */
let hintTimer = null;
function showHint(){
  hintEl.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ hintEl.classList.remove("on"); }, 8000);
}

/* ---------- one brain for keyboard AND touch ---------- */
function resetToOpening(){
  scene = 0; fadeAlpha = 0;
  modeLines = modeWaves = modeQuiet = modeMenu = modeDev = false;
  activeLagniappe = null;
  colorShiftIdx = -1;
  stopStems();
  beginBtn.style.display = "block";
  hintEl.classList.remove("on");
  snapPalette(paletteKeyForNow());
}
function toggleMode(k){
  if(k === "b"){ if(scene > 0) resetToOpening(); return; }
  if(scene !== 2) return;
  if(k === "c"){
    // Color shift — cycle the palettes, land back on live time
    colorShiftIdx++;
    if(colorShiftIdx >= SHIFT_ORDER.length) colorShiftIdx = -1;
  }
  else if(k === "l"){ modeLines = !modeLines; }
  else if(k === "w"){ modeWaves = !modeWaves; }
  else if(k === "q"){ modeQuiet = !modeQuiet; }
  else if(k === "i"){ modeMenu = !modeMenu; if(modeMenu) modeDev = false; }
  else if(k === "d"){ modeDev = !modeDev; if(modeDev) modeMenu = false; }
  else if(k === "x"){ modeMenu = false; }
  else if(WORK.lagniappe[k]){
    activeLagniappe = (activeLagniappe === k) ? null : k;
  }
}

document.addEventListener("keydown", function(e){
  toggleMode(e.key.toLowerCase());
});

/* ---------- touch + mouse ---------- */
document.addEventListener("touchstart", function(e){
  if(scene === 2 && e.touches.length === 2 && !modeMenu && !modeDev){
    modeMenu = true;
  }
}, {passive:true});

cv.addEventListener("pointerdown", function(e){
  if(scene !== 2) return;
  const x = e.clientX, y = e.clientY;

  if(modeMenu){
    for(const h of menuHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h){
        toggleMode(h.k);
        return;
      }
    }
    modeMenu = false;      // tapped the art — let it breathe
    return;
  }

  if(modeDev){
    for(const h of devHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h && h.act === "link"){
        window.open("https://" + WORK.telegram, "_blank", "noopener");
        return;
      }
    }
    modeDev = false;       // tapped outside the doorway — return to the work
  }
});

/* ---------- begin ---------- */
beginBtn.addEventListener("click", function(){
  if(scene === 0){
    startStems();          // inside the gesture — autoplay never blocks
    scene = 1;
  }
});

/* ---------- resize: square, portrait, landscape — always right */
function fit(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W; cv.height = H;
}
window.addEventListener("resize", fit);

/* ---------- boot ---------- */
fit();
snapPalette(paletteKeyForNow());
loadStems();
// make sure the canvas fonts are truly loaded before they draw
if(document.fonts && document.fonts.load){
  document.fonts.load("100px '" + WORK.titleFont + "'");
  document.fonts.load("100px '" + UI_FONT + "'");
  document.fonts.load("100px '" + CTA_FONT + "'");
}
loop();
</script>
</body>
