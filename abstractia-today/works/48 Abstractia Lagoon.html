function getPaletteByTime() {
  let h = hour();
  let m = minute();
  let totalMins = h * 60 + m;

  if (totalMins >= 671 && totalMins <= 932) return { colors: SPECIAL_PALETTE, type: "SPECIAL" };
  else if (totalMins >= 213 && totalMins <= 419) return { colors: DAWN_PALETTE_BASE, type: "DAWN" };
  else if (totalMins >= 540 && totalMins <= 790) return { colors: BRIGHTS_PALETTE, type: "BRIGHTS" };
  else if ((h === 16 && m >= 20) || (h === 17)) return { colors: LIME_PALETTE, type: "LIME" };
  else if (h >= 18 && h < 21) return { colors: TWILIGHT_PALETTE, type: "TWILIGHT" };
  else if (h >= 21 || h < 3) return { colors: NIGHT_PALETTE, type: "NIGHT" };
  else return { colors: DAY_PALETTE, type: "DAY" };
}

function processSkelevaggio() {
  if (imgSkelevaggio.width > 0 && !skelevaggioProcessed) {
    imgSkelevaggio.loadPixels();
    let w = imgSkelevaggio.width;
    let h = imgSkelevaggio.height;
    
    let maskArray = new Uint8Array(w * h).fill(255);

    // Precise geometric detection for green panels
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let i = (x + y * w) * 4;
        let r = imgSkelevaggio.pixels[i];
        let g = imgSkelevaggio.pixels[i + 1];
        let b = imgSkelevaggio.pixels[i + 2];

        // Specific chroma target #7BDF92, #7BE096 (around R:123, G:223, B:150)
        let isPanelGreen = (g > 160 && g > r * 1.3 && g > b * 1.2);
        
        // Strict Region Mapping: Only Top 50%, and NOT the bottom 60px floor
        if (y < h * 0.5 && y < h - 60 && isPanelGreen) {
          maskArray[x + y * w] = 0;
        }
      }
    }

    // Block-based density filter to isolate flat rectangular regions
    let blockMask = new Uint8Array(w * h).fill(255);
    let cellSize = 8; 
    for (let y = 0; y < h - cellSize; y += cellSize) {
      for (let x = 0; x < w - cellSize; x += cellSize) {
        let count = 0;
        for (let dy = 0; dy < cellSize; dy++) {
          for (let dx = 0; dx < cellSize; dx++) {
            if (maskArray[(x + dx) + (y + dy) * w] === 0) count++;
          }
        }
        // If the cell is sufficiently dense, treat as a geometric panel section
        if (count > (cellSize * cellSize) * 0.75) {
          for (let dy = 0; dy < cellSize; dy++) {
            for (let dx = 0; dx < cellSize; dx++) {
              blockMask[(x + dx) + (y + dy) * w] = 0;
            }
          }
        }
      }
    }

    // Geometric feathering for rounded edges of panels
    let finalAlpha = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (x < 4 || x > w - 5 || y < 4 || y > h - 5) {
          finalAlpha[x + y * w] = blockMask[x + y * w];
          continue;
        }
        let sum = 0;
        for (let dy = -4; dy <= 4; dy++) {
          for (let dx = -4; dx <= 4; dx++) {
            sum += blockMask[(x + dx) + (y + dy) * w];
          }
        }
        finalAlpha[x + y * w] = sum / 81;
      }
    }

    let maskImg = createImage(w, h);
    maskImg.loadPixels();
    for (let i = 0; i < w * h; i++) {
      let pi = i * 4;
      let alphaVal = finalAlpha[i];
      maskImg.pixels[pi] = 255;
      maskImg.pixels[pi+1] = 255;
      maskImg.pixels[pi+2] = 255;
      maskImg.pixels[pi+3] = alphaVal; 
    }
    maskImg.updatePixels();
    
    imgSkelevaggioMasked = imgSkelevaggio.get();
    imgSkelevaggioMasked.mask(maskImg);
    skelevaggioProcessed = true;
  }
}

function startAudioContext() {
  if (getAudioContext().state !== 'running') {
    getAudioContext().resume();
  }
}

function updatePalette() {
  let result = getPaletteByTime();
  if (result.type !== lastPaletteType) {
    let newSet = [...result.colors];
    targetPaletteHex = newSet;
    lastPaletteType = result.type;
  }
}

function lerpPalettes() {
  for (let i = 0; i < targetPaletteHex.length; i++) {
    let targetColor = color('#' + targetPaletteHex[i]);
    if (colorsPalette[i]) {
      colorsPalette[i] = lerpColor(colorsPalette[i], targetColor, paletteLerpRate);
    } else {
      colorsPalette[i] = targetColor;
    }
  }
}

  } else if (key === 'a' || key === 'A') {
    if (scene === 2) {
      showAlternateView = !showAlternateView;
      if (showAlternateView) { showCompanionView = false; isDeveloperMode = false; showControlsMenu = false; }
    }
  } else if (key === 'c' || key === 'C') {
    if (scene === 2) {
      showCompanionView = !showCompanionView;
      if (showCompanionView) showAlternateView = false;
    }
  } else if (key === 'l' || key === 'L') {
    if (scene === 2) {
      lineStep = (lineStep + 1) % 5;
      if (lineStep === 0) {
        showLinesMode = false;
      } else {
        showLinesMode = true;
        if (audioAhVIHarmonics && !audioAhVIHarmonics.isPlaying()) {
          audioAhVIHarmonics.loop();
        }
      }
    }
  } else if (key === 'z' || key === 'Z') {
    if (scene === 2) isHarmonicsMuted = !isHarmonicsMuted;
  } else if (key === 'w' || key === 'W') {
    if (scene === 2) {
      waveStep = (waveStep + 1) % 5;
      if (waveStep === 0) {
        showWavesMode = false;
        waveCount = 0;
      } else {
        showWavesMode = true;
        waveCount = waveStep * 8; 
        if (audioHarmonicWave && !audioHarmonicWave.isPlaying()) audioHarmonicWave.loop();
      }
    }
  } else if (key === 'h' || key === 'H') {
    if (scene === 2) isHushed = !isHushed;
  } else if (key === 's' || key === 'S') {
    if (scene === 2) showMountainMode = !showMountainMode;
  } else if (key === 'q' || key === 'Q') {
    if (scene === 2) isQuietMode = !isQuietMode;
  } else if (key === 'm' || key === 'M') {
    if (scene === 2) {
      isDevMuted = !isDevMuted;
      videoBlaqqatDevV.volume(isDevMuted ? 0 : 1);
    }
  } else if (key === 'i' || key === 'I') {
    if (scene === 2) {
      showControlsMenu = !showControlsMenu;
      if (showControlsMenu) {
        isDeveloperMode = false;
        showAlternateView = false;
        videoBlaqqatDevV.pause();
      }
    }
  } else if (key === 'd' || key === 'D') {
    if (scene === 2) {
      isDeveloperMode = !isDeveloperMode;
      if (isDeveloperMode) {
        showControlsMenu = false;
        showAlternateView = false;
        videoBlaqqatDevV.loop();
        videoBlaqqatDevV.volume(isDevMuted ? 0 : 1);
      } else {
        videoBlaqqatDevV.pause();
      }
    }
  }
}

function drawOmbreBackground() {
  bgScrollOffset -= 2.0;
  noFill();
  strokeWeight(3);
  const palette = colorsPalette;

  for (let y = -40; y < height + 40; y += 6) {
    let inter = ((y * 0.4 - bgScrollOffset) * 0.0006) % 1;
    if (inter < 0) inter += 1;
    let palettePos = inter * (palette.length - 1);
    let idx = floor(palettePos);
    let f = palettePos % 1;
    let finalCol = lerpColor(palette[idx], palette[(idx + 1) % palette.length], f);

    beginShape();
    stroke(finalCol);
    for (let x = -100; x <= width + 100; x += 150) {
      let dy = noise(x * 0.005, y * 0.005, frameCount * 0.01) * 80 - 40;
      vertex(x, y + dy);
    }
    endShape();
  }
}

function drawMountainPattern() {
  push();
  blendMode(SCREEN);
  noStroke();
  let layers = 18;
  let time = frameCount * 0.005;
  for (let i = 0; i < layers; i++) {
    let c = colorsPalette[i % colorsPalette.length];
    fill(red(c), green(c), blue(c), 40);
    beginShape();
    vertex(0, height);
    let layerBaseY = height * 0.3 + (i * 30);
    for (let x = -50; x <= width + 50; x += 12) {
      let n1 = noise(x * 0.002, i * 0.5, time);
      let n2 = noise(x * 0.005, i * 1.2, time * 0.5);
      let hRaw = map(n1 * 0.7 + n2 * 0.3, 0, 1, -350, 350);
      let plateau = -120; 
      let h = (hRaw < plateau) ? plateau : hRaw;
      let drift = sin(time * 0.2 + i) * 20;
      vertex(x + drift, layerBaseY + h);
    }
    vertex(width + 50, height);
    endShape(CLOSE);
  }
  pop();
}

function drawHighContrastSmokePattern() {
  push();
  blendMode(DIFFERENCE);
  noStroke();
  let layers = 22;
  let time = frameCount * 0.007;
  for (let i = 0; i < layers; i++) {
    let c = colorsPalette[i % colorsPalette.length];
    fill(red(c), green(c), blue(c), 210);
    beginShape();
    if (i % 2 === 0) {
      vertex(0, height);
      let layerBaseY = height * 0.7 - (i * 8);
      for (let x = -100; x <= width + 100; x += 15) {
        let n1 = noise(x * 0.004, i * 0.6, time);
        let n2 = noise(x * 0.001, i * 0.1, time * 0.3);
        let h = map(n1 * 0.7 + n2 * 0.3, 0, 1, -height * 0.6, height * 0.2);
        let drift = cos(time * 0.4 + i) * 45;
        vertex(x + drift, layerBaseY + h);
      }
      vertex(width + 100, height);
    } else {
      vertex(width, 0);
      let layerBaseY = height * 0.3 + (i * 8);
      for (let x = width + 100; x >= -100; x -= 15) {
        let reversedX = width - x;
        let n1 = noise(reversedX * 0.004, i * 0.6, time + 100);
        let n2 = noise(reversedX * 0.001, i * 0.1, time * 0.3 + 100);
        let h = map(n1 * 0.7 + n2 * 0.3, 0, 1, -height * 0.2, height * 0.6);
        let drift = sin(time * 0.4 + i) * 45;
        vertex(x + drift, layerBaseY + h);
      }
      vertex(0, 0);
    }
    endShape(CLOSE);
  }
  pop();
}

function drawUndulatingWavePattern() {
  push();
  blendMode(ADD);
  strokeWeight(2.5);
  noFill();
  const patternColors = colorsPalette.map(c => color(red(c), green(c), blue(c), 140));
  let numLines = waveCount;
  let time = frameCount * 0.003;
  for (let i = 0; i < numLines; i++) {
    let baseY = map(i, 0, numLines, height * 0.1, height * 0.9);
    let c1 = patternColors[i % patternColors.length];
    let c2 = patternColors[(i + 3) % patternColors.length];
    beginShape();
    for (let x = -50; x < width + 50; x += 30) {
      let y = getRollingY(x, baseY, i, time);
      let col = lerpColor(c1, c2, x / width);
      stroke(col);
      vertex(x, y);
    }
    endShape();
  }
  pop();
}

function getRollingY(x, baseY, i, time) {
  let roll = sin(x * 0.0006 - time * 1.0 + i * 0.5) * 220;
  let undulate = cos(time * 0.4 + x * 0.0012 + i * 1.1) * 90;
  let n = noise(x * 0.0012, i * 0.25, time * 0.8) * 140;
  return baseY + roll + undulate + n;
}

function drawZigZagLinePattern() {
  if (lineStep === 4) {
    drawPrismaticEcho();
    return;
  }

  push();
  blendMode(ADD);
  const patternColors = colorsPalette.map(c => {
    let r = 255 - red(c);
    let g = 255 - green(c);
    let b = 255 - blue(c);
    let cap = 220; 
    return color(min(r, cap), min(g, cap), min(b, cap));
  });
  
  let numRays = (4 + lineStep * 3);
  let baseSpeed = (1.5 + lineStep * 0.5) / 3.0; 
  if (lineStep === 3) baseSpeed /= 4.0; 

  let period = map(lineStep, 1, 4, 700, 300);
  let baseAmp = map(lineStep, 1, 4, 350, 750);
  let baseWeight = map(lineStep, 1, 4, 12, 45);

  noFill();
  
  for (let i = 0; i < numRays; i++) {
    let zFactor = sin(frameCount * (lineStep === 3 ? 0.001 : 0.005) + i * 0.4); 
    let travelSpeed = baseSpeed * (1 + zFactor * 0.3);
    let xOffset = (frameCount * travelSpeed + i * (width / numRays)) % (width + 1200) - 600;
    
    let dynamicAmp = baseAmp * (1 + cos(frameCount * 0.01 + i) * 0.15);
    let dynamicWeight = baseWeight * (1.2 + zFactor * 0.8);
    
    let c = patternColors[i % patternColors.length];

    stroke(red(c), green(c), blue(c), map(zFactor, -1, 1, 10, 45));
    strokeWeight(dynamicWeight * 5.0);
    drawSingleZigZag(xOffset, period, dynamicAmp, i, travelSpeed);

    stroke(red(c), green(c), blue(c), map(zFactor, -1, 1, 40, 95));
    strokeWeight(dynamicWeight * 2.2);
    drawSingleZigZag(xOffset, period, dynamicAmp, i, travelSpeed);

    stroke(red(c), green(c), blue(c), map(zFactor, -1, 1, 180, 255));
    strokeWeight(dynamicWeight * 0.5);
    drawSingleZigZag(xOffset, period, dynamicAmp, i, travelSpeed);
  }
  pop();
}

function drawPrismaticEcho() {
  push();
  blendMode(DIFFERENCE); 
  let time = frameCount * 0.002;
  let ribbons = 15;
  noStroke();
  
  for (let i = 0; i < ribbons; i++) {
    let c = colorsPalette[i % colorsPalette.length];
    let r = min(red(c), 200);
    let g = min(green(c), 200);
    let b = min(blue(c), 200);
    fill(r, g, b, 200);

    beginShape();
    let xBase = map(i, 0, ribbons, -100, width + 100);
    for (let y = 0; y <= height; y += 20) {
      let xOffset = sin(time + y * 0.003 + i) * 150;
      let w = map(cos(time * 0.5 + i), -1, 1, 50, 300);
      vertex(xBase + xOffset, y);
      vertex(xBase + xOffset + w, y);
    }
    for (let y = height; y >= 0; y -= 20) {
      let xOffset = sin(time + y * 0.003 + i) * 150;
      vertex(xBase + xOffset, y);
    }
    endShape(CLOSE);
  }
  pop();
}

function drawSingleZigZag(xOff, period, amp, rayIdx, speed) {
  beginShape();
  for(let y = -400; y <= height + 400; y += 40) {
    let phase = (y + frameCount * (speed * 1.5) + rayIdx * 120);
    let zig = (abs(phase % period - (period / 2)) - (period / 4)) * (amp / (period / 4));
    let sway = sin(y * 0.002 + frameCount * 0.01) * 50;
    vertex(xOff + zig + sway, y);
  }
  endShape();
}

function draw() {
  updatePalette();
  lerpPalettes();
  background(0);

  if (scene === 0 || scene === 1) {
    let d = videoAbstractiaVII.duration();
    let t = videoAbstractiaVII.time();
    let loopFade = 1.0;
    let fadeBound = 1.0;
    if (d > 0) {
      if (t < fadeBound) loopFade = map(t, 0, fadeBound, 0, 1);
      else if (t > d - fadeBound) loopFade = map(t, d - fadeBound, d, 1, 0);
    }
    videoAbstractiaVII.volume(welcomeVolume * loopFade);
    drawOmbreBackground();
    drawWelcomeScreen();

    if (scene === 0) {
      welcomeVolume = lerp(welcomeVolume, 1.0, 0.02);
      animateButton();
      handleHoverEffects();
      button.show();
    } else if (scene === 1) {
      welcomeVolume = lerp(welcomeVolume, 0, 0.12);
      handleFadeOut();
      button.hide();
    }
  }

  if (scene === 2) {
    drawVideoScreen();
    handleAudioVolume();
    if (showLagoonView) drawLagoonVideo();
    if (showControlsMenu) drawControlsImageOverlay();
    if (showAlternateView) drawAlternateImageOverlay();
    
    if (isDeveloperMode) drawDeveloperVideoGraphic();
    
    handleFadeIn();
  }
}

function drawControlsImageOverlay() {
  let img = imgControlsII;
  if (img && img.width > 0) {
    push();
    blendMode(HARD_LIGHT);
    tint(255, 255 * 0.9);
    let ratio = max(width / img.width, height / img.height);
    image(img, width / 2, height / 2, img.width * ratio, img.height * ratio);
    pop();
  }
}

function drawLagoonVideo() {
  let vid = videoAbstractiaVILagoon;
  if (vid && vid.width > 0) {
    push();
    tint(255, 255 * 0.9);
    let ratio = max(width / vid.width, height / vid.height);
    image(vid, width / 2, height / 2, vid.width * ratio, vid.height * ratio);
    pop();
  }
}

function drawDeveloperVideoGraphic() {
  let vid = videoBlaqqatDevV;
  if (vid && vid.width > 0) {
    push();
    blendMode(HARD_LIGHT); 
    tint(255, 255);
    let ratio = max(width / vid.width, height / vid.height);
    image(vid, width / 2, height / 2, vid.width * ratio, vid.height * ratio);
    pop();
  }
}

function drawAlternateImageOverlay() {
  if (!skelevaggioProcessed) processSkelevaggio();
  let img = imgSkelevaggioMasked || imgSkelevaggio;
  if (!img || img.width === 0) return;
  push();
  blendMode(BLEND);
  let ratioImg = max(width / img.width, height / img.height);
  image(img, width / 2, height / 2, img.width * ratioImg, img.height * ratioImg);
  pop();
}

function handleHoverEffects() {
  if (isHovering) {
    let centerX = (width * 0.9) - 160, centerY = height * 0.75 + 110;
    for (let i = 0; i < 2; i++) bubbles.push(new Bubble(centerX + random(-10, 10), centerY + random(-10, 10)));
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    bubbles[i].update();
    bubbles[i].display();
    if (bubbles[i].isDead()) bubbles.splice(i, 1);
  }
}

function handleAudioVolume() {
  if (audioAbstractiaIV && audioAbstractiaIV.isPlaying()) {
    let targetVolume = isQuietMode ? 0.0 : 0.5;
    audioAbstractiaIV.setVolume(lerp(audioAbstractiaIV.getVolume(), targetVolume, LERP_RATE));
  }
  
  if (audioHarmonicWave && audioHarmonicWave.isPlaying()) {
    let waveVolBase = showWavesMode ? (waveStep * 0.2) : 0;
    let targetWaveVolume = isHushed ? 0 : waveVolBase;
    audioHarmonicWave.setVolume(lerp(audioHarmonicWave.getVolume(), targetWaveVolume, LERP_RATE));
  }

  if (audioAhVIHarmonics && audioAhVIHarmonics.isPlaying()) {
    let harmonicsVolBase = showLinesMode ? 0.6 : 0;
    let targetHarmonicsVolume = isHarmonicsMuted ? 0 : harmonicsVolBase;
    audioAhVIHarmonics.setVolume(lerp(audioAhVIHarmonics.getVolume(), targetHarmonicsVolume, LERP_RATE));
  }
}

function drawWelcomeScreen() {
  if (!videoAbstractiaVII || videoAbstractiaVII.width === 0) return;
  push();
  let ratio = max(width / videoAbstractiaVII.width, height / videoAbstractiaVII.height);
  image(videoAbstractiaVII, width / 2, height / 2, videoAbstractiaVII.width * ratio, videoAbstractiaVII.height * ratio);
  pop();
}

function drawVideoScreen() {
  if (showLinesMode) {
    if (lineStep === 4) {
      let bgCol = colorsPalette[4 % colorsPalette.length];
      background(bgCol);
    } else {
      background(0); 
    }
  } else {
    drawOmbreBackground();
  }
  
  let isAModeActive = showAlternateView;
  let mediaToDraw = null;
  let baseBlendMode = BLEND;
  
  // If A Mode is active, we don't draw the gif so the ombre background shows through
  if (!isAModeActive) {
    mediaToDraw = imgAbstractLindiaGif;
    if (imgAbstractLindiaGif) imgAbstractLindiaGif.loop();
    if (videoEarthAccordingToMermaids) videoEarthAccordingToMermaids.pause();
    if (showCompanionView) baseBlendMode = SCREEN;
  }
  
  if (mediaToDraw && mediaToDraw.width > 0) {
    push();
    blendMode(baseBlendMode);
    let ratioBase = max(width / mediaToDraw.width, height / mediaToDraw.height);
    image(mediaToDraw, width / 2, height / 2, mediaToDraw.width * ratioBase, mediaToDraw.height * ratioBase);
    pop();
  }

  if (showCompanionView && !isAModeActive) drawHighContrastSmokePattern();
  if (showMountainMode) drawMountainPattern();
  if (showWavesMode) drawUndulatingWavePattern();
  if (showLinesMode) drawZigZagLinePattern();
}

function animateButton() {
  let scaleFactor = map(sin(frameCount * 0.05), -1, 1, 1, 1.05);
  button.style('transform', `translate(-50%, -55%) scale(${scaleFactor})`);
}

function handleDiveIn() {
  startAudioContext();
  if (audioOpeningIIAbstractia && audioOpeningIIAbstractia.isLoaded()) audioOpeningIIAbstractia.play();
  if (scene === 0) {
    scene = 1;
    button.attribute('disabled', '');
  }
}

function handleFadeOut() {
  fadeAlpha += fadeRate;
  fill(0, fadeAlpha);
  rect(0, 0, width, height);
  if (fadeAlpha >= 255) {
    fadeAlpha = 255;
    scene = 2;
    if (videoAbstractiaVII) videoAbstractiaVII.pause();
    if (audioAbstractiaIV && !audioAbstractiaIV.isPlaying()) audioAbstractiaIV.play();
  }
}

function handleFadeIn() {
  fadeAlpha -= fadeRate;
  fill(0, fadeAlpha);
  rect(0, 0, width, height);
  if (fadeAlpha <= 0) fadeAlpha = 0;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  if (button) button.position(width * 0.9 - 160, height * 0.75 + 110);
}

class Bubble {
  constructor(x, y) {
    this.pos = createVector(x, y);
    this.vel = p5.Vector.fromAngle(random(TWO_PI), random(2, 5));
    this.lifespan = 255;
    this.size = random(18, 36);
  }
  update() {
    this.pos.add(this.vel);
    this.vel.y = lerp(this.vel.y, -2, 0.05);
    this.vel.mult(0.98);
    this.lifespan -= 2.5;
  }
  display() {
    push();
    textSize(this.size);
    textAlign(CENTER, CENTER);
    fill(255, this.lifespan);
    text("🫧", this.pos.x, this.pos.y);
    pop();
  }
  isDead() { return this.lifespan < 0; }
}
