function getPaletteByTime() {
    if (isGMode) return { colors: PALETTE_G_MODE, type: "G_MODE" };
    if (isCMode) return { colors: PALETTE_C_MODE, type: "CUSTOM_VIBRANT" };
    let h = hour();
    let m = minute();
    let totalMins = h * 60 + m;
    
    if ((totalMins >= 671 && totalMins <= 731) || (totalMins >= 1391 || totalMins <= 11)) {
      return { colors: PALETTE_1111_1211, type: "JOYOUS_SPECTRUM" };
    }
    if (totalMins >= 12 && totalMins <= 212) return { colors: PALETTE_1212_332, type: "DEEP_NIGHT" };
    if (totalMins >= 1075 && totalMins <= 1207) return { colors: PALETTE_555_807, type: "NEON_SUNSET" };
    if (totalMins >= 427 && totalMins <= 670) return { colors: PALETTE_707_332, type: "SOFT_PLUM_LAVENDER" };
    if (totalMins > 731 && totalMins <= 932) return { colors: PALETTE_707_332, type: "SOFT_PLUM_LAVENDER" };
    if (totalMins >= 300 && totalMins < 427) return { colors: PALETTE_MORNING_GLOW, type: "MORNING_GLOW" };
    if (totalMins >= 980 && totalMins < 1075) return { colors: PALETTE_420_659, type: "EVENING_MIST" };
    if (totalMins >= 275 && totalMins < 300) return { colors: PALETTE_435_706, type: "EARLY_DAWN" };
    if (totalMins >= 1147 && totalMins <= 1207) return { colors: PALETTE_707_807, type: "VINTAGE_BERRY_PM" };
    if (totalMins >= 1208 || totalMins <= 141) return { colors: PALETTE_808_221, type: "NIGHT_FIRE" };
    if (h >= 21 || h < 3) return { colors: NIGHT_PALETTE, type: "NIGHT" };
    return { colors: DAY_PALETTE, type: "DAY" };
}

function setup() {
  cnv = createCanvas(windowWidth, windowHeight);
  imageMode(CENTER);
  isMobile = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && width < 767;
  cnv.elt.style.touchAction = 'none';
  cnv.elt.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
  
  pgO = createGraphics(windowWidth, windowHeight);
  pgW = createGraphics(windowWidth, windowHeight);

  let style = createElement('style');
  style.html(`@font-face { font-family: 'Rock3DFont'; src: url('https://dae.transientusercontent.xyz/uploads/fa827533-05e2-4540-b01f-5b7c3bcdeed4'); }`);

  video36OpenAbstractiaBday = createVideo('https://dae.transientusercontent.xyz/uploads/e0ea7b96-c2cb-4644-b9ef-204d88b1aade');
  configureVideo(video36OpenAbstractiaBday);
  video36OpenAbstractiaBday.volume(0); 

  videoAbstractiaFountainHires = createVideo('https://dae.transientusercontent.xyz/uploads/a4d44ed0-4f96-4ae3-afc3-2d462435e053');
  configureVideo(videoAbstractiaFountainHires);
  videoAbstractiaFountainHires.speed(1.0); 
  videoAbstractiaFountainHires.volume(0); 
  videoAbstractiaFountainHires.play(); 

  imgAbstractLindiaGif = createVideo('https://dae.transientusercontent.xyz/uploads/e0ea7b96-c2cb-4644-b9ef-204d88b1aade');
  configureVideo(imgAbstractLindiaGif);
  imgAbstractLindiaGif.pause();

  if (audioPresence) { audioPresence.setLoop(true); audioPresence.setVolume(0); }
  if (audioAltMode) { audioAltMode.setLoop(true); audioAltMode.setVolume(0); }
  if (audioInterlopr) { audioInterlopr.setLoop(true); audioInterlopr.setVolume(0); }
  if (audioOpeningFunky) { audioOpeningFunky.setLoop(true); audioOpeningFunky.setVolume(0); }
  if (audioGenesis) { audioGenesis.setLoop(true); audioGenesis.setVolume(0); }

  button = createButton('GET ABSTRACT');
  button.mousePressed(handleDiveIn);
  button.mouseOver(() => { isHovering = true; });
  button.mouseOut(() => { isHovering = false; });
  
  styleButton();
  
  let initial = getPaletteByTime(); 
  targetPaletteHex = [...initial.colors];
  for (let hex of targetPaletteHex) colorsPalette.push(color('#' + hex));
  for (let hex of BRIGHTS_PALETTE) brightsColors.push(color('#' + hex));
  for (let i = 0; i < 30; i++) bgParticles.push(new BackgroundParticle());

function configureVideo(v) {
  v.elt.muted = true;
  v.elt.setAttribute('playsinline', '');
  v.elt.setAttribute('webkit-playsinline', '');
  v.elt.crossOrigin = 'anonymous'; 
  v.loop();
  v.hide();
}

function styleButton() {
  button.style('font-family', 'Rock3DFont, sans-serif'); 
  button.style('font-size', '38px'); 
  button.style('padding', '10px 40px');
  button.style('border', 'none');
  button.style('background-color', 'transparent');
  button.style('color', 'transparent');
  button.style('-webkit-text-stroke', '1.2px white');
  button.style('cursor', 'pointer');
  button.style('white-space', 'nowrap'); 
  button.style('display', 'inline-block');
  button.position(width * 0.9 - 265, height * 0.75 + 110);
}

function updatePalette() {
  let now = millis();
  if (now - lastPaletteChangeTime > nextPaletteChangeDelay) {
    let result = getPaletteByTime();
    let newSet = [...result.colors];
    while(newSet.length < 10) newSet.push(newSet[newSet.length - 1]);
    if (!isGMode && !isCMode) newSet.sort(() => random() - 0.5); 
    targetPaletteHex = newSet;
    nextPaletteChangeDelay = random(8, 20) * 1000;
    lastPaletteChangeTime = now;
  }
}

function lerpPalettes() {
    for (let i = 0; i < targetPaletteHex.length; i++) {
        let targetColor = color('#' + targetPaletteHex[i]);
        if (colorsPalette[i]) {
            colorsPalette[i] = lerpColor(colorsPalette[i], targetColor, paletteLerpRate);
        } else {
            colorsPalette[i] = targetColor;
        }
    }
}

function keyPressed() {
  if (key === 'b' || key === 'B') {
    resetToWelcome();
  } else if (scene === 2) {
    handleInGameKeys();
  }
}

function handleInGameKeys() {
  if (key === 'a' || key === 'A') {
    showAlternateView = !showAlternateView;
    if (showAlternateView) { isDeveloperMode = false; showControlsMenu = false; }
  } else if (key === 'c' || key === 'C') {
    targetPaletteHex.push(targetPaletteHex.shift());
    isCMode = true; 
    isGMode = false;
  } else if (key === 'g' || key === 'G') {
    isGMode = !isGMode;
    isCMode = false; 
    lastPaletteChangeTime = 0; 
  } else if (key === 'e' || key === 'E') {
    isGenesisMode = !isGenesisMode;
    if (isGenesisMode) {
      if (audioGenesis && !audioGenesis.isPlaying()) audioGenesis.loop();
    } else {
      if (audioGenesis) audioGenesis.stop();
    }
  } else if (key === 'l' || key === 'L') { 
    showLinesMode = !showLinesMode;
  } else if (key === 'w' || key === 'W') { 
    wavesState = (wavesState + 1) % 3; 
  } else if (key === 's' || key === 'S') { 
    showMountainMode = !showMountainMode;
  } else if (key === 'o' || key === 'O') { 
    showDiamondMode = !showDiamondMode;
  } else if (key === 'q' || key === 'Q') { 
    isQuietMode = !isQuietMode;
  } else if (key === 'h' || key === 'H') {
    isHushed = !isHushed; 
  } else if (key === 'i' || key === 'I') {
    showControlsMenu = !showControlsMenu;
    if (showControlsMenu) { isDeveloperMode = false; showAlternateView = false; }
  } else if (key === 'd' || key === 'D') { 
    isDeveloperMode = !isDeveloperMode;
    if (isDeveloperMode) { 
      showControlsMenu = false; 
      showAlternateView = false;
      devModeStartTime = millis(); 
    }
  }
}

function resetToWelcome() {
  scene = 0;
  fadeAlpha = 0;
  introAlpha = 0;
  welcomeVol = 0;
  showAlternateView = isCMode = isGMode = isGenesisMode = showLinesMode = showMountainMode = showDiamondMode = isDeveloperMode = false;
  wavesState = 0;
  imgAbstractLindiaGif.pause();
  video36OpenAbstractiaBday.stop(); 
  video36OpenAbstractiaBday.loop();
  if (audioPresence) audioPresence.setVolume(0);
  if (audioAltMode) audioAltMode.setVolume(0);
  if (audioInterlopr) audioInterlopr.setVolume(0);
  if (audioOpeningFunky) audioOpeningFunky.setVolume(0);
  if (audioGenesis) audioGenesis.stop();
  button.show();
  button.removeAttribute('disabled');
  bubbles = [];
}

function drawOmbreBackground() {
  push();
  blendMode((isCMode || isGMode) ? DIFFERENCE : SCREEN);
  bgScrollOffset -= 0.15; 
  let layerHeight = height / (colorsPalette.length - 1);
  noStroke();
  for (let i = colorsPalette.length - 1; i >= 0; i--) {
    let c = colorsPalette[i];
    let alphaVar = map(sin(frameCount * 0.01 + i), -1, 1, 80, 220);
    fill(red(c), green(c), blue(c), alphaVar);
    let baseY = (i * layerHeight - bgScrollOffset) % (height * 1.5);
    if (baseY < -layerHeight) baseY += height * 1.5;
    beginShape();
    for (let x = -1200; x <= width + 1200; x += 40) {
      vertex(x, baseY + sin(x * 0.002 + frameCount * 0.008 + i) * 110);
    }
    vertex(width + 1200, height * 2.5); 
    vertex(-1200, height * 2.5);
    endShape(CLOSE);
  }
  pop();
}

function drawMountainPattern() {
  push(); 
  blendMode((isCMode || isGMode) ? DIFFERENCE : SCREEN); 
  noFill();
  let layers = 6;
  let dActive = showDiamondMode;
  let dSize = min(width, height) * 0.95;
  let hSize = dSize / 2;
  let cx = width / 2;
  let cy = height / 2;
  for (let i = 0; i < layers; i++) {
    let c1 = colorsPalette[i % colorsPalette.length];
    let c2 = colorsPalette[(i + 3) % colorsPalette.length];
    let c3 = brightsColors[i % brightsColors.length];
    if (!c1 || !c2 || !c3) continue;
    let baseLineY = height / 2 + (i - 2.5) * 80;
    for (let x = -1200; x <= width + 1200; x += 40) {
      let inter = map(x, -1200, width + 1200, 0, 1);
      let lineCol;
      if (inter < 0.5) lineCol = lerpColor(c1, c2, inter * 2);
      else lineCol = lerpColor(c2, c3, (inter - 0.5) * 2);
      stroke(red(lineCol), green(lineCol), blue(lineCol), map(sin(frameCount * 0.003 + i), -1, 1, 100, 210));
      strokeWeight(1.5);
      let px = x - 40;
      let p_noiseVal = map(noise(px * 0.002, i * 15, frameCount * 0.003), 0, 1, -200, 200);
      let p_targetY = baseLineY + p_noiseVal;
      let noiseVal = map(noise(x * 0.002, i * 15, frameCount * 0.003), 0, 1, -200, 200);
      let targetY = baseLineY + noiseVal;
      if (dActive) {
        let pdx = abs(px - cx);
        if (pdx < hSize + 60) {
          let diamondHalfHeight = max(0, hSize - pdx);
          let topBound = cy - diamondHalfHeight - 60;
          if (p_targetY > topBound) p_targetY = topBound;
        }
        let dx = abs(x - cx);
        if (dx < hSize + 60) {
          let diamondHalfHeight = max(0, hSize - dx);
          let topBound = cy - diamondHalfHeight - 60;
          if (targetY > topBound) targetY = topBound;
        }
      }
      line(px, p_targetY, x, targetY);
    }
  } 
  pop();
}

function drawDiamondWireframe(target = null) {
  let g = target || window;
  g.push();
  if (target) g.translate(g.width / 2, g.height / 2);
  else { translate(width / 2, height / 2); blendMode((isCMode || isGMode) ? EXCLUSION : SCREEN); }
  g.noFill();
  let rows = 35;
  let cols = 35;
  let dSize = min(width, height) * 0.95; 
  let t = frameCount * 0.015;
  for (let i = 0; i < rows; i++) {
    let c = colorsPalette[i % colorsPalette.length];
    if (!c) continue;
    g.stroke(red(c), green(c), blue(c), (isCMode || isGMode) ? 255 : 220);
    g.strokeWeight(1.2);
    g.beginShape();
    for (let j = 0; j < cols; j++) {
      let x = map(j, 0, cols - 1, -dSize/2, dSize/2);
      let y = map(i, 0, rows - 1, -dSize/2, dSize/2);
      let d = abs(x) + abs(y);
      if (d <= dSize/2) {
        let mScale = map(d, 0, dSize/2, 1, 0);
        let n = noise(x * 0.005, y * 0.005, t) * 320 * mScale;
        if (y < 0) n *= -1; 
        g.vertex(x, y + n);
      }
    }
    g.endShape();
  }
  g.pop();
}

function drawFlowingVeils(target = null) {
  let g = target || window;
  g.push();
  if (!target) g.blendMode(ADD);
  g.noFill();
  let t = frameCount * 0.008;
  let paths = isMobile ? 8 : 15;
  for (let i = 0; i < paths; i++) {
    let c = colorsPalette[(i + floor(frameCount * 0.01)) % colorsPalette.length];
    if (!c) continue;
    let alpha = map(sin(t + i), -1, 1, 20, 100);
    g.stroke(red(c), green(c), blue(c), alpha);
    g.strokeWeight(map(i, 0, paths, 2, 8));
    g.beginShape();
    for (let x = -100; x <= width + 100; x += 60) {
      let yShift = noise(x * 0.003, i * 0.5, t) * height * 0.6;
      let y = map(i, 0, paths, 0, height) + yShift - (height * 0.3);
      g.curveVertex(x, y);
    }
    g.endShape();
  }
  g.pop();
}

function drawAtmosphericBloom(target = null) {
  let g = target || window;
  g.push();
  if (!target) g.blendMode(SCREEN);
  g.noStroke();
  let t = frameCount * 0.005;
  let blooms = isMobile ? 3 : 6;
  for (let i = 0; i < blooms; i++) {
    let c = colorsPalette[(i * 3 + floor(frameCount * 0.02)) % colorsPalette.length];
    if (!c) continue;
    let x = noise(t + i * 10) * width;
    let y = noise(i * 10, t + 50) * height;
    let rad = map(sin(t + i * 0.8), -1, 1, height * 0.4, height * 0.9);
    for (let j = 0; j < 5; j++) {
       let a = map(j, 0, 5, 20, 0);
       g.fill(red(c), green(c), blue(c), a);
       g.circle(x, y, rad + (j * (isMobile ? 50 : 120)));
    }
  }
  g.pop();
}

function drawWhimsicalOrganicLines() {
  push(); blendMode((isCMode || isGMode) ? DIFFERENCE : SCREEN); noFill();
  let numPaths = 22;
  let dActive = showDiamondMode;
  let dSize = min(width, height) * 0.95;
  let hSize = dSize / 2;
  let cx = width / 2;
  let cy = height / 2;
  for (let i = 0; i < numPaths; i++) {
    let c1 = colorsPalette[i % colorsPalette.length];
    let c2 = colorsPalette[(i + 4) % colorsPalette.length];
    let c3 = brightsColors[i % brightsColors.length];
    if (!c1 || !c2 || !c3) continue;
    strokeWeight(dActive ? 0.8 : (noise(i * 5, frameCount * 0.003) * 4 + 1.5));
    let yBase = (height / (numPaths + 1)) * (i + 1);
    for (let x = -1200; x <= width + 1200; x += 40) {
      let inter = map(x, -1200, width + 1200, 0, 1);
      let lineCol;
      if (inter < 0.5) lineCol = lerpColor(c1, c2, inter * 2);
      else lineCol = lerpColor(c2, c3, (inter - 0.5) * 2);
      let alph = map(sin(frameCount * 0.006 + i * 0.3), -1, 1, 120, 210);
      stroke(red(lineCol), green(lineCol), blue(lineCol), alph);
      let px = x - 40;
      let p_noiseVal = (noise(px * 0.0008, i * 1.5, frameCount * 0.003) * 600 - 300);
      let p_sineVal = sin(px * 0.0012 + frameCount * 0.009 + i * 0.8) * 110;
      let p_targetY = yBase + p_noiseVal + p_sineVal;
      let noiseVal = (noise(x * 0.0008, i * 1.5, frameCount * 0.003) * 600 - 300);
      let sineVal = sin(x * 0.0012 + frameCount * 0.009 + i * 0.8) * 110;
      let targetY = yBase + noiseVal + sineVal;
      if (dActive) {
        let pdx = abs(px - cx);
        if (pdx < hSize + 40) {
          let diamondHalfHeight = max(0, hSize - pdx);
          let topBound = cy - diamondHalfHeight - 60;
          let botBound = cy + diamondHalfHeight + 60;
          if (yBase < cy) { if (p_targetY > topBound) p_targetY = topBound; } 
          else { if (p_targetY < botBound) p_targetY = botBound; }
        }
        let dx = abs(x - cx);
        if (dx < hSize + 40) {
          let diamondHalfHeight = max(0, hSize - dx);
          let topBound = cy - diamondHalfHeight - 60;
          let botBound = cy + diamondHalfHeight + 60;
          if (yBase < cy) { if (targetY > topBound) targetY = topBound; } 
          else { if (targetY < botBound) targetY = botBound; }
        }
      }
      line(px, p_targetY, x, targetY);
    }
  } pop();
}

function drawChromakeyVideo(v) {
  if (!v) return;
  if (v.width > 0 && v.elt.readyState >= 2) {
    if (!videoProcessorFrame || videoProcessorFrame.width !== v.width || videoProcessorFrame.height !== v.height) {
      videoProcessorFrame = createImage(v.width, v.height);
    }
    v.loadPixels();
    if (v.pixels && v.pixels.length > 0) {
      videoProcessorFrame.loadPixels();
      let vPix = v.pixels, oPix = videoProcessorFrame.pixels, w = v.width, h = v.height;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let i = (x + y * w) * 4, r = vPix[i], g = vPix[i+1], b = vPix[i+2];
          if (g > 100 && g > r * 1.15 && g > b * 1.15) oPix[i+3] = 0; 
          else { oPix[i] = r; oPix[i+1] = g; oPix[i+2] = b; oPix[i+3] = 255; }
        }
      }
      videoProcessorFrame.updatePixels();
    }
  }
  if (videoProcessorFrame) {
    let ratio = max(width / videoProcessorFrame.width, height / videoProcessorFrame.height);
    image(videoProcessorFrame, width / 2, height / 2, videoProcessorFrame.width * ratio, videoProcessorFrame.height * ratio);
  }
}

function drawDevAnimation() {
  push(); textAlign(CENTER, CENTER); 
  textFont("'Plus Jakarta Sans', 'Inter', sans-serif");
  
  let privateLine = "A portal to the artist and the works";
  let urlPart1 = "get";
  let urlPart2 = "abstract.maxximillian.art";
  let urlTxt = urlPart1 + urlPart2;

  let elapsed = millis() - devModeStartTime;
  let typeSpeed = 45; 
  let chars1 = min(floor(elapsed / typeSpeed), privateLine.length);
  let chars2 = 0;
  if (chars1 >= privateLine.length) {
    chars2 = min(floor((elapsed - (privateLine.length * typeSpeed) - 500) / typeSpeed), urlTxt.length);
    chars2 = max(0, chars2);
  }
  let cursor = (floor(frameCount / 20) % 2 === 0) ? "_" : " ";
  let taglineSize = isMobile ? 24 : 52;
  let urlSize = isMobile ? 42 : 110;

  textSize(taglineSize);
  fill(255, 180 + sin(frameCount * 0.04) * 50);
  let t1 = privateLine.substring(0, chars1);
  if (chars1 < privateLine.length) t1 += cursor;
  text(t1, width / 2, height / 2 - (isMobile ? 100 : 160));

  if (chars2 > 0 || chars1 >= privateLine.length) {
    let layers = 5;
    for (let i = 0; i < layers; i++) {
      let alpha = map(i, 0, layers, 255, 40);
      let offset = sin(frameCount * 0.05 + i * 0.8) * (isMobile ? 8 : 18);
      let yPos = height / 2 + offset;
      
      let color1 = colorsPalette[1] || color(255); 
      let color2 = colorsPalette[colorsPalette.length - 2] || color(200); 

      textSize(urlSize + sin(frameCount * 0.03 + i) * 8);
      
      let w1 = textWidth(urlPart1);
      let w2 = textWidth(urlPart2);
      let totalW = w1 + w2;
      let startX = width / 2 - totalW / 2;

      let t2P1 = urlPart1.substring(0, min(chars2, urlPart1.length));
      let t2P2 = "";
      if (chars2 > urlPart1.length) {
         t2P2 = urlPart2.substring(0, chars2 - urlPart1.length);
      }

      textAlign(LEFT, CENTER);
      fill(red(color1), green(color1), blue(color1), alpha);
      text(t2P1, startX, yPos + (i * 6));
      
      fill(red(color2), green(color2), blue(color2), alpha);
      text(t2P2, startX + w1, yPos + (i * 6));
      
      if (chars2 < urlTxt.length && chars2 > 0 && i === 0) {
         let curX = startX + textWidth(t2P1 + t2P2);
         fill(255, alpha);
         text(cursor, curX, yPos);
      }
    }
  }
  pop();
}

function draw() {
  updatePalette(); lerpPalettes(); background(0);
  let masterScale = isQuietMode ? 0 : 1;

  if (scene <= 1) {
    drawOmbreBackground();
    for (let p of bgParticles) { p.update(); p.display(); }
    drawWelcomeScreen();
    video36OpenAbstractiaBday.volume(0);
    
    if (audioOpeningFunky && audioOpeningFunky.isLoaded()) {
      let targetOpening = isGenesisMode ? 0 : (0.8 * masterScale);
      audioOpeningFunky.setVolume(lerp(audioOpeningFunky.getVolume(), targetOpening, 0.02));
    }
  } else {
    drawVideoScreen(); 
    
    // Audio role management for "E" mode
    if (isGenesisMode) {
      if (audioPresence) audioPresence.setVolume(0);
      if (audioAltMode) audioAltMode.setVolume(0);
      if (audioInterlopr) audioInterlopr.setVolume(0);
      if (audioOpeningFunky) audioOpeningFunky.setVolume(0);
      if (videoAbstractiaFountainHires) videoAbstractiaFountainHires.volume(0);
      if (audioGenesis && audioGenesis.isLoaded()) {
        audioGenesis.setVolume(lerp(audioGenesis.getVolume(), 0.9 * masterScale, LERP_RATE));
      }
    } else {
      if (audioGenesis) audioGenesis.setVolume(0);
      if (audioPresence && audioPresence.isLoaded()) {
         let targetPresence = 0.3 * masterScale;
         audioPresence.setVolume(lerp(audioPresence.getVolume(), targetPresence, LERP_RATE));
      }
      if (audioAltMode && audioAltMode.isLoaded()) {
         let targetAlt = (showDiamondMode && !isHushed) ? 0.6 * masterScale : 0;
         audioAltMode.setVolume(lerp(audioAltMode.getVolume(), targetAlt, LERP_RATE));
      }
      if (audioInterlopr && audioInterlopr.isLoaded()) {
         let targetInterlopr = (wavesState > 0) ? 0.45 * masterScale : 0;
         audioInterlopr.setVolume(lerp(audioInterlopr.getVolume(), targetInterlopr, LERP_RATE));
      }
      if (audioOpeningFunky && audioOpeningFunky.isLoaded()) {
         let targetOpening = (showAlternateView) ? 0 : 0.8 * masterScale; 
         audioOpeningFunky.setVolume(lerp(audioOpeningFunky.getVolume(), targetOpening, LERP_RATE));
      }
      if (videoAbstractiaFountainHires) {
         let targetFountainVol = (showAlternateView && !isHushed) ? 1.0 * masterScale : 0;
         let nextVol = lerp(videoAbstractiaFountainHires.volume(), targetFountainVol, LERP_RATE);
         videoAbstractiaFountainHires.volume(nextVol);
         videoAbstractiaFountainHires.elt.muted = (nextVol < 0.01);
      }
    }
    
    // Trim handling for A mode video
    if (videoAbstractiaFountainHires) {
       if (videoAbstractiaFountainHires.duration() > 0) {
          if (videoAbstractiaFountainHires.time() >= videoAbstractiaFountainHires.duration() - 1.5) {
             videoAbstractiaFountainHires.time(1.0);
          }
          if (videoAbstractiaFountainHires.time() < 1.0) {
             videoAbstractiaFountainHires.time(1.0);
          }
       }
    }

    if (showControlsMenu) drawOverlay(imgVIControls, HARD_LIGHT, 230);
    if (isDeveloperMode) drawDevAnimation();
  }
  handleSceneTransitions();
}

function handleSceneTransitions() {
  if (scene === 0) {
    introAlpha = lerp(introAlpha, 230, 0.02); 
    let scaleF = map(sin(frameCount * 0.05), -1, 1, 1, 1.05);
    button.style('transform', `scale(${scaleF})`);
    if (isHovering) {
        let cx = (width * 0.9) - 265, cy = height * 0.75 + 110;
        for (let i = 0; i < 2; i++) bubbles.push(new Bubble(cx + random(0, 150), cy + random(-20, 20)));
    }
    for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].update(); bubbles[i].display(); if (bubbles[i].isDead()) bubbles.splice(i, 1); }
    button.show();
  } else if (scene === 1) {
    introAlpha = lerp(introAlpha, 0, 0.08); 
    fadeAlpha += fadeRate; fill(0, fadeAlpha); rect(0, 0, width, height);
    if (fadeAlpha >= 255) { 
      scene = 2; video36OpenAbstractiaBday.pause(); 
      if (audioPresence && !audioPresence.isPlaying()) audioPresence.play();
      if (audioAltMode && !audioAltMode.isPlaying()) audioAltMode.play();
      if (audioInterlopr && !audioInterlopr.isPlaying()) audioInterlopr.play();
    }
    button.hide();
  } else {
    fadeAlpha -= fadeRate; 
    if (fadeAlpha > 0) { fill(0, fadeAlpha); rect(0, 0, width, height); } 
    else { fadeAlpha = 0; }
  }
}

function drawWelcomeScreen() {
  if (!video36OpenAbstractiaBday || video36OpenAbstractiaBday.width === 0) return;
  let ratio = max(width / video36OpenAbstractiaBday.width, height / video36OpenAbstractiaBday.height);
  push(); tint(255, introAlpha); 
  image(video36OpenAbstractiaBday, width / 2, height / 2, video36OpenAbstractiaBday.width * ratio, video36OpenAbstractiaBday.height * ratio);
  pop();
}

function drawVideoScreen() {
    drawOmbreBackground(); 
    if (showMountainMode) drawMountainPattern(); 
    if (showLinesMode) drawWhimsicalOrganicLines();

    let wavesActive = (wavesState > 0);
    if (showDiamondMode && wavesActive) {
        pgO.clear(); pgW.clear();
        drawDiamondWireframe(pgO);
        drawFlowingVeils(pgW);
        if (wavesState === 2) drawAtmosphericBloom(pgW);
        let imgMask = pgO.get();
        let imgWaves = pgW.get();
        imgWaves.mask(imgMask);
        drawDiamondWireframe(); 
        push(); imageMode(CENTER); image(imgWaves, width/2, height/2); pop();
    } else {
        if (showDiamondMode) drawDiamondWireframe();
        if (wavesActive) drawFlowingVeils();
        if (wavesState === 2) drawAtmosphericBloom();
    }

    if (!isDeveloperMode) {
        if (!showAlternateView) {
            if (imgAbstractLindiaGif && imgAbstractLindiaGif.width > 0) {
                push(); blendMode((isCMode || isGMode) ? EXCLUSION : BLEND); 
                let r = max(width / imgAbstractLindiaGif.width, height / imgAbstractLindiaGif.height);
                image(imgAbstractLindiaGif, width / 2, height / 2, imgAbstractLindiaGif.width * r, imgAbstractLindiaGif.height * r);
                pop();
            }
        } else {
            drawChromakeyVideo(videoAbstractiaFountainHires);
        }
    }
}

function drawOverlay(media, bMode, alphaVal) {
  if (!media || media.width === 0) return;
  push(); blendMode(bMode); tint(255, alphaVal);
  let r = max(width / media.width, height / media.height);
  image(media, width / 2, height / 2, media.width * r, media.height * r);
  pop();
}

function handleDiveIn() {
  if (getAudioContext().state !== 'running') getAudioContext().resume();
  if (audioOpeningFunky && !audioOpeningFunky.isPlaying()) audioOpeningFunky.play();
  if (scene === 0) { scene = 1; button.attribute('disabled', ''); }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  if (button) button.position(width * 0.9 - 265, height * 0.75 + 110);
  if (pgO) pgO.resizeCanvas(windowWidth, windowHeight);
  if (pgW) pgW.resizeCanvas(windowWidth, windowHeight);
}

class Bubble {
  constructor(x, y) { this.pos = createVector(x, y); this.vel = p5.Vector.fromAngle(random(-HALF_PI - 0.5, -HALF_PI + 0.5), random(2, 5)); this.lifespan = 255; this.size = random(20, 48); }
  update() { this.pos.add(this.vel); this.vel.y = lerp(this.vel.y, -3, 0.05); this.vel.mult(0.98); this.lifespan -= 2.5; }
  display() { push(); textSize(this.size); textAlign(CENTER, CENTER); fill(255, this.lifespan); text("🫧", this.pos.x, this.pos.y); pop(); }
  isDead() { return this.lifespan < 0; }
}

class BackgroundParticle {
  constructor() { this.reset(); }
  reset() { this.pos = createVector(random(width), random(height)); this.vel = createVector(random(-0.5, 0.5), random(-0.2, -0.8)); this.size = random(2, 6); this.alpha = random(50, 150); }
  update() { this.pos.add(this.vel); if (this.pos.y < -10) this.pos.y = height + 10; if (this.pos.x < -10) this.pos.x = width + 10; if (this.pos.x > width + 10) this.pos.x = -10; }
  display() { push(); noStroke(); let c = colorsPalette[floor(random(colorsPalette.length))]; if (c) fill(red(c), green(c), blue(c), this.alpha); circle(this.pos.x, this.pos.y, this.size); pop(); }
}
