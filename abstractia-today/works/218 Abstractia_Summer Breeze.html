  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* CTA — Rock3D, always Rock3D, only Rock3D */
  #beginBtn{
    position:fixed;left:50%;bottom:16%;transform:translateX(-50%);
    font-family:'Rock3D',Georgia,serif;font-size:clamp(22px,8.4vw,40px);letter-spacing:clamp(2px,1vw,4px);
    padding:16px clamp(14px,4vw,38px);border:none;border-radius:8px;cursor:pointer;
    color:#fff;background:transparent;z-index:10;
    width:max-content;max-width:94vw;text-align:center;line-height:1.15;
    text-shadow:0 0 24px rgba(255,255,255,0.55);
    transition:text-shadow 0.3s;
  }
  #beginBtn:hover{text-shadow:0 0 46px rgba(255,255,255,0.95)}

  #hint{
    position:fixed;left:50%;bottom:7%;transform:translateX(-50%);
    font-family:'Futura Light',Georgia,serif;font-size:clamp(15px,4.6vw,25px);letter-spacing:clamp(1px,0.6vw,3px);
    line-height:1.5;width:max-content;max-width:90vw;text-wrap:balance;
    color:rgba(255,255,255,0.88);z-index:10;pointer-events:none;
    opacity:0;transition:opacity 1.2s ease;text-align:center;
    text-shadow:0 0 18px rgba(0,0,0,0.6);
  }
  #hint.on{opacity:1}
  /* narrow canvases: the two instructions stack on their own lines */
  @media (max-width:600px){ #hint .sep{display:none} #hint span{display:block} }

<body>
<canvas id="art"></canvas>
<button id="beginBtn">Get Abstract</button>
<div id="hint"><span>PRESS I FOR THE MENU</span><span class="sep"> &middot; </span><span>OR TAP WITH TWO FINGERS</span></div>

<script>
"use strict";
/* ============================================================
   ABSTRACTIA — LITE TEMPLATE
   Zero external graphics. Pure code, pure typography, pure
   gradient. The ultra-lightweight member of the family.
   Fonts + optional sound stems come from the shared library.
   ============================================================ */

const WORK = {
  number: 218,
  numeral: "CCXVIII",
  title: "Summer Breeze",
  series: "ABSTRACTIA",       // the series name — leads the splash, above the work title
  credit1: "INTERACTIVE FINE ART",
  credit2: "by Maxximillian",
  telegram: "t.me/abstractians",

  // ---- TITLE FONT — pick one from the pool -------------------
  // Options: "ZY Harmony" | "ZY Twinkle" | "Pollo Pueblo" |
  //          "AlphaMusicMan" | "Atomic Marker" | "Shizuru" |
  //          "Kingthings Pique" | "ZY Superb" (once the file lands)
  titleFont: "Atomic Marker",

  // ---- SOUND STEMS — layered, with hierarchy ------------------
  // Oneness is the floor, always present. Waves and Lines fade in
  // when their mode wakes. All optional — "" skips gracefully.
  sounds: {
    base:    "library/sounds/",
    oneness: "",              // e.g. "oneness/floor-01.mp3"
    waves:   "",              // e.g. "waves/stem-03.mp3"
    lines:   ""               // e.g. "lines/stem-02.mp3"
  },

  // ---- TIME PALETTES (8 hexes each) ---------------------------
  // DAY    — the base colorway (warm coral → violet), F09A5D…980DE8
  // GRASS  — the "4:20 → sunset" colorway (green → violet), 5DF062…980DE8,
  //          both share the #980DE8 landing color so GRASS eases into SUNSET
  // SUNSET — dedicated coral → deep maroon colorway, FFA994…770606
  // NIGHT  — dedicated coral-red → deep indigo colorway, FD7959…280678
  // MORNING — no colorway supplied yet; template default pastel kept as a placeholder
  palettes: {
    MORNING: ["dff6ff","caf0f8","ade8f4","90e0ef","bde0fe","a2d2ff","cdb4db","ffc8dd"],
    DAY:     ["f09a5d","e38671","d77285","ca5e98","be49ad","b135c0","a521d4","980de8"],
    SUNSET:  ["ffa994","ec9280","d87a6b","c56357","b14c43","9e352f","8a1d1a","770606"],
    NIGHT:   ["fd7959","de685e","c05862","a24866","83376b","65276f","471773","280678"],
    GRASS:   ["5df062","65d075","6eaf88","768f9c","7f6eae","874ec2","902dd5","980de8"]
  },
  schedule: [
    { from:"05:00", to:"10:59", palette:"MORNING" },
    { from:"11:00", to:"17:59", palette:"DAY"     },
    { from:"18:00", to:"20:59", palette:"SUNSET"  },
    { from:"21:00", to:"04:59", palette:"NIGHT"   }
  ],
  grassWindow: { from:"16:20", to:"16:43" },  // Touching Grass Mode

  // ---- LAGNIAPPE (typographic) --------------------------------
  // key -> lines of hidden text, drawn in the title font over the
  // living gradient. Never listed in the menu. Sauce stays secret.
  // Example: "s": ["FOR THE ONES", "WHO STAYED"]
  lagniappe: {}
};

/* ============================================================
   ENGINE
   ============================================================ */

const cv = document.getElementById("art");
const ctx = cv.getContext("2d");
const beginBtn = document.getElementById("beginBtn");
const hintEl = document.getElementById("hint");

const UI_FONT = "Futura Light";
const CTA_FONT = "Rock3D";

let W = 0, H = 0, frame = 0;
let scene = 0;
let fadeAlpha = 0;
const FADE_RATE = 6;

let modeLines = false;       // L
let modeWaves = false;       // W
let modeMenu = false;        // I
let modeDev = false;         // D — typographic community card
let activeLagniappe = null;

// C — Color shift: the collector holds the remote.
// -1 = live time. Otherwise locked to a palette of their choosing.
let colorShiftIdx = -1;
const SHIFT_ORDER = ["MORNING","DAY","SUNSET","NIGHT","GRASS"];

let currentPalette = [];
let targetKey = "";
const LERP_RATE = 0.015;

let menuHits = [];
let devHits = [];

/* ---------- helpers ---------- */
function hexToRgb(h){
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function minutesOf(str){
  const p = str.split(":");
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function nowMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function inWindow(now, from, to){
  const f = minutesOf(from), t = minutesOf(to);
  return f <= t ? (now >= f && now <= t) : (now >= f || now <= t);
}
function paletteKeyForNow(){
  const now = nowMinutes();
  if(inWindow(now, WORK.grassWindow.from, WORK.grassWindow.to)) return "GRASS";
  for(const s of WORK.schedule){
    if(inWindow(now, s.from, s.to)) return s.palette;
  }
  return "DAY";
}
function activePaletteKey(){
  return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : paletteKeyForNow();
}
function lerp(a,b,t){ return a + (b-a)*t; }
function rgba(c, a){ return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")"; }
function lerpRgb(c1, c2, t){
  return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)];
}

/* ---------- palette lifecycle ---------- */
function snapPalette(key){
  targetKey = key;
  currentPalette = WORK.palettes[key].map(hexToRgb);
}
function updatePalette(){
  const key = activePaletteKey();
  if(key !== targetKey) targetKey = key;
  const target = WORK.palettes[targetKey].map(hexToRgb);
  for(let i=0;i<8;i++){
    currentPalette[i] = lerpRgb(currentPalette[i], target[i], LERP_RATE);
  }
}

/* ---------- SOUND STEMS — the mix IS the state ---------- */
const stems = { oneness:null, waves:null, lines:null };
const stemVol = { oneness:0, waves:0, lines:0 };
function loadStems(){
  for(const name of ["oneness","waves","lines"]){
    const file = WORK.sounds[name];
    if(!file) continue;
    const a = new Audio(WORK.sounds.base + file);
    a.loop = true; a.volume = 0;
    stems[name] = a;
  }
}
function startStems(){
  // begun inside the user gesture so autoplay never blocks
  for(const k in stems){ if(stems[k]) stems[k].play().catch(function(){}); }
}
function stopStems(){
  for(const k in stems){
    if(stems[k]){ stems[k].pause(); stems[k].currentTime = 0; stemVol[k] = 0; }
  }
}
function mixStems(){
  // hierarchy: oneness is the floor and politely ducks as layers
  // arrive; waves and lines ride on top
  const layers = (modeWaves?1:0) + (modeLines?1:0);
  const t = {
    oneness: Math.max(0.22, 0.5 - 0.12*layers),
    waves:   modeWaves ? 0.45 : 0,
    lines:   modeLines ? 0.45 : 0
  };
  for(const k in stems){
    if(!stems[k]) continue;
    stemVol[k] = lerp(stemVol[k], t[k], 0.05);
    stems[k].volume = Math.max(0, Math.min(1, stemVol[k]));
  }
}

/* ---------- THE OMBRE — smooth mode, the serene default ------ */
const strip = document.createElement("canvas");
const stripCtx = strip.getContext("2d");
function drawOmbre(targetCtx, w, h){
  strip.width = 1;
  strip.height = h;
  const id = stripCtx.createImageData(1, h);
  const d = id.data;
  const n = 8;
  const dNow = new Date();
  const timeFactor = (dNow.getHours() + dNow.getMinutes()/60) * 0.1;
  const scroll = -frame * 0.01;
  for(let y=0; y<h; y++){
    let pos = (y/h) * (n - 1.001) + scroll + timeFactor * 0.5;
    pos = pos % n; if(pos < 0) pos += n;
    const i1 = Math.floor(pos), i2 = (i1+1) % n, t = pos % 1;
    const c = lerpRgb(currentPalette[i1], currentPalette[i2], t);
    const k = y*4;
    d[k]=c[0]; d[k+1]=c[1]; d[k+2]=c[2]; d[k+3]=255;
  }
  stripCtx.putImageData(id, 0, 0);
  targetCtx.imageSmoothingEnabled = false;
  targetCtx.drawImage(strip, 0, 0, w, h);
  targetCtx.imageSmoothingEnabled = true;
}

/* ---------- WAVES — the exact original motion ---------- */
function drawWaves(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 2;
  const numLines = 50;
  for(let i=0; i<numLines; i++){
    const y = (i/numLines) * H;
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    for(let x=0; x<W; x+=10){
      const t = x / W;
      const c = lerpRgb(c1, c2, t);
      const y1 = y + Math.sin(frame*0.025 + y*0.01)*50 + Math.sin(frame*0.015 + x*0.02)*20;
      const y2 = y + Math.sin(frame*0.025 + y*0.01)*50 + Math.sin(frame*0.015 + (x+10)*0.02)*20;
      ctx.strokeStyle = rgba(c, 0.7);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+10, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- LINES — the exact original shimmer ---------- */
function drawLines(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 1.5;
  const numLines = 150;
  for(let i=0; i<numLines; i++){
    const y = i * (H/numLines);
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    for(let x=0; x<W; x+=20){
      const t = x / W;
      const c = lerpRgb(c1, c2, t);
      const y1 = y + Math.sin(frame*0.03 + y*0.01)*10 + Math.sin(frame*0.01 + x*0.02)*5;
      const y2 = y + Math.sin(frame*0.03 + y*0.01)*10 + Math.sin(frame*0.01 + (x+20)*0.02)*5;
      ctx.strokeStyle = rgba(c, 0.7);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+20, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- OPENING — the title IS the opening movie ---------
   The title is set BIG and wraps by word to whatever width the
   screen gives it — square, portrait, landscape, tiny phone or
   giant install wall, it always finds the largest size that still
   sits pretty within the frame. ---------------------------------- */
function fitTitleLines(){
  const words = WORK.title.split(" ");
  const maxWidth = W * 0.86;
  const TITLE_TOP = H * 0.11;                              // fixed top margin — stable regardless of line count
  const reservedBottom = Math.max(H * 0.16 + 110, 200);     // headroom kept clear for the CTA button (bottom:16%) + hint
  const safeBottomY = H - reservedBottom;
  let size = Math.min(W * 0.17, H * 0.26, 230);         // BIG — the cap the shrink loop backs off from
  let lines = [words.join(" ")];
  let lineHeight, startY, baseY, credSize, bottomY, seriesSize, seriesY;

  while(size > 36){
    ctx.font = size + "px '" + WORK.titleFont + "',Georgia,serif";
    const spaceW = ctx.measureText(" ").width;
    lines = [];
    let cur = [], curW = 0;
    for(const w of words){
      const ww = ctx.measureText(w).width;
      if(cur.length && curW + spaceW + ww > maxWidth){
        lines.push(cur.join(" "));
        cur = [w]; curW = ww;
      } else {
        curW = cur.length ? curW + spaceW + ww : ww;
        cur.push(w);
      }
    }
    if(cur.length) lines.push(cur.join(" "));

    const widest = Math.max.apply(null, lines.map(function(l){ return ctx.measureText(l).width; }));

    // lay the whole block out top-down (title lines, then credit stack) so we
    // can check it actually fits above the CTA before committing to this size
    seriesSize = WORK.series ? Math.max(26, size * 0.34) : 0;
    seriesY = TITLE_TOP + seriesSize/2;
    lineHeight = size * 1.08;
    startY = TITLE_TOP + seriesSize*1.35 + lineHeight/2;
    baseY = startY + (lines.length-1)*lineHeight;
    credSize = Math.max(24, size * 0.2);
    bottomY = baseY + size*0.72 + credSize*3.6 + credSize*0.6;

    if(widest <= maxWidth && bottomY <= safeBottomY) break;
    size -= 3;
  }
  return { size: size, lines: lines, lineHeight: lineHeight, startY: startY, baseY: baseY, credSize: credSize, seriesSize: seriesSize, seriesY: seriesY };
}

function drawOpening(){
  drawOmbre(ctx, W, H);

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const fit = fitTitleLines();
  const size = fit.size, lines = fit.lines, startY = fit.startY, baseY = fit.baseY;
  let credSize = fit.credSize;
  const lineHeight = fit.lineHeight;

  // the series — ABSTRACTIA leads, in the title font, tracked wide and glowing
  if(WORK.series){
    const serSize = fitTrackedFontSize(WORK.series, fit.seriesSize, 0.22, W*0.86, WORK.titleFont);
    ctx.font = serSize + "px '" + WORK.titleFont + "',Georgia,serif";
    const sTrack = serSize * 0.22;
    const sChars = WORK.series.split("");
    const sW = sChars.map(function(ch){ return ctx.measureText(ch).width; });
    const sTotal = sW.reduce(function(a,b){return a+b;},0) + sTrack*(sChars.length-1);
    let sx = W/2 - sTotal/2;
    for(let i=0;i<sChars.length;i++){
      const sc = currentPalette[(i*2 + Math.floor(frame*0.02)) % 8];
      ctx.shadowColor = rgba(sc, 0.9);
      ctx.shadowBlur = 22 + Math.sin(frame*0.05 + i)*8;
      ctx.fillStyle = "rgba(255,255,255,0.94)";
      ctx.fillText(sChars[i], sx + sW[i]/2, fit.seriesY + Math.sin(frame*0.03 + i*0.7)*serSize*0.05);
      sx += sW[i] + sTrack;
    }
  }

  ctx.font = size + "px '" + WORK.titleFont + "',Georgia,serif";
  const spacing = size * 0.05;

  let gi = 0; // continuous letter index — keeps the shimmer flowing across wrapped lines
  for(let li=0; li<lines.length; li++){
    const letters = lines[li].split("");
    const widths = letters.map(function(ch){ return ctx.measureText(ch).width; });
    const total = widths.reduce(function(a,b){return a+b;},0) + spacing*(letters.length-1);
    let x = W/2 - total/2;
    const y = startY + li*lineHeight;
    for(let i=0;i<letters.length;i++){
      const c = currentPalette[(gi + Math.floor(frame*0.02)) % 8];
      const yOff = Math.sin(frame*0.03 + gi*0.7) * size*0.06;
      ctx.shadowColor = rgba(c, 0.9);
      ctx.shadowBlur = 28 + Math.sin(frame*0.05 + gi)*10;
      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.fillText(letters[i], x + widths[i]/2, y + yOff);
      x += widths[i] + spacing;
      gi++;
    }
  }

  // the credit — Interactive Fine Art by Maxximillian
  // every line is fit to the canvas: shrinks a little, then wraps by word,
  // so no credit can ever run off-screen at any width
  ctx.shadowBlur = 0;
  const cMax = W*0.92;
  const c1 = fitWrap(WORK.credit1, UI_FONT, credSize, 0.35, cMax, Math.max(14, credSize*0.6));
  credSize = c1.size;
  let cy = baseY + size*0.72;
  ctx.font = credSize + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  cy += drawTrackedLines(c1.lines, W/2, cy, credSize*0.35, credSize*1.3);

  const c2 = fitWrap(WORK.credit2, UI_FONT, credSize, 0.18, cMax, credSize*0.8);
  cy += credSize*1.7;
  ctx.font = c2.size + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = rgba(currentPalette[6], 0.95);
  cy += drawTrackedLines(c2.lines, W/2, cy, c2.size*0.18, c2.size*1.3);

  if(WORK.numeral){
    // the numeral steps back — a quiet footnote to the series
    const nm = fitWrap(WORK.numeral, UI_FONT, Math.max(16, credSize*0.72), 0.4, cMax, 14);
    cy += credSize*1.5;
    ctx.font = nm.size + "px '" + UI_FONT + "',Georgia,serif";
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    drawTrackedLines(nm.lines, W/2, cy, nm.size*0.4, nm.size*1.3);
  }
  ctx.restore();

  const s = 1 + Math.sin(frame*0.05)*0.025;
  beginBtn.style.transform = "translateX(-50%) scale(" + s + ")";
}
// shrinks a font size until `text`, tracked at `trackRatio * size`, fits maxW —
// used to keep the credit line legible and on-screen at any viewport width
function fitTrackedFontSize(text, size, trackRatio, maxW, family){
  let s = size;
  while(s > 14){
    ctx.font = s + "px '" + (family || UI_FONT) + "',Georgia,serif";
    const chars = text.split("");
    const widths = chars.map(function(ch){ return ctx.measureText(ch).width; });
    const total = widths.reduce(function(a,b){return a+b;},0) + (s*trackRatio)*(chars.length-1);
    if(total <= maxW) break;
    s -= 1;
  }
  return s;
}
// greedy word wrap at the current ctx.font; `track` is extra px per letter gap
function wrapWords(text, maxW, track){
  const words = text.split(" ");
  const wd = function(s){ return ctx.measureText(s).width + track*(s.length-1); };
  const lines = [];
  let cur = "";
  for(const w of words){
    const t = cur ? cur + " " + w : w;
    if(cur && wd(t) > maxW){ lines.push(cur); cur = w; } else { cur = t; }
  }
  if(cur) lines.push(cur);
  return lines;
}
// fits text to maxW: shrinks toward minSize first, then word-wraps at that size;
// only an unbreakable word keeps shrinking (to a hard 12px floor)
function fitWrap(text, family, size, trackRatio, maxW, minSize){
  let s = size, lines;
  for(;;){
    ctx.font = s + "px '" + family + "',Georgia,serif";
    const track = s * trackRatio;
    lines = wrapWords(text, maxW, track);
    const widest = Math.max.apply(null, lines.map(function(l){ return ctx.measureText(l).width + track*(l.length-1); }));
    const fits = widest <= maxW;
    if((lines.length === 1 && fits) || (s <= minSize && fits) || s <= 12) break;
    s -= 1;
  }
  return { size: s, lines: lines };
}
// draws centered tracked lines (y = first line's center); returns the distance
// from the first line to the last so callers can keep stacking below it
function drawTrackedLines(lines, cx, y, track, lineH){
  for(let i=0;i<lines.length;i++) drawTracked(lines[i], cx, y + i*lineH, track);
  return (lines.length-1)*lineH;
}
// letterspaced centered text — canvas has no letter-spacing of its own
function drawTracked(text, cx, y, track){
  const chars = text.split("");
  const widths = chars.map(function(ch){ return ctx.measureText(ch).width; });
  const total = widths.reduce(function(a,b){return a+b;},0) + track*(chars.length-1);
  let x = cx - total/2;
  for(let i=0;i<chars.length;i++){
    ctx.fillText(chars[i], x + widths[i]/2, y);
    x += widths[i] + track;
  }
}

/* ---------- COMMUNITY CARD (D) — typography only -------------
   The Telegram doorway, drawn in code, tappable on any device. */
function drawCommunityCard(){
  devHits = [];
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.68)";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const maxW = W*0.9;      // every line below is fit to the canvas: shrink a little, then wrap

  const c = currentPalette[5];
  const bigT = fitWrap("ABSTRACTIANS", WORK.titleFont, Math.min(W*0.09, H*0.11, 96), 0, maxW, 14);
  const big = bigT.size;
  ctx.font = big + "px '" + WORK.titleFont + "',Georgia,serif";
  ctx.shadowColor = rgba(c, 0.9);
  ctx.shadowBlur = 30;
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  let y = H*0.34;
  for(let i=0;i<bigT.lines.length;i++) ctx.fillText(bigT.lines[i], W/2, y + i*big*1.05);
  y += (bigT.lines.length-1)*big*1.05;

  ctx.shadowBlur = 0;
  const subT = fitWrap("THE DAILY RITUAL, DELIVERED", UI_FONT, Math.max(25, big*0.32), 0.25, maxW, 14);
  ctx.font = subT.size + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  y += big*0.95;
  y += drawTrackedLines(subT.lines, W/2, y, subT.size*0.25, subT.size*1.3);

  // the link — a real doorway, boxed and glowing
  const linkStart = Math.max(28, Math.min(W*0.05, 44));
  const linkSize = fitWrap(WORK.telegram, UI_FONT, linkStart, 0, maxW - linkStart*2.2, 12).size;
  ctx.font = linkSize + "px '" + UI_FONT + "',Georgia,serif";
  const lw = ctx.measureText(WORK.telegram).width;
  const boxW = lw + linkSize*2.2, boxH = linkSize*2.4;
  const linkY = Math.max(H*0.56, y + boxH*0.7);
  const boxX = W/2 - boxW/2, boxY = linkY - boxH/2;
  ctx.fillStyle = rgba(c, 0.18);
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = rgba(c, 0.95);
  ctx.lineWidth = 2;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.fillText(WORK.telegram, W/2, linkY);
  devHits.push({ x:boxX, y:boxY, w:boxW, h:boxH, act:"link" });

  const tapT = fitWrap("tap to join · tap anywhere else to return", UI_FONT, 24, 0, maxW, 15);
  ctx.font = tapT.size + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  for(let i=0;i<tapT.lines.length;i++) ctx.fillText(tapT.lines[i], W/2, linkY + boxH + i*tapT.size*1.3);
  ctx.restore();
}

/* ---------- LAGNIAPPE — typographic, from the config ---------- */
function drawLagniappe(){
  const linesArr = WORK.lagniappe[activeLagniappe];
  if(!linesArr) return;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  // largest size at which every line — wrapped by word where needed — fits the canvas
  const maxW = W*0.9;
  let size = Math.min(W*0.08, H*0.12, 90), rows;
  for(;;){
    ctx.font = size + "px '" + WORK.titleFont + "',Georgia,serif";
    rows = [];
    linesArr.forEach(function(txt, i){
      wrapWords(txt, maxW, 0).forEach(function(l){ rows.push({ t:l, i:i }); });
    });
    const widest = Math.max.apply(null, rows.map(function(r){ return ctx.measureText(r.t).width; }));
    if((widest <= maxW && rows.length*size*1.3 <= H*0.84) || size <= 16) break;
    size -= 2;
  }
  const startY = H/2 - ((rows.length-1)*size*1.3)/2;
  for(let k=0;k<rows.length;k++){
    const c = currentPalette[(rows[k].i*2+1) % 8];
    ctx.shadowColor = rgba(c, 0.95);
    ctx.shadowBlur = 34;
    ctx.fillStyle = "rgba(255,255,255,0.97)";
    ctx.fillText(rows[k].t, W/2, startY + k*size*1.3);
  }
  ctx.restore();
}

/* ---------- INTERACTIVE MENU ---------- */
const MENU_ROWS = [
  { k:"w", label:"Waves" },
  { k:"l", label:"Lines" },
  { k:"c", label:"Color shift" },
  { k:"d", label:"Community" },
  { k:"b", label:"Begin again" },
  { k:"x", label:"Close menu" }
];
function stateText(k){
  if(k==="w") return modeWaves ? "ON" : "OFF";
  if(k==="l") return modeLines ? "ON" : "OFF";
  if(k==="c") return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : "LIVE";
  return "";
}
function stateOn(k){
  if(k==="w") return modeWaves;
  if(k==="l") return modeLines;
  if(k==="c") return colorShiftIdx >= 0;
  return false;
}
function drawMenu(){
  menuHits = [];
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.62)";
  ctx.fillRect(0,0,W,H);

  ctx.textBaseline = "middle";
  const rowW = Math.min(W*0.86, 560);
  const fs0 = Math.max(26, Math.min(W,H)*0.04);
  // rows shrink to fit short canvases; type shrinks so a label and its value never collide
  const rowH = Math.max(34, Math.min(Math.max(56, fs0*2.1), H*0.86/(MENU_ROWS.length+1.2)));
  const fs = Math.min(fs0, rowH*0.5, rowW/11);
  const startY = H/2 - (MENU_ROWS.length*rowH)/2;
  const rowX = W/2 - rowW/2;

  for(let i=0;i<MENU_ROWS.length;i++){
    const r = MENU_ROWS[i];
    const y = startY + i*rowH;
    const on = stateOn(r.k);
    const c = currentPalette[i % 8];

    ctx.fillStyle = on ? rgba(c, 0.38) : "rgba(255,255,255,0.07)";
    ctx.fillRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    if(on){
      ctx.strokeStyle = rgba(c, 0.95);
      ctx.lineWidth = 2;
      ctx.strokeRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    }

    ctx.font = fs + "px '" + UI_FONT + "',Georgia,serif";
    ctx.textAlign = "left";
    ctx.fillStyle = rgba(c, 1);
    ctx.fillText(r.k === "x" ? "\u2715" : r.k.toUpperCase(), rowX + rowW*0.06, y + rowH/2);

    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText(r.label, rowX + rowW*0.17, y + rowH/2);

    const st = stateText(r.k);
    if(st){
      ctx.textAlign = "right";
      ctx.fillStyle = on ? rgba(c,1) : "rgba(255,255,255,0.3)";
      ctx.fillText(st, rowX + rowW*0.94, y + rowH/2);
    }

    menuHits.push({ x:rowX, y:y, w:rowW, h:rowH, k:r.k });
  }

  ctx.textAlign = "center";
  ctx.font = Math.min(Math.max(24, fs*0.75), rowW/12) + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  const tag = "ABSTRACTIA" + (WORK.numeral ? " " + WORK.numeral : "");
  ctx.fillText(tag, W/2, startY + MENU_ROWS.length*rowH + rowH*0.5);
  ctx.restore();
}

/* ---------- LIVE SCENE ---------- */
function drawLive(){
  drawOmbre(ctx, W, H);        // Smooth — the serene default
  if(modeLines) drawLines();
  if(modeWaves) drawWaves();
  if(activeLagniappe) drawLagniappe();
  if(modeDev) drawCommunityCard();
  if(modeMenu) drawMenu();
}

/* ---------- main loop ---------- */
function loop(){
  frame++;
  updatePalette();
  ctx.clearRect(0,0,W,H);

  if(scene === 0){
    drawOpening();
  } else if(scene === 1){
    drawOpening();
    fadeAlpha += FADE_RATE;
    ctx.fillStyle = "rgba(0,0,0," + Math.min(1, fadeAlpha/255) + ")";
    ctx.fillRect(0,0,W,H);
    if(fadeAlpha >= 255){
      fadeAlpha = 255;
      scene = 2;
      beginBtn.style.display = "none";
      showHint();
    }
  } else {
    drawLive();
    mixStems();
    if(fadeAlpha > 0){
      fadeAlpha -= FADE_RATE;
      ctx.fillStyle = "rgba(0,0,0," + Math.max(0, fadeAlpha/255) + ")";
      ctx.fillRect(0,0,W,H);
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- hint: after Begin, gone in eight seconds ---------- */
let hintTimer = null;
function showHint(){
  hintEl.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ hintEl.classList.remove("on"); }, 8000);
}

/* ---------- one brain for keyboard AND touch ---------- */
function resetToOpening(){
  scene = 0; fadeAlpha = 0;
  modeLines = modeWaves = modeMenu = modeDev = false;
  activeLagniappe = null;
  colorShiftIdx = -1;
  stopStems();
  beginBtn.style.display = "block";
  hintEl.classList.remove("on");
  snapPalette(paletteKeyForNow());
}
function toggleMode(k){
  if(k === "b"){ if(scene > 0) resetToOpening(); return; }
  if(scene !== 2) return;
  if(k === "c"){
    // Color shift — cycle the palettes, land back on live time
    colorShiftIdx++;
    if(colorShiftIdx >= SHIFT_ORDER.length) colorShiftIdx = -1;
  }
  else if(k === "l"){ modeLines = !modeLines; }
  else if(k === "w"){ modeWaves = !modeWaves; }
  else if(k === "i"){ modeMenu = !modeMenu; if(modeMenu) modeDev = false; }
  else if(k === "d"){ modeDev = !modeDev; if(modeDev) modeMenu = false; }
  else if(k === "x"){ modeMenu = false; }
  else if(WORK.lagniappe[k]){
    activeLagniappe = (activeLagniappe === k) ? null : k;
  }
}

document.addEventListener("keydown", function(e){
  toggleMode(e.key.toLowerCase());
});

/* ---------- touch + mouse ---------- */
document.addEventListener("touchstart", function(e){
  if(scene === 2 && e.touches.length === 2 && !modeMenu && !modeDev){
    modeMenu = true;
  }
}, {passive:true});

cv.addEventListener("pointerdown", function(e){
  if(scene !== 2) return;
  const x = e.clientX, y = e.clientY;

  if(modeMenu){
    for(const h of menuHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h){
        toggleMode(h.k);
        return;
      }
    }
    modeMenu = false;      // tapped the art — let it breathe
    return;
  }

  if(modeDev){
    for(const h of devHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h && h.act === "link"){
        window.open("https://" + WORK.telegram, "_blank", "noopener");
        return;
      }
    }
    modeDev = false;       // tapped outside the doorway — return to the work
  }
});

/* ---------- begin ---------- */
beginBtn.addEventListener("click", function(){
  if(scene === 0){
    startStems();          // inside the gesture — autoplay never blocks
    scene = 1;
  }
});

/* ---------- resize: square, portrait, landscape — always right */
function fit(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W; cv.height = H;
}
window.addEventListener("resize", fit);

/* ---------- boot ---------- */
fit();
snapPalette(paletteKeyForNow());
loadStems();
// make sure the canvas fonts are truly loaded before they draw
if(document.fonts && document.fonts.load){
  document.fonts.load("100px '" + WORK.titleFont + "'");
  document.fonts.load("100px '" + UI_FONT + "'");
  document.fonts.load("100px '" + CTA_FONT + "'");
}
loop();
</script>
