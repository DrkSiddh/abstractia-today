function getPaletteByTime() {
    let d = new Date();
    let dayOfWeek = d.getDay(); 
    let h = hour(), m = minute();
    let totalMins = h * 60 + m;

    if (totalMins >= 672 && totalMins <= 1003) return { colors: MIDDAY_PALETTE };
    if (dayOfWeek === 6 && totalMins >= 1020 && totalMins <= 1207) return { colors: SAT_PALETTE };
    if (dayOfWeek === 0 && totalMins >= 1020 && totalMins <= 1207) return { colors: SUN_PALETTE };
    if (dayOfWeek >= 1 && dayOfWeek <= 5 && totalMins >= 300 && totalMins <= 1207) return { colors: MON_FRI_PALETTE };
    if (totalMins >= 1391 || totalMins <= 212) return { colors: LATE_NIGHT_PALETTE };
    if (totalMins >= 1080 && totalMins <= 1390) return { colors: SUNSET_PALETTE };

    return { colors: DAY_PALETTE };
}

function applyChromaKey(img) {
  img.loadPixels();
  for (let i = 0; i < img.pixels.length; i += 4) {
    let r = img.pixels[i];
    let g = img.pixels[i + 1];
    let b = img.pixels[i + 2];
    if (g > 70 && g > r * 1.1 && g > b * 1.1) {
      img.pixels[i + 3] = 0;
    }
  }
  img.updatePixels();
}

function applyPepavaggioKey(img) {
  img.loadPixels();
  let w = img.width;
  let h = img.height;
  
  let xStartBase = (w * 0.41) - 105;
  let xEnd = (w * 0.59) + 128; 
  let yStart = (h * 0.25) - 260; 
  let yEnd = (h * 0.75) - 100;

  let contrast = 18; 
  let brightnessBoost = 22;
  let f = (259 * (contrast + 255)) / (255 * (259 - contrast));

  for (let i = 0; i < img.pixels.length; i += 4) {
    let pixelIdx = i / 4;
    let px = pixelIdx % w;
    let py = floor(pixelIdx / w);
    
    img.pixels[i]   = constrain(f * (img.pixels[i]   - 128) + 128 + brightnessBoost, 0, 255);
    img.pixels[i+1] = constrain(f * (img.pixels[i+1] - 128) + 128 + brightnessBoost, 0, 255);
    img.pixels[i+2] = constrain(f * (img.pixels[i+2] - 128) + 128 + brightnessBoost, 0, 255);

    let edgeCurve = (sin(py * 0.05) * 12) + (noise(py * 0.02, frameCount * 0.01) * 85) - (cos(py * 0.01) * 20);
    let xStartDynamic = xStartBase + edgeCurve;

    if (px >= xStartDynamic && px <= xEnd && py >= yStart && py <= yEnd) {
      let r = img.pixels[i];
      let g = img.pixels[i + 1];
      let b = img.pixels[i + 2];
      
      if (g > 102 && g > r * 1.12 && g > b * 1.12) {
        img.pixels[i + 3] = 0; 
      } else {
        img.pixels[i + 3] = 255;
      }
    } else {
      img.pixels[i + 3] = 255;
    }
  }
  img.updatePixels();
}

function syncAudio() {
  if (getAudioContext().state !== 'running') getAudioContext().resume();
  if (scene < 2) return;

  let others = [
    audio40AbstractiaHarmonicKissing, audioHarmonicSmooch, 
    audio40LinesAbstractia, audio40WavesAbstractia, 
    audio40WWWModeAbstractia, audio40WWModeAbstractia, 
    audio40SauceMode
  ];

  if (isQuiet) {
    others.forEach(a => { if(a && typeof a.setVolume === 'function') a.setVolume(0, 1.5); });
    if(audioHolidayInTheHood) audioHolidayInTheHood.setVolume(0, 1.5);
    return;
  }

  if (showEndodecaMode) {
    others.forEach(a => { if(a && typeof a.setVolume === 'function') a.setVolume(0, 2); });
    if (audioHolidayInTheHood) {
      if (!audioHolidayInTheHood.isPlaying()) audioHolidayInTheHood.loop();
      audioHolidayInTheHood.setVolume(0.85, 2);
    }
  } else {
    if (audioHolidayInTheHood) audioHolidayInTheHood.setVolume(0, 2);

    if (audio40AbstractiaHarmonicKissing && !audio40AbstractiaHarmonicKissing.isPlaying()) audio40AbstractiaHarmonicKissing.loop();
    if (audio40AbstractiaHarmonicKissing) audio40AbstractiaHarmonicKissing.setVolume(isHushed ? 0 : 0.4, 1.5);

    if (showLinesMode) {
      if (audio40LinesAbstractia && !audio40LinesAbstractia.isPlaying()) audio40LinesAbstractia.loop();
      if (audio40LinesAbstractia) audio40LinesAbstractia.setVolume(0.7, 1.5);
    } else {
      if (audio40LinesAbstractia) audio40LinesAbstractia.setVolume(0, 1.5);
    }

    if (waveMode === 1) { 
      if (audio40WavesAbstractia && !audio40WavesAbstractia.isPlaying()) audio40WavesAbstractia.loop();
      if (audio40WavesAbstractia) audio40WavesAbstractia.setVolume(0.8, 1.5);
      if (audio40WWModeAbstractia) audio40WWModeAbstractia.setVolume(0, 1.5);
      if (audio40WWWModeAbstractia) audio40WWWModeAbstractia.setVolume(0, 1.5);
    } else if (waveMode === 2) { 
      if (audio40WWModeAbstractia && !audio40WWModeAbstractia.isPlaying()) audio40WWModeAbstractia.loop();
      if (audio40WWModeAbstractia) audio40WWModeAbstractia.setVolume(0.8, 1.5);
      if (audio40WavesAbstractia) audio40WavesAbstractia.setVolume(0, 1.5);
      if (audio40WWWModeAbstractia) audio40WWWModeAbstractia.setVolume(0, 1.5);
    } else if (waveMode === 3) { 
      if (audio40WWWModeAbstractia && !audio40WWWModeAbstractia.isPlaying()) audio40WWWModeAbstractia.loop();
      if (audio40WWWModeAbstractia) audio40WWWModeAbstractia.setVolume(0.8, 1.5);
      if (audio40WavesAbstractia) audio40WavesAbstractia.setVolume(0, 1.5);
      if (audio40WWModeAbstractia) audio40WWModeAbstractia.setVolume(0, 1.5);
    } else {
      if (audio40WavesAbstractia) audio40WavesAbstractia.setVolume(0, 1.5);
      if (audio40WWModeAbstractia) audio40WWModeAbstractia.setVolume(0, 1.5);
      if (audio40WWWModeAbstractia) audio40WWWModeAbstractia.setVolume(0, 1.5);
    }

    if (showBgGif) {
      if (audio40SauceMode && !audio40SauceMode.isPlaying()) audio40SauceMode.loop();
      if (audio40SauceMode) audio40SauceMode.setVolume(0.75, 1.5);
    } else {
      if (audio40SauceMode) audio40SauceMode.setVolume(0, 1.5);
    }
  }
}

function keyPressed() {
  if (getAudioContext().state !== 'running') getAudioContext().resume();

  if (key === 'b' || key === 'B') {
    resetToWelcome();
  } else if (scene === 2) {
    if (key === 'a' || key === 'A') {
      showAlternateView = !showAlternateView;
      if (showAlternateView) { showControlsMenu = false; showCreditsMode = false; showDGraphic = false; showPGraphic = false; }
    }
    else if (key === 'p' || key === 'P') {
      showPGraphic = !showPGraphic;
      if (!showPGraphic) showEndodecaMode = false;
      if (showPGraphic) { showControlsMenu = false; showAlternateView = false; showCreditsMode = false; showDGraphic = false; }
      syncAudio();
    }
    else if (key === 'e' || key === 'E') {
      if (showPGraphic) {
        let now = millis();
        if (now - lastETime < 300) {
          if (audioHolidayInTheHood) audioHolidayInTheHood.jump(0);
        } else {
          showEndodecaMode = !showEndodecaMode;
        }
        lastETime = now;
        syncAudio();
      }
    }
    else if (key === 'f' || key === 'F') {
      showCreditsMode = !showCreditsMode;
      if (showCreditsMode) { showControlsMenu = false; showAlternateView = false; showDGraphic = false; showPGraphic = false; }
    }
    else if (key === 'd' || key === 'D') {
      showDGraphic = !showDGraphic;
      if (showDGraphic) { showControlsMenu = false; showAlternateView = false; showCreditsMode = false; showPGraphic = false; }
    }
    else if (key === 'i' || key === 'I') {
      showControlsMenu = !showControlsMenu;
      if (showControlsMenu) { showAlternateView = false; showCreditsMode = false; showDGraphic = false; showPGraphic = false; }
    }
    else if (key === 'w' || key === 'W') {
      waveMode = (waveMode + 1) % 4;
      syncAudio();
    }
    else if (key === 'o' || key === 'O') showOnenessMode = !showOnenessMode;
    else if (key === 'l' || key === 'L') {
      showLinesMode = !showLinesMode;
      syncAudio();
    }
    else if (key === 's' || key === 'S') {
      showBgGif = !showBgGif;
      syncAudio();
    }
    else if (key === 'c' || key === 'C') {
      bgBlendMode = (bgBlendMode === BLEND) ? SCREEN : (bgBlendMode === SCREEN ? HARD_LIGHT : BLEND);
    }
    else if (key === 'q' || key === 'Q') {
      isQuiet = !isQuiet;
      syncAudio();
    }
    else if (key === 'h' || key === 'H') {
      isHushed = !isHushed;
      syncAudio();
    }
  }
}

function resetToWelcome() {
  scene = 0; 
  fadeAlpha = 0;
  showAlternateView = showOnenessMode = showLinesMode = showControlsMenu = showCreditsMode = showDGraphic = showPGraphic = showEndodecaMode = false;
  showBgGif = false; waveMode = 0; bgBlendMode = BLEND; isQuiet = false; isHushed = false;
  let allAudio = [
    audio40AbstractiaHarmonicKissing, audioHarmonicSmooch, audio40LinesAbstractia, 
    audio40WavesAbstractia, audio40WWWModeAbstractia, audio40WWModeAbstractia, 
    audio40SauceMode, audioHolidayInTheHood
  ];
  allAudio.forEach(a => { if(a && typeof a.setVolume === 'function') a.setVolume(0, 1.5); });
  videoPepavaggioFountain.loop();
  button.show();
}

function drawVibrantBackground() {
  if (showBgGif) {
    push();
    blendMode(SCREEN); 
    tint(255, 180);
    let r = max(width / imgAbstractLindia.width, height / imgAbstractLindia.height);
    image(imgAbstractLindia, width / 2, height / 2, imgAbstractLindia.width * r, imgAbstractLindia.height * r);
    pop();
  }
  bgScrollOffset += 0.0012; 
  globalAnchorX = width / 2 + (noise(bgScrollOffset * 0.4, 0) - 0.5) * width * 0.45;
  globalAnchorY = height / 2 + (noise(bgScrollOffset * 0.4, 500) - 0.5) * height * 0.45;
  push();
  blendMode(bgBlendMode);
  let grad = drawingContext.createRadialGradient(globalAnchorX, globalAnchorY, 0, globalAnchorX, globalAnchorY, max(width, height) * 1.5);
  let alphaVal = (showBgGif || scene < 2) ? 0.45 : 0.95;
  for (let i = 0; i < colorsPalette.length; i++) {
    let c = colorsPalette[i];
    grad.addColorStop(i / (colorsPalette.length - 1), `rgba(${red(c)}, ${green(c)}, ${blue(c)}, ${alphaVal})`);
  }
  drawingContext.fillStyle = grad;
  drawingContext.fillRect(0, 0, width, height);
  pop();
}

function draw() {
  updatePalette(); 
  lerpPalettes(); 
  background(0);
  
  if (scene <= 1) {
    drawVibrantBackground();
    drawWelcomeScreen();
    handleBubbles();
  } else {
    drawVibrantBackground();
    if (waveMode > 0) drawTransverseLogic();
    if (showOnenessMode) drawOneness();
    if (showLinesMode) drawLinesMode();
    
    if (showAlternateView) {
      if (imgSkelevaggioUFO.width > 0 && !ufoKeyed) {
        applyChromaKey(imgSkelevaggioUFO);
        ufoKeyed = true;
      }
      push();
      noStroke();
      fill(0); 
      rect(0, height - 100, width, 100);
      pop();
      drawOverlay(imgSkelevaggioUFO, BLEND, 255);
    }

    if (showPGraphic) {
      if (imgPepavaggioMode.width > 0 && !pepavaggioKeyed) {
        applyPepavaggioKey(imgPepavaggioMode);
        pepavaggioKeyed = true;
      }
      drawOverlay(imgPepavaggioMode, BLEND, 255);
      drawPVignette();
    }
    
    if (showCreditsMode) drawOverlay(imgPepavaggioCredits, BLEND, 255);
    if (showControlsMenu) drawOverlay(imgAbstractiaInteractivePanelHUD, BLEND, 230);
    if (showDGraphic) drawOverlay(imgBlaqqatTitle, SCREEN, 255);
  }
  handleSceneTransitions();
}

function drawPVignette() {
  push();
  let vGrad = drawingContext.createRadialGradient(width/2, height/2, width*0.15, width/2, height/2, width*0.9);
  vGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vGrad.addColorStop(1, 'rgba(0,0,0,160)');
  drawingContext.fillStyle = vGrad;
  noStroke();
  rect(0, 0, width, height);
  pop();
}

function drawTransverseLogic() {
  push(); 
  translate(width/2, height/2);
  if (waveMode === 1) {
    blendMode(ADD);
    for (let i = 0; i < 35; i++) {
      let c = colorsPalette[i % colorsPalette.length];
      push();
      rotate(frameCount * 0.025 + i * 0.3);
      let r = (i * 20 + frameCount * 4) % (width * 0.65);
      stroke(red(c), green(c), blue(c), map(r, 0, width * 0.65, 255, 0));
      strokeWeight(1.5);
      noFill();
      beginShape();
      vertex(r, 0); vertex(r + 30, 15); vertex(r + 15, 30);
      endShape(CLOSE);
      pop();
    }
  } else if (waveMode === 2) {
    blendMode(SCREEN);
    for (let i = 0; i < 20; i++) {
      let c = colorsPalette[i % colorsPalette.length];
      push();
      rotate(frameCount * 0.005 + i * (TWO_PI / 20));
      let dist = map(sin(frameCount * 0.01 + i), -1, 1, 150, width * 0.45);
      translate(dist, 0);
      rotate(frameCount * 0.08);
      fill(red(c), green(c), blue(c), 150);
      beginShape();
      vertex(0, -40); vertex(20, 0); vertex(0, 40); vertex(-20, 0);
      endShape(CLOSE);
      pop();
    }
  } else if (waveMode === 3) {
    blendMode(ADD);
    for (let i = 0; i < 20; i++) {
      let c = colorsPalette[i % colorsPalette.length];
      let pulse = sin(frameCount * 0.01 + i) * 60;
      let r = (i * 50 + frameCount * 2) % (width);
      stroke(red(c), green(c), blue(c), map(r, 0, width, 220, 0));
      strokeWeight(2); noFill();
      ellipse(0, 0, r + pulse, r - pulse);
    }
  }
  pop();
}

function drawOneness() {
  let breathe = map(sin(frameCount * 0.012), -1, 1, 0.7, 1.9);
  push();
  translate(globalAnchorX, globalAnchorY);
  noFill();
  for(let i = 0; i < 22; i++) {
    let c = colorsPalette[i % colorsPalette.length];
    stroke(red(c), green(c), blue(c), 190);
    strokeWeight(2 + i * 0.15); rotate(frameCount * 0.0004 + i * 0.015);
    let r = (120 + i * 15) * breathe;
    beginShape();
    for(let a = 0; a < TWO_PI; a += PI/12) {
      let offset = noise(i * 0.6, a, frameCount * 0.004) * 160;
      vertex(cos(a) * (r + offset), sin(a) * (r + offset));
    }
    endShape(CLOSE);
  }
  pop();
}

function drawLinesMode() {
  let breathe = map(sin(frameCount * 0.012), -1, 1, 0.4, 3.2);
  let pulseInten = map(sin(frameCount * 0.02), -1, 1, 0.8, 1.2);
  push();
  translate(width/2, height/2);
  blendMode(ADD);
  for(let i = 0; i < 90; i++) {
    let c = colorsPalette[i % colorsPalette.length];
    stroke(red(c), green(c), blue(c), 140 * pulseInten);
    strokeWeight(1.4);
    let angle = i * (TWO_PI / 90) + frameCount * 0.002;
    let x2 = cos(angle) * (width * 0.75 * breathe * pulseInten);
    let y2 = sin(angle) * (height * 0.75 * breathe * pulseInten);
    line(cos(angle)*20*breathe, sin(angle)*20*breathe, x2, y2);
    noStroke(); fill(red(c), green(c), blue(c), 200); ellipse(x2, y2, 5, 5);
  }
  pop();
}

function handleSceneTransitions() {
  if (scene === 1) {
    fadeAlpha += fadeRate; 
    fill(0, fadeAlpha); rect(0, 0, width, height);
    if (fadeAlpha >= 255) { 
      scene = 2; 
      videoPepavaggioFountain.pause();
      syncAudio();
    }
    button.hide();
  } else if (scene === 2) {
    fadeAlpha -= fadeRate; fill(0, max(0, fadeAlpha)); rect(0, 0, width, height);
  }
}

function drawWelcomeScreen() {
  if (!videoPepavaggioFountain) return;
  push(); 
  blendMode(BLEND); 
  tint(255, 255); 
  let r = max(width / videoPepavaggioFountain.width, height / videoPepavaggioFountain.height);
  image(videoPepavaggioFountain, width / 2, height / 2, videoPepavaggioFountain.width * r, videoPepavaggioFountain.height * r);
  pop();
}

function drawOverlay(media, bMode, alphaVal) {
  if (!media || media.width === 0) return;
  push(); blendMode(bMode); tint(255, alphaVal);
  let r = max(width / media.width, height / media.height);
  image(media, width / 2, height / 2, media.width * r, media.height * r);
  pop();
}

function handleDiveIn() {
  if (getAudioContext().state !== 'running') getAudioContext().resume();
  if (audioFunky5) audioFunky5.play(); 
  scene = 1; 
}

function updatePalette() {
  let now = millis();
  if (now - lastPaletteChangeTime > nextPaletteChangeDelay) {
    let result = getPaletteByTime();
    targetPaletteHex = [...result.colors];
    lastPaletteChangeTime = now;
  }
}

function lerpPalettes() {
    for (let i = 0; i < targetPaletteHex.length; i++) {
        let targetColor = color('#' + targetPaletteHex[i]);
        colorsPalette[i] = colorsPalette[i] ? lerpColor(colorsPalette[i], targetColor, paletteLerpRate) : targetColor;
    }
}

function handleBubbles() {
  let bPos = button.position(), bSize = button.size();
  if (mouseX > bPos.x - bSize.width/2 && mouseX < bPos.x + bSize.width/2 && mouseY > bPos.y - bSize.height/2 && mouseY < bPos.y + bSize.height/2) {
    if (frameCount % 3 === 0) bubbles.push({ x: mouseX + random(-50, 50), y: mouseY + random(-20, 20), vx: random(-2, 2), vy: random(-2, -6), s: random(8, 20), a: 200 });
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    let b = bubbles[i]; b.x += b.vx; b.y += b.vy; b.a -= 3;
    noStroke(); fill(224, 255, 255, b.a); ellipse(b.x, b.y, b.s);
    if (b.a <= 0) bubbles.splice(i, 1);
  }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); styleButton(); }
  </script>
