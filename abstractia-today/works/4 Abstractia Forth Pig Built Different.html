<canvas id="art"></canvas>

<div id="hint">PRESS I FOR THE MENU &middot; OR TAP WITH TWO FINGERS</div>

<script>
"use strict";
/* ============================================================
   ABSTRACTIA — LITE TEMPLATE
   Zero external graphics. Pure code, pure typography, pure
   gradient. The ultra-lightweight member of the family.
   Fonts + optional sound stems come from the shared library.
   ============================================================ */

const WORK = {
  number: 4,
  numeral: "IV",
  title: "FORTH PIG BUILT DIFFERENT",
  credit1: "INTERACTIVE FINE ART",
  credit2: "by Maxximillian",
  telegram: "t.me/abstractians",

  titleFont: "Ethnocentric Regular",
  h2Font: "Futura Light",

  sounds: {
    base:    "library/sounds/",
    oneness: "",
    waves:   "",
    lines:   ""
  },

  palettes: {
    MORNING: ["b39da5","bda5b1","c5b8be","d3c9cb","f2e8ed","f0eaee","eaeef0","e8f3f2"],
    DAY:     ["28191f","442736","634551","8a606a","e9b7ce","e3c6d7","d8e4e9","d3f3f1"],
    SUNSET:  ["242a42","222b44","39405e","505483","91a5e6","a5b6da","b7ddc3","aaeeaf"],
    NIGHT:   ["1c0d18","260f22","381c30","4e273e","b41c90","a13491","3f64a2","1989ca"],
    GRASS:   ["004b23","006400","007200","008000","38b000","70e000","9ef01a","ccff33"]
  },
  schedule: [
    { from:"05:00", to:"10:59", palette:"MORNING" },
    { from:"11:00", to:"17:59", palette:"DAY"     },
    { from:"18:00", to:"20:59", palette:"SUNSET"  },
    { from:"21:00", to:"04:59", palette:"NIGHT"   }
  ],
  grassWindow: { from:"16:20", to:"16:43" },

  btc: true,  // neutral / on / off

  // speed 0.1-3 · regularity 0-1 · breath 0-1 · variation 0-2
  motion: {
    lines:   { speed:1, regularity:1, breath:0.65, variation:0.95 },
    waves:   { speed:0.2, regularity:0.95, breath:0.84, variation:1.43 },
    oneness: { speed:0.35, regularity:1, breath:1, variation:0.54 }
  },

  lagniappe: {}
};

/* ============================================================
   ENGINE
   ============================================================ */

const cv = document.getElementById("art");
const ctx = cv.getContext("2d");
const beginBtn = document.getElementById("beginBtn");
const hintEl = document.getElementById("hint");

const UI_FONT = "Futura Light";
const CTA_FONT = "Ethnocentric Regular";

let W = 0, H = 0, frame = 0;
let scene = 0;
let fadeAlpha = 0;
const FADE_RATE = 6;

let modeLines = false;       // L
let modeWaves = false;       // W
let modeQuiet = false;       // Q
let modeMenu = false;        // I
let modeDev = false;         // D — typographic community card
let modeOneness = false;     // O — every layer, one breath
let activeLagniappe = null;

// C — Color shift: the collector holds the remote.
// -1 = live time. Otherwise locked to a palette of their choosing.
let colorShiftIdx = -1;
const SHIFT_ORDER = ["MORNING","DAY","SUNSET","NIGHT","GRASS"];

let currentPalette = [];
let targetKey = "";
const LERP_RATE = 0.015;

let menuHits = [];
let devHits = [];
let ombreScroll = 0;         // accumulated, so Oneness can bend its speed without a jump

/* ---------- helpers ---------- */
function hexToRgb(h){
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function minutesOf(str){
  const p = str.split(":");
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function nowMinutes(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function inWindow(now, from, to){
  const f = minutesOf(from), t = minutesOf(to);
  return f <= t ? (now >= f && now <= t) : (now >= f || now <= t);
}
function paletteKeyForNow(){
  const now = nowMinutes();
  if(inWindow(now, WORK.grassWindow.from, WORK.grassWindow.to)) return "GRASS";
  for(const s of WORK.schedule){
    if(inWindow(now, s.from, s.to)) return s.palette;
  }
  return "DAY";
}
function activePaletteKey(){
  return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : paletteKeyForNow();
}
/*@shared:lerp*/function lerp(a, b, t){ return a + (b - a) * t; }/*@end*/
function rgba(c, a){ return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")"; }
function lerpRgb(c1, c2, t){
  return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)];
}
function fontStack(f){ return "'" + f + "',Georgia,serif"; }

/* ---------- palette lifecycle (the one palette lerp) ---------- */
function snapPalette(key){
  targetKey = key;
  currentPalette = WORK.palettes[key].map(hexToRgb);
}
function updatePalette(){
  const key = activePaletteKey();
  if(key !== targetKey) targetKey = key;
  const target = WORK.palettes[targetKey].map(hexToRgb);
  for(let i=0;i<8;i++){
    currentPalette[i] = lerpRgb(currentPalette[i], target[i], LERP_RATE);
  }
}

/* ---------- MOTION — speed, regularity, breath, variation ----------
   Every layer keeps its own clocks, so turning a dial mid-flight bends
   the motion smoothly instead of jumping. None of it touches colour. */
const MOTION_DEFAULT = { speed:1, regularity:1, breath:0, variation:1 };
function mo(layer){ return (WORK.motion && WORK.motion[layer]) || MOTION_DEFAULT; }
const LAYER_N = { lines:150, waves:50 };
const SEED = {}, CLOCK = {}, SWELL = { lines:0, waves:0 };
["lines","waves"].forEach(function(k){
  // fresh scatter every time the work opens: ABSTRACTIA improvises
  SEED[k] = []; CLOCK[k] = [];
  for(let i=0;i<LAYER_N[k];i++){
    SEED[k].push([Math.random()*2-1, Math.random()*2-1, Math.random()*2-1]);
    CLOCK[k].push(0);
  }
});
function tickMotion(){
  ["lines","waves"].forEach(function(k){
    const m = mo(k), irr = 1 - m.regularity, s = SEED[k], c = CLOCK[k];
    for(let i=0;i<c.length;i++) c[i] += m.speed * (1 + s[i][2] * irr * 0.5);
    SWELL[k] += m.speed;
  });
}
// a layer's own slow swell: height and glow rise and fall together
function swell(k){
  const m = mo(k), s = Math.sin(SWELL[k] * 0.012);
  return { amp: 1 + m.breath * 0.6 * s, alpha: 1 - m.breath * 0.35 * (0.5 - 0.5 * s) };
}

/* ---------- ONENESS — one shared breath for every layer ----------
   Breath is opacity, amplitude and phase. It never reads or writes a
   single RGB value: whatever palette the collector chose, it breathes in.
   Layers: 0 ombre, 1 lines, 2 waves, 3 lagniappe. */
const BREATH_MS = 8000;
let oneAmt = 0;              // 0..1, eased so on/off never snaps
let oneT = 0, oneLast = 0;
function updateBreath(){
  oneAmt = lerp(oneAmt, modeOneness ? 1 : 0, 0.02);
  if(!modeOneness && oneAmt < 0.002) oneAmt = 0;
  const now = performance.now();
  const dt = oneLast ? Math.min(100, now - oneLast) : 16.7;
  oneLast = now;
  oneT += dt / BREATH_MS * Math.PI * 2 * mo("oneness").speed;
}
function breathOf(li){ return Math.sin(oneT + (1 - mo("oneness").regularity) * li * 1.3); }
function breathAlpha(depth, li){ return 1 - oneAmt * Math.min(1, depth * mo("oneness").breath) * (0.5 - 0.5 * breathOf(li)); }
function breathAmp(depth, li){ const m = mo("oneness"); return 1 + oneAmt * depth * m.breath * m.variation * breathOf(li); }
function breathPhase(li){ return oneAmt * breathOf(li) * 1.4 * mo("oneness").variation; }

/* ---------- SOUND STEMS — the mix IS the state ---------- */
const stems = { oneness:null, waves:null, lines:null };
const stemVol = { oneness:0, waves:0, lines:0 };
function loadStems(){
  for(const name of ["oneness","waves","lines"]){
    const file = WORK.sounds[name];
    if(!file) continue;
    const a = new Audio(WORK.sounds.base + file);
    a.loop = true; a.volume = 0;
    stems[name] = a;
  }
}
function startStems(){
  // begun inside the user gesture so autoplay never blocks
  for(const k in stems){ if(stems[k]) stems[k].play().catch(function(){}); }
}
function stopStems(){
  for(const k in stems){
    if(stems[k]){ stems[k].pause(); stems[k].currentTime = 0; stemVol[k] = 0; }
  }
}
function mixStems(){
  // hierarchy: oneness is the floor and politely ducks as layers
  // arrive; waves and lines ride on top; O mode gives the floor the
  // room; Q fades the whole stack
  const layers = (modeWaves?1:0) + (modeLines?1:0);
  const floor = Math.max(0.22, 0.5 - 0.12*layers);
  const t = {
    oneness: modeQuiet ? 0 : lerp(floor, 0.78, oneAmt),
    waves:   (modeQuiet || !modeWaves) ? 0 : 0.45,
    lines:   (modeQuiet || !modeLines) ? 0 : 0.45
  };
  for(const k in stems){
    if(!stems[k]) continue;
    stemVol[k] = lerp(stemVol[k], t[k], 0.05);
    stems[k].volume = Math.max(0, Math.min(1, stemVol[k]));
  }
}

/* ---------- FONT TRUTH — did the face really land? ----------
   Measure in the family vs. the bare fallback. Identical widths in
   both serif and monospace means the browser is impersonating. */
/*@shared:fontIsReal*/function fontIsReal(family){
  if(!fontIsReal.cv) fontIsReal.cv = document.createElement("canvas");
  const c = fontIsReal.cv.getContext("2d");
  const probe = "ABSTRACTIA wmQ@#08&";
  for(const fb of ["serif", "monospace"]){
    c.font = "72px " + fb;
    const bare = c.measureText(probe).width;
    c.font = "72px '" + family + "'," + fb;
    if(Math.abs(c.measureText(probe).width - bare) > 0.5) return true;
  }
  return false;
}/*@end*/

/* ============================================================
   ONE SIZING BRAIN
   Every piece of type in the work is measured here, once per
   resize or font arrival. Draw calls read the cache; nothing
   measures text sixty times a second.
   ============================================================ */
const TYPE = { dirty:true, unit:16, title:null, cred:null, menu:null, card:null, lag:{}, titleTrue:false };
const PROBE = 100;           // measuring size; widths scale linearly from here
const TITLE_TRACK = 0.05;    // title letterspacing as a fraction of size
const LINE_H = 1.1;          // stacked title line height

// a measured, letterspaced row of text — the only measuring primitive
function makeRow(text, font, size, trackFrac){
  const f = size + "px " + fontStack(font);
  ctx.font = f;
  const chars = Array.from(text || "");
  const widths = chars.map(function(ch){ return ctx.measureText(ch).width; });
  const track = size * trackFrac;
  const total = widths.reduce(function(a,b){ return a+b; }, 0) + track * Math.max(0, chars.length-1);
  return { font:f, size:size, chars:chars, widths:widths, track:track, total:total };
}
function drawRow(r, cx, y){
  ctx.font = r.font;
  let x = cx - r.total/2;
  for(let i=0;i<r.chars.length;i++){
    ctx.fillText(r.chars[i], x + r.widths[i]/2, y);
    x += r.widths[i] + r.track;
  }
}
// largest size up to `ideal` that keeps one line inside maxW
function fitLine(text, font, ideal, maxW, trackFrac){
  const r = makeRow(text, font, PROBE, trackFrac);
  return r.total > 0 ? Math.min(ideal, maxW * PROBE / r.total) : ideal;
}
// every way to cut the words into k consecutive lines
function splitsInto(words, k){
  if(k === 1) return [[words.join(" ")]];
  const out = [];
  for(let i=1;i<=words.length-k+1;i++){
    const head = words.slice(0,i).join(" ");
    splitsInto(words.slice(i), k-1).forEach(function(rest){ out.push([head].concat(rest)); });
  }
  return out;
}
// THE fit: single line or balanced stack, whichever gives the biggest type
function fitTitle(text, font, maxW, maxH){
  const words = String(text).split(/\s+/).filter(Boolean);
  const unitW = {};
  function widthUnits(s){
    if(unitW[s] === undefined) unitW[s] = makeRow(s, font, PROBE, TITLE_TRACK).total / PROBE;
    return unitW[s];
  }
  let best = null;
  const maxLines = Math.min(4, words.length);
  for(let k=1;k<=maxLines;k++){
    const rhythm = [];
    for(let i=0;i<k;i++) rhythm.push(i % 2 === 1 ? 0.9 : 1);   // per-line scale rhythm
    const stackH = rhythm.reduce(function(a,r){ return a+r; }, 0) * LINE_H;
    splitsInto(words, k).forEach(function(lines){
      let size = maxH / stackH;
      for(let i=0;i<k;i++){
        const u = widthUnits(lines[i]);
        if(u > 0) size = Math.min(size, maxW / (u * rhythm[i]));
      }
      // fewer lines win ties; a stack has to earn its place with real size
      if(!best || size > best.size * 1.02) best = { size:size, lines:lines, rhythm:rhythm };
    });
  }
  return best || { size:maxH/LINE_H, lines:[String(text)], rhythm:[1] };
}

function computeType(){
  TYPE.dirty = false;
  TYPE.lag = {};
  const unit = Math.max(14, Math.min(W, H) * 0.032);
  TYPE.unit = unit;
  const maxW = W * 0.92;
  const bandTop = H * 0.06, bandH = H * 0.72;   // the room the Begin button leaves

  // title
  const t = fitTitle(WORK.title, WORK.titleFont, maxW, bandH * 0.6);
  const rows = t.lines.map(function(line, i){ return makeRow(line, WORK.titleFont, t.size * t.rhythm[i], TITLE_TRACK); });

  // credits + numeral, all derived from the same unit and title size
  const credIdeal = Math.min(Math.max(unit * 1.1, t.size * 0.2), unit * 2.4);
  const c1 = makeRow(WORK.credit1, WORK.h2Font, fitLine(WORK.credit1, WORK.h2Font, credIdeal, maxW, 0.35), 0.35);
  const c2 = makeRow(WORK.credit2, WORK.h2Font, fitLine(WORK.credit2, WORK.h2Font, credIdeal, maxW, 0.18), 0.18);
  const num = WORK.numeral
    ? makeRow(WORK.numeral, UI_FONT, fitLine(WORK.numeral, UI_FONT, Math.min(t.size * 0.34, unit * 2.2), maxW, 0.3), 0.3)
    : null;

  // stack the group, then centre it in the band
  let y = 0;
  const ys = rows.map(function(r){ const c = y + r.size*LINE_H/2; y += r.size*LINE_H; return c; });
  y += t.size * 0.28;
  const c1y = y + c1.size/2; y += c1.size * 1.6;
  const c2y = y + c2.size/2; y += c2.size * 1.2;
  let ny = 0;
  if(num){ y += num.size * 0.6; ny = y + num.size/2; y += num.size; }
  const off = bandTop + Math.max(0, (bandH - y) / 2);
  TYPE.title = { rows:rows, ys:ys.map(function(v){ return v + off; }) };
  TYPE.cred = { c1:c1, c2:c2, c1y:c1y+off, c2y:c2y+off, num:num, ny:ny+off };

  // menu
  const rowH = Math.min(Math.max(unit * 2.6, 44), (H * 0.86) / (MENU_ROWS.length + 1));
  const fs = Math.min(unit * 1.25, rowH / 2.1);
  TYPE.menu = { fs:fs, rowH:rowH, rowW:Math.min(W * 0.9, 600), tag:Math.max(13, fs * 0.75) };

  // community card
  const big = fitLine("ABSTRACTIANS", WORK.titleFont, Math.min(W * 0.11, H * 0.12, 120), W * 0.9, 0);
  const subText = "THE DAILY RITUAL, DELIVERED";
  const sub = makeRow(subText, UI_FONT, fitLine(subText, UI_FONT, Math.max(unit, big * 0.3), W * 0.9, 0.25), 0.25);
  const linkS = fitLine(WORK.telegram, UI_FONT, Math.min(unit * 1.9, 46), W * 0.66, 0);
  ctx.font = linkS + "px " + fontStack(UI_FONT);
  const linkW = ctx.measureText(WORK.telegram).width;
  const foot = fitLine("tap to join \u00b7 tap anywhere else to return", UI_FONT, Math.max(13, unit * 0.9), W * 0.92, 0);
  TYPE.card = { big:big, sub:sub, linkS:linkS, linkW:linkW, foot:foot };

  // the DOM type rides the same unit
  const cta = fitLine("Get Abstract", CTA_FONT, Math.min(44, Math.max(22, unit * 1.5)), W * 0.8, 0.1);
  beginBtn.style.fontSize = cta.toFixed(1) + "px";
  beginBtn.style.letterSpacing = (cta * 0.1).toFixed(1) + "px";
  hintEl.style.fontSize = Math.max(13, unit * 0.8).toFixed(1) + "px";
  hintEl.style.letterSpacing = Math.max(1, unit * 0.1).toFixed(1) + "px";

  TYPE.titleTrue = fontIsReal(WORK.titleFont);
}
function lagSize(linesArr){
  if(TYPE.lag[activeLagniappe]) return TYPE.lag[activeLagniappe];
  let s = Math.min(H * 0.78 / (linesArr.length * 1.3), W * 0.14);
  linesArr.forEach(function(l){ s = fitLine(l, WORK.titleFont, s, W * 0.9, 0); });
  TYPE.lag[activeLagniappe] = s;
  return s;
}
function markType(){ TYPE.dirty = true; }

/* ---------- THE OMBRE — smooth mode, the serene default ------ */
const strip = document.createElement("canvas");
const stripCtx = strip.getContext("2d");
function drawOmbre(targetCtx, w, h){
  strip.width = 1;
  strip.height = h;
  const id = stripCtx.createImageData(1, h);
  const d = id.data;
  const n = 8;
  const dNow = new Date();
  const timeFactor = (dNow.getHours() + dNow.getMinutes()/60) * 0.1;
  for(let y=0; y<h; y++){
    let pos = (y/h) * (n - 1.001) + ombreScroll + timeFactor * 0.5;
    pos = pos % n; if(pos < 0) pos += n; if(pos >= n) pos = 0;
    const i1 = Math.floor(pos), i2 = (i1+1) % n, t = pos % 1;
    const c = lerpRgb(currentPalette[i1], currentPalette[i2], t);
    const k = y*4;
    d[k]=c[0]; d[k+1]=c[1]; d[k+2]=c[2]; d[k+3]=255;
  }
  stripCtx.putImageData(id, 0, 0);
  targetCtx.imageSmoothingEnabled = false;
  targetCtx.drawImage(strip, 0, 0, w, h);
  targetCtx.imageSmoothingEnabled = true;
}

/* ---------- WAVES — the original motion, tunable and breathing ---------- */
function drawWaves(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 2;
  const numLines = LAYER_N.waves, m = mo("waves"), sw = swell("waves"), irr = 1 - m.regularity;
  const amp = breathAmp(0.5, 2) * m.variation * sw.amp, ph = breathPhase(2);
  const a = (0.7 * breathAlpha(0.4, 2) * sw.alpha).toFixed(3);
  for(let i=0; i<numLines; i++){
    const s = SEED.waves[i], t = CLOCK.waves[i];
    const y = (i/numLines) * H + s[0] * irr * (H/numLines) * 0.8;
    const lp = ph + s[1] * irr * Math.PI;
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    const rise = Math.sin(t*0.025 + y*0.01 + lp)*50;
    for(let x=0; x<W; x+=10){
      const c = lerpRgb(c1, c2, x / W);
      const y1 = y + (rise + Math.sin(t*0.015 + x*0.02 + lp)*20) * amp;
      const y2 = y + (rise + Math.sin(t*0.015 + (x+10)*0.02 + lp)*20) * amp;
      ctx.strokeStyle = rgba(c, a);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+10, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- LINES — the original shimmer, tunable and breathing ---------- */
function drawLines(){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 1.5;
  const numLines = LAYER_N.lines, m = mo("lines"), sw = swell("lines"), irr = 1 - m.regularity;
  const amp = breathAmp(0.6, 1) * m.variation * sw.amp, ph = breathPhase(1);
  const a = (0.7 * breathAlpha(0.4, 1) * sw.alpha).toFixed(3);
  for(let i=0; i<numLines; i++){
    const s = SEED.lines[i], t = CLOCK.lines[i];
    const y = i * (H/numLines) + s[0] * irr * (H/numLines) * 0.8;
    const lp = ph + s[1] * irr * Math.PI;
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    const rise = Math.sin(t*0.03 + y*0.01 + lp)*10;
    for(let x=0; x<W; x+=20){
      const c = lerpRgb(c1, c2, x / W);
      const y1 = y + (rise + Math.sin(t*0.01 + x*0.02 + lp)*5) * amp;
      const y2 = y + (rise + Math.sin(t*0.01 + (x+20)*0.02 + lp)*5) * amp;
      ctx.strokeStyle = rgba(c, a);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+20, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- OPENING — the title IS the opening movie --------- */
function drawOpening(){
  drawOmbre(ctx, W, H);
  const T = TYPE.title, C = TYPE.cred;

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  // title — fitted, stacked when that's bigger, every letter alive
  let li = 0;
  T.rows.forEach(function(r, ri){
    ctx.font = r.font;
    let x = W/2 - r.total/2;
    for(let i=0;i<r.chars.length;i++){
      const c = currentPalette[(li + Math.floor(frame*0.02)) % 8];
      const yOff = Math.sin(frame*0.03 + li*0.7 + ri*0.9) * r.size*0.06;
      ctx.shadowColor = rgba(c, 0.9);
      ctx.shadowBlur = 28 + Math.sin(frame*0.05 + li)*10;
      ctx.fillStyle = "rgba(255,255,255,0.96)";
      ctx.fillText(r.chars[i], x + r.widths[i]/2, T.ys[ri] + yOff);
      x += r.widths[i] + r.track;
      li++;
    }
  });

  // the credit — Interactive Fine Art by Maxximillian
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawRow(C.c1, W/2, C.c1y);
  ctx.fillStyle = rgba(currentPalette[6], 0.95);
  drawRow(C.c2, W/2, C.c2y);
  if(C.num){
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    drawRow(C.num, W/2, C.ny);
  }
  ctx.restore();

  const s = 1 + Math.sin(frame*0.05)*0.025;
  beginBtn.style.transform = "translateX(-50%) scale(" + s + ")";
}

/* ---------- COMMUNITY CARD (D) — typography only -------------
   The Telegram doorway, drawn in code, tappable on any device. */
function drawCommunityCard(){
  devHits = [];
  const K = TYPE.card;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.68)";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = K.big + "px " + fontStack(WORK.titleFont);
  const c = currentPalette[5];
  ctx.shadowColor = rgba(c, 0.9);
  ctx.shadowBlur = 30;
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  ctx.fillText("ABSTRACTIANS", W/2, H*0.34);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawRow(K.sub, W/2, H*0.34 + K.big*0.95);

  // the link — a real doorway, boxed and glowing
  ctx.font = K.linkS + "px " + fontStack(UI_FONT);
  const boxW = K.linkW + K.linkS*2.2, boxH = K.linkS*2.4;
  const boxX = W/2 - boxW/2, boxY = H*0.58 - boxH/2;
  ctx.fillStyle = rgba(c, 0.18);
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = rgba(c, 0.95);
  ctx.lineWidth = 2;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.fillText(WORK.telegram, W/2, H*0.58);
  devHits.push({ x:boxX, y:boxY, w:boxW, h:boxH, act:"link" });

  ctx.font = K.foot + "px " + fontStack(UI_FONT);
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("tap to join \u00b7 tap anywhere else to return", W/2, H*0.58 + boxH);
  ctx.restore();
}

/* ---------- LAGNIAPPE — typographic, from the config ---------- */
function drawLagniappe(){
  const linesArr = WORK.lagniappe[activeLagniappe];
  if(!linesArr) return;
  const size = lagSize(linesArr);
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = size + "px " + fontStack(WORK.titleFont);
  const startY = H/2 - ((linesArr.length-1)*size*1.3)/2;
  const a = (0.97 * breathAlpha(0.3, 3)).toFixed(3), blur = 34 * breathAmp(0.6, 3);
  for(let i=0;i<linesArr.length;i++){
    const c = currentPalette[(i*2+1) % 8];
    ctx.shadowColor = rgba(c, 0.95);
    ctx.shadowBlur = blur;
    ctx.fillStyle = "rgba(255,255,255," + a + ")";
    ctx.fillText(linesArr[i], W/2, startY + i*size*1.3);
  }
  ctx.restore();
}

/* ---------- INTERACTIVE MENU ---------- */
const MENU_ROWS = [
  { k:"w", label:"Waves" },
  { k:"l", label:"Lines" },
  { k:"o", label:"Oneness" },
  { k:"c", label:"Color shift" },
  { k:"q", label:"All quiet" },
  { k:"d", label:"Community" },
  { k:"b", label:"Begin again" },
  { k:"x", label:"Close menu" }
];
function stateText(k){
  if(k==="w") return modeWaves ? "ON" : "OFF";
  if(k==="l") return modeLines ? "ON" : "OFF";
  if(k==="o") return modeOneness ? "ON" : "OFF";
  if(k==="q") return modeQuiet ? "ON" : "OFF";
  if(k==="c") return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : "LIVE";
  return "";
}
function stateOn(k){
  if(k==="w") return modeWaves;
  if(k==="l") return modeLines;
  if(k==="o") return modeOneness;
  if(k==="q") return modeQuiet;
  if(k==="c") return colorShiftIdx >= 0;
  return false;
}
function drawMenu(){
  menuHits = [];
  const M = TYPE.menu;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.62)";
  ctx.fillRect(0,0,W,H);

  ctx.textBaseline = "middle";
  const fs = M.fs, rowH = M.rowH, rowW = M.rowW;
  const startY = H/2 - (MENU_ROWS.length*rowH)/2 - rowH*0.3;
  const rowX = W/2 - rowW/2;

  for(let i=0;i<MENU_ROWS.length;i++){
    const r = MENU_ROWS[i];
    const y = startY + i*rowH;
    const on = stateOn(r.k);
    const c = currentPalette[i % 8];

    ctx.fillStyle = on ? rgba(c, 0.38) : "rgba(255,255,255,0.07)";
    ctx.fillRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    if(on){
      ctx.strokeStyle = rgba(c, 0.95);
      ctx.lineWidth = 2;
      ctx.strokeRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    }

    ctx.font = fs + "px " + fontStack(UI_FONT);
    ctx.textAlign = "left";
    ctx.fillStyle = rgba(c, 1);
    ctx.fillText(r.k === "x" ? "\u2715" : r.k.toUpperCase(), rowX + rowW*0.06, y + rowH/2);

    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText(r.label, rowX + rowW*0.17, y + rowH/2);

    const st = stateText(r.k);
    if(st){
      ctx.textAlign = "right";
      ctx.fillStyle = on ? rgba(c,1) : "rgba(255,255,255,0.3)";
      ctx.fillText(st, rowX + rowW*0.94, y + rowH/2);
    }

    menuHits.push({ x:rowX, y:y, w:rowW, h:rowH, k:r.k });
  }

  ctx.textAlign = "center";
  ctx.font = M.tag + "px " + fontStack(UI_FONT);
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  const tag = "ABSTRACTIA" + (WORK.numeral ? " " + WORK.numeral : "");
  ctx.fillText(tag, W/2, startY + MENU_ROWS.length*rowH + rowH*0.5);
  ctx.restore();
}

/* ---------- LIVE SCENE ---------- */
function drawLive(){
  ctx.globalAlpha = breathAlpha(0.22, 0);   // the ombre inhales too — opacity only
  drawOmbre(ctx, W, H);                  // Smooth — the serene default
  ctx.globalAlpha = 1;
  if(modeLines) drawLines();
  if(modeWaves) drawWaves();
  if(activeLagniappe) drawLagniappe();
  if(modeDev) drawCommunityCard();
  if(modeMenu) drawMenu();
}

/* ---------- main loop ---------- */
function loop(){
  frame++;
  if(TYPE.dirty) computeType();
  // the title fell back? keep a quiet eye out and snap TRUE the moment it lands
  else if(!TYPE.titleTrue && frame % 30 === 0 && fontIsReal(WORK.titleFont)) markType();
  updatePalette();
  updateBreath();
  tickMotion();
  ombreScroll -= 0.01 * breathAmp(0.8, 0);
  ctx.clearRect(0,0,W,H);

  if(scene === 0){
    drawOpening();
  } else if(scene === 1){
    drawOpening();
    fadeAlpha += FADE_RATE;
    ctx.fillStyle = "rgba(0,0,0," + Math.min(1, fadeAlpha/255) + ")";
    ctx.fillRect(0,0,W,H);
    if(fadeAlpha >= 255){
      fadeAlpha = 255;
      scene = 2;
      beginBtn.style.display = "none";
      showHint();
    }
  } else {
    drawLive();
    mixStems();
    if(fadeAlpha > 0){
      fadeAlpha -= FADE_RATE;
      ctx.fillStyle = "rgba(0,0,0," + Math.max(0, fadeAlpha/255) + ")";
      ctx.fillRect(0,0,W,H);
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- hint: after Begin, gone in eight seconds ---------- */
let hintTimer = null;
function showHint(){
  hintEl.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ hintEl.classList.remove("on"); }, 8000);
}

/* ---------- one brain for keyboard AND touch ---------- */
function resetToOpening(){
  scene = 0; fadeAlpha = 0;
  modeLines = modeWaves = modeQuiet = modeMenu = modeDev = modeOneness = false;
  oneAmt = 0;
  activeLagniappe = null;
  colorShiftIdx = -1;
  stopStems();
  beginBtn.style.display = "block";
  hintEl.classList.remove("on");
  snapPalette(paletteKeyForNow());
}
function toggleMode(k){
  if(k === "b"){ if(scene > 0) resetToOpening(); return; }
  if(scene !== 2) return;
  if(k === "c"){
    // Color shift — cycle the palettes, land back on live time
    colorShiftIdx++;
    if(colorShiftIdx >= SHIFT_ORDER.length) colorShiftIdx = -1;
  }
  else if(k === "l"){ modeLines = !modeLines; }
  else if(k === "w"){ modeWaves = !modeWaves; }
  else if(k === "o"){ modeOneness = !modeOneness; }
  else if(k === "q"){ modeQuiet = !modeQuiet; }
  else if(k === "i"){ modeMenu = !modeMenu; if(modeMenu) modeDev = false; }
  else if(k === "d"){ modeDev = !modeDev; if(modeDev) modeMenu = false; }
  else if(k === "x"){ modeMenu = false; }
  else if(WORK.lagniappe[k]){
    activeLagniappe = (activeLagniappe === k) ? null : k;
  }
}

document.addEventListener("keydown", function(e){
  toggleMode(e.key.toLowerCase());
});

/* ---------- touch + mouse ---------- */
document.addEventListener("touchstart", function(e){
  if(scene === 2 && e.touches.length === 2 && !modeMenu && !modeDev){
    modeMenu = true;
  }
}, {passive:true});

cv.addEventListener("pointerdown", function(e){
  if(scene !== 2) return;
  const x = e.clientX, y = e.clientY;

  if(modeMenu){
    for(const h of menuHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h){
        toggleMode(h.k);
        return;
      }
    }
    modeMenu = false;      // tapped the art — let it breathe
    return;
  }

  if(modeDev){
    for(const h of devHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h && h.act === "link"){
        window.open("https://" + WORK.telegram, "_blank", "noopener");
        return;
      }
    }
    modeDev = false;       // tapped outside the doorway — return to the work
  }
});

/* ---------- begin ---------- */
beginBtn.addEventListener("click", function(){
  if(scene === 0){
    startStems();          // inside the gesture — autoplay never blocks
    scene = 1;
  }
});

/* ---------- resize: square, portrait, landscape — re-fit live, no reload */
function fit(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W; cv.height = H;
  markType();
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function(){ setTimeout(fit, 80); });

/* ---------- boot ---------- */
fit();
snapPalette(paletteKeyForNow());
loadStems();
// draw with the fallback for a heartbeat, re-measure the instant a real face lands
if(document.fonts){
  if(document.fonts.ready) document.fonts.ready.then(markType);
  if(document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", markType);
  [WORK.titleFont, WORK.h2Font, UI_FONT, CTA_FONT].forEach(function(f){
    document.fonts.load("100px '" + f + "'").then(markType, markType);
  });
}
loop();
</script>
