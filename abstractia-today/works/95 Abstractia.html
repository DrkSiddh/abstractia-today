const TWILIGHT_PALETTE = ["ae7981", "543d4f", "2d2c34", "62354c", "36222b", "36222b", "36222b", "36222b", "36222b", "36222b"];
const LIME_PALETTE = ["004b23", "006400", "007200", "008000", "38b000", "70e000", "9ef01a", "ccff33", "ccff33", "ccff33"];

const BRIGHTS_PALETTE = ["35ff69", "42bfdd", "0a090c", "f5b700", "00a1e4", "e63462", "d138bf", "f2f5ea", "d63230", "f06449"];

const BORDEAUX_PALETTE = ["590d22", "800f2f", "a4133c", "c9184a", "ff4d6d", "ff758f", "ff8fa3", "ffb3c1", "ffccd5", "fff0f3"];
const METAL_PALETTE = ["101213", "5B6063", "212428", "C5C9CD", "121315"];

let colorsPalette = [];

function applyChromaKey(img) {
  img.loadPixels();
  for (let y = 0; y < img.height; y++) {
    for (let x = 0; x < img.width; x++) {
      let i = (x + y * img.width) * 4;
      let r = img.pixels[i];
      let g = img.pixels[i + 1];
      let b = img.pixels[i + 2];
      
      let isKeyed = (g > 120 && r < 100 && b < 100);
      let d = dist(r, g, b, 37, 120, 44);

      if (isKeyed) {
        img.pixels[i + 3] = 0;
      } else if (d < 55) {
        let sideWeight = map(x, img.width * 0.3, img.width * 0.9, 0, 1, true);
        let alphaValue = map(d, 0, 55, 0, 255);
        let alphaFinal = lerp(255, alphaValue, sideWeight);
        img.pixels[i + 3] = min(img.pixels[i + 3], alphaFinal);
      }
    }
  }
  img.updatePixels();
}

function getPaletteByTime() {
    let h = hour();
    let m = minute();
    let totalMins = h * 60 + m;

    if (showLinesMode || showWavesMode) {
      return { colors: PURPLE_PEACH_PALETTE, type: "PURPLE_PEACH" };
    }

    if (totalMins >= 488 && totalMins <= 932) return { colors: MAROON_PALETTE, type: "MAROON" };
    if (totalMins >= 980 && totalMins <= 1074) return { colors: MINT_PALETTE, type: "MINT" };
    if (totalMins >= 1075 && totalMins <= 1329) return { colors: PURPLE_PEACH_PALETTE, type: "PURPLE_PEACH" };

    if (totalMins >= 1260 || totalMins <= 141) return { colors: BORDEAUX_PALETTE, type: "BORDEAUX" };
    if (totalMins >= 213 && totalMins <= 419) return { colors: DAWN_PALETTE_BASE, type: "DAWN" };
    if (totalMins >= 660 && totalMins <= 979) return { colors: DESERT_PALETTE, type: "DESERT" };
    if (totalMins >= 540 && totalMins < 660) return { colors: BRIGHTS_PALETTE, type: "BRIGHTS" };
    if ((h === 16 && m >= 20) || (h === 17)) return { colors: LIME_PALETTE, type: "LIME" };
    if (h >= 18 && h < 21) return { colors: TWILIGHT_PALETTE, type: "TWILIGHT" };
    if (h >= 21 || h < 3) return { colors: NIGHT_PALETTE, type: "NIGHT" };
    return { colors: DAY_PALETTE, type: "DAY" };
}

function setup() {
  cnv = createCanvas(windowWidth, windowHeight);
  imageMode(CENTER);

  cnv.elt.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
  
  let style = document.createElement('style');
  style.innerHTML = `@font-face { font-family: 'Rock3D-Regular'; src: url('https://dae.transientusercontent.xyz/uploads/fa827533-05e2-4540-b01f-5b7c3bcdeed4') format('truetype'); }`;
  document.head.appendChild(style);

  applyChromaKey(imgSkelevaggio);

  videoOpeningVI = createVideo('https://dae.transientusercontent.xyz/uploads/630a59a0-15f7-4021-90da-67fb4a5c9936');
  videoOpeningVI.elt.muted = true;
  videoOpeningVI.elt.setAttribute('playsinline', '');
  videoOpeningVI.elt.setAttribute('webkit-playsinline', '');
  videoOpeningVI.loop();
  videoOpeningVI.hide();

  videoEarthAccordingToMermaids = createVideo('https://dae.transientusercontent.xyz/uploads/6dffff3a-5ce8-4968-9a74-2c2e940d5a25');
  videoEarthAccordingToMermaids.elt.muted = true;
  videoEarthAccordingToMermaids.elt.setAttribute('playsinline', '');
  videoEarthAccordingToMermaids.elt.setAttribute('webkit-playsinline', '');
  videoEarthAccordingToMermaids.loop();
  videoEarthAccordingToMermaids.hide(); 
  videoEarthAccordingToMermaids.pause();

  imgAbstractLindiaGif = createVideo('https://dae.transientusercontent.xyz/uploads/ee55ee3a-c3c7-4095-b2dc-7baaef466749');
  imgAbstractLindiaGif.elt.muted = true;
  imgAbstractLindiaGif.elt.setAttribute('playsinline', '');
  imgAbstractLindiaGif.elt.setAttribute('webkit-playsinline', '');
  imgAbstractLindiaGif.loop();
  imgAbstractLindiaGif.hide();
  imgAbstractLindiaGif.pause();

  videoBlaqqatDevV = createVideo('https://dae.transientusercontent.xyz/uploads/5b0267d3-f495-4633-8355-90929be15143');
  videoBlaqqatDevV.elt.muted = false;
  videoBlaqqatDevV.elt.setAttribute('playsinline', '');
  videoBlaqqatDevV.elt.setAttribute('webkit-playsinline', '');
  videoBlaqqatDevV.loop();
  videoBlaqqatDevV.hide();
  videoBlaqqatDevV.pause();

  if (audioVCurious) {
    audioVCurious.setLoop(true);
    audioVCurious.setVolume(0.5);
  }
  
  if (audioSoftMystical) {

  if (audioVLinesUnderh20) {
    audioVLinesUnderh20.setLoop(true);

  }

  button = createButton('Get Abstract');
  button.mousePressed(handleDiveIn);
  button.mouseOver(() => { isHovering = true; });
  button.mouseOut(() => { isHovering = false; });
  
  button.style('font-family', 'Rock3D-Regular, sans-serif'); 
  button.style('letter-spacing', '2px');
  button.style('font-size', '36px');
  button.style('padding', '15px 30px');
  button.style('border', 'none');
  button.style('border-radius', '8px');
  button.style('cursor', 'pointer');
  button.style('color', 'white'); 
  button.style('background-color', 'transparent');
  button.style('position', 'absolute');
  button.style('white-space', 'nowrap');
  
  button.position(width / 2, height * 0.75 - 100);
  
  let initial = getPaletteByTime(); 
  currentPaletteHex = [...initial.colors];
  targetPaletteHex = [...initial.colors];
  lastPaletteType = initial.type;

  for (let hex of currentPaletteHex) {

function startAudioContext() {
  if (getAudioContext().state !== 'running') {
    getAudioContext().resume();
  }
}

function updatePalette() {
    let result = getPaletteByTime();
    if (result.type !== lastPaletteType) {
        let newSet = [...result.colors];
        if (result.type === "DAWN" || result.type === "BRIGHTS") {
            newSet.sort(() => random() - 0.5); 
        }
        targetPaletteHex = newSet;
        lastPaletteType = result.type;
    }
}

function lerpPalettes() {
    let targetLen = targetPaletteHex.length;
    for (let i = 0; i < targetLen; i++) {
        let targetColor = color('#' + targetPaletteHex[i]);
        if (colorsPalette[i]) {
            colorsPalette[i] = lerpColor(colorsPalette[i], targetColor, paletteLerpRate);
        } else {
            colorsPalette[i] = targetColor;
        }
    }
    if (colorsPalette.length > targetLen) {
        colorsPalette.splice(targetLen);
    }
}

function keyPressed() {
  if (key === 'b' || key === 'B') {
    if (scene > 0) {
      scene = 0;
      fadeAlpha = 0;
      showAlternateView = false;
      showCompanionView = false;
      showLinesMode = false;
      showWavesMode = false;
      showMountainMode = false;
      showRingMode = false;
      backgroundVideoAlpha = 255;
      isQuietMode = false;
      showControlsMenu = false;
      isDeveloperMode = false;
      videoEarthAccordingToMermaids.pause();
      imgAbstractLindiaGif.pause();
      videoBlaqqatDevV.pause();
      if (videoOpeningVI) videoOpeningVI.loop();
      if (audioVCurious && audioVCurious.isPlaying()) audioVCurious.stop();
      if (audioSoftMystical && audioSoftMystical.isPlaying()) audioSoftMystical.stop();
      if (audioVLinesUnderh20 && audioVLinesUnderh20.isPlaying()) audioVLinesUnderh20.stop();
      button.show();
      button.removeAttribute('disabled');
      bubbles = [];
    }
  } else if (key === 'a' || key === 'A') {
    if (scene === 2) {
      showAlternateView = !showAlternateView;
      if (showAlternateView) { 
        isDeveloperMode = false; 
        videoBlaqqatDevV.pause();
        showControlsMenu = false;
      }
    }
  } else if (key === 'c' || key === 'C') {
    if (scene === 2) {
      showCompanionView = !showCompanionView;
    }
  } else if (key === 'l' || key === 'L') {
    if (scene === 2) showLinesMode = !showLinesMode;
  } else if (key === 'w' || key === 'W') {
    if (scene === 2) showWavesMode = !showWavesMode;
  } else if (key === 's' || key === 'S') {
    if (scene === 2) showMountainMode = !showMountainMode;
  } else if (key === 'o' || key === 'O') {
    if (scene === 2) showRingMode = !showRingMode;
  } else if (key === 'q' || key === 'Q') {
    if (scene === 2) isQuietMode = !isQuietMode;
  } else if (key === 'i' || key === 'I') {
    if (scene === 2) {
      showControlsMenu = !showControlsMenu;
      if (showControlsMenu) { isDeveloperMode = false; videoBlaqqatDevV.pause(); showAlternateView = false; }
    }
  } else if (key === 'd' || key === 'D') { 
    if (scene === 2) {
      isDeveloperMode = !isDeveloperMode;
      if (isDeveloperMode) { 
        showControlsMenu = false; 
        showAlternateView = false; 
      }
    }
  } else if (key === 'm' || key === 'M') {
    if (scene === 2 && isDeveloperMode) {
      isDevVideoMuted = !isDevVideoMuted;
      videoBlaqqatDevV.elt.muted = isDevVideoMuted;
    }
  }
}

function drawOmbreBackground() {
  if (colorsPalette.length < 2) return;
  
  colorMode(HSL, 360, 100, 100, 1);
  let cPurple = color(284, 100, 53, 1);
  let cLime = color(77, 100, 64, 1);
  colorMode(RGB, 255);
  
  const gradientColors = colorsPalette; 
  let h = hour();
  let m = minute();
  let totalMins = h * 60 + m;
  let isDawnTime = (totalMins >= 213 && totalMins <= 419);
  
  noFill();
  strokeWeight(2); 

  let timeShift = frameCount * 0.006;
  let drift = sin(frameCount * 0.002) * 0.05;

  for (let y = 0; y < height; y += 2) {
    let inter = map(y, 0, height, 0, 1);
    let wave = sin(y * 0.0015 + timeShift) * 0.12;
    let animatedInter = constrain(inter + wave + drift, 0, 1);
    
    let finalCol;
    if (isDawnTime) {
      finalCol = lerpColor(cPurple, cLime, animatedInter);
    } else {
      let palettePos = map(animatedInter, 0, 1, 0, gradientColors.length - 1);
      let idx = floor(palettePos);
      let f = palettePos % 1;
      finalCol = lerpColor(gradientColors[idx], gradientColors[(idx + 1) % gradientColors.length], f);
    }
    stroke(finalCol);
    line(0, y, width, y);
  }
}

function drawAmbientSweep() {
  push();
  blendMode(SCREEN);
  noStroke();
  let numBands = 3;
  for (let i = 0; i < numBands; i++) {
    let speed = 0.0005 * (i + 1);
    let offset = frameCount * speed;
    let x = (offset * width) % (width + 800) - 400;
    let bandWidth = width * 0.4;
    let c = colorsPalette[i % colorsPalette.length];
    
    for (let j = 0; j < bandWidth; j += 15) {
      let alpha = map(abs(j - bandWidth / 2), 0, bandWidth / 2, 40, 0);
      fill(red(c), green(c), blue(c), alpha);
      rect(x + j, 0, 15, height);
    }
  }
  pop();
}

function drawMountainPattern() {
  push();
  blendMode(LIGHTEST); 
  noStroke();
  let layers = 8;
  let time = frameCount * 0.001;
  for (let i = 0; i < layers; i++) {
    let hexCol = METAL_PALETTE[i % METAL_PALETTE.length];
    let cBase = color('#' + hexCol);
    fill(red(cBase), green(cBase), blue(cBase), 180);
    beginShape();
    vertex(0, height);
    let layerBaseY = height * 0.3 + (i * 80);
    for (let x = 0; x <= width; x += 10) {
      let noiseVal = noise(x * 0.002, i * 20, time);
      let h = map(noiseVal, 0, 1, -150, 150);
      vertex(x, layerBaseY + h);
    }
    vertex(width, height);
    endShape(CLOSE);
  }
  pop();
}

function drawUndulatingWavePattern() {
  push();
  blendMode(showCompanionView ? ADD : SCREEN); 
  strokeWeight(showCompanionView ? 3 : 2);
  noFill();
  const patternColors = colorsPalette.map(c => color(red(c), green(c), blue(c), 180));
  let numLines = 50; 
  let density = map(sin(frameCount * 0.005), -1, 1, 0.005, 0.015);
  for (let i = 0; i < numLines; i++) {
    let y = map(i, 0, numLines, 0, height);
    let c1 = patternColors[i % patternColors.length]; 
    for (let x = 0; x < width; x += 10) {
        let finalColor = lerpColor(c1, patternColors[(i + 2) % patternColors.length], x / width);
        let x1 = x, x2 = x + 10;
        let w1 = sin(frameCount * 0.025 + y * density) * 50 + sin(frameCount * 0.015 + x1 * 0.02) * 20;
        let w2 = sin(frameCount * 0.025 + y * density) * 50 + sin(frameCount * 0.015 + x2 * 0.02) * 20;
        stroke(finalColor);
        line(x1, y + w1, x2, y + w2);
    }
  }
  pop();
}

function drawWhimsicalOrganicLines() {
  push();
  blendMode(showCompanionView ? SCREEN : BLEND);
  noFill();
  
  let time = frameCount * 0.006;
  let numPaths = 16;

  for (let i = 0; i < numPaths; i++) {
    let cIndex = i % max(1, colorsPalette.length - 1);
    let c = colorsPalette[cIndex];
    let waveAlpha = map(sin(time + i * 0.3), -1, 1, 150, 230);
    stroke(red(c), green(c), blue(c), waveAlpha);
    
    let sw = noise(i * 5, time * 0.5) * 3 + (showCompanionView ? 2.5 : 1.2);
    strokeWeight(sw);
    
    beginShape();
    if (!showRingMode) {
      let yBase = (height / (numPaths + 1)) * (i + 1);
      for (let x = -200; x <= width + 200; x += 40) {
        let noise1 = noise(x * 0.0008, i * 1.5, time * 0.5);
        let noise2 = noise(x * 0.004, time * 0.7);
        let yOffset = (noise1 * 550 - 275) + (noise2 * 120 - 60);
        let ySine = sin(x * 0.0012 + time * 1.5 + i * 0.8) * 90;
        curveVertex(x, yBase + yOffset + ySine);
      }
    } else {
      let centerX = width / 2;
      let centerY = height * 0.45; 
      let baseScale = min(width, height) * 0.022; 
      for (let angle = 0; angle <= TWO_PI + 0.2; angle += 0.05) {
        let n1 = noise(cos(angle) * 0.8 + 1, sin(angle) * 0.8 + 1, time * 0.4 + i * 0.1);
        let n2 = noise(cos(angle) * 2 + 10, sin(angle) * 2 + 10, time * 0.2);
        let rOffset = (n1 * 120 - 60) + (n2 * 40 - 20) + sin(angle * 14 + time * 2 + i) * 10;
        
        let heartX = 16 * Math.pow(Math.sin(angle), 3);
        let heartY = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
        
        let r = baseScale + (i * 0.6) + (rOffset * 0.05);
        let vx = centerX + heartX * r;
        let vy = centerY + heartY * r;
        curveVertex(vx, vy);
      }
    }
    endShape();
  }
  pop();
}

function draw() {
  updatePalette();
  lerpPalettes();
  background(0);

  if (scene === 0 || scene === 1) {
    drawOmbreBackground();
    for (let p of bgParticles) {
      p.update();
      p.display();
    }
    drawWelcomeScreen();
    drawAmbientSweep();
  }
  
  if (scene === 2) {
    drawVideoScreen(); 
    handleAudioVolume();
    if (showControlsMenu) drawGenesisOverlay();
    if (isDeveloperMode) drawCommunityCardOverlay();
    if (showAlternateView) drawAlternateImageOverlay();
  }

  if (scene === 0) {
    animateButton();
    handleHoverEffects();
    button.show();
  } else if (scene === 1) {
    handleFadeOut();
    button.hide();
  } else if (scene === 2) {
    handleFadeIn();
  }
}

function drawGenesisOverlay() {
  let img = imgGenesisControl;
  if (img && img.width > 0) {
    push();
    blendMode(HARD_LIGHT);
    tint(255, 255 * 0.9); 
    let ratio = max(width / img.width, height / img.height);
    image(img, width / 2, height / 2, img.width * ratio, img.height * ratio);
    pop(); 
  }
}

function drawCommunityCardOverlay() {
  let img = imgCommunityCard;
  if (img && img.width > 0) {
    push();
    blendMode(SCREEN); 
    tint(255, 255); 
    let ratio = max(width / img.width, height / img.height);
    image(img, width / 2, height / 2, img.width * ratio, img.height * ratio);
    pop();
  }
}

function drawAlternateImageOverlay() {
    let img = imgSkelevaggio; 
    if (!img || img.width === 0) return;
    push();
    blendMode(BLEND); 
    let ratioImg = max(width / img.width, height / img.height);
    image(img, width / 2, height / 2, img.width * ratioImg, img.height * ratioImg);
    pop(); 
}

function handleHoverEffects() {
  if (isHovering) {
    let centerX = width / 2, centerY = height * 0.75 - 100;
    for (let i = 0; i < 2; i++) bubbles.push(new Bubble(centerX + random(-10, 10), centerY + random(-10, 10)));
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    bubbles[i].update();
    bubbles[i].display();
    if (bubbles[i].isDead()) bubbles.splice(i, 1);
  }
}

function handleAudioVolume() {
  if (audioVCurious && audioVCurious.isPlaying()) {
    let targetVolAmbient = isQuietMode ? 0.0 : 0.5; 
    audioVCurious.setVolume(lerp(audioVCurious.getVolume(), targetVolAmbient, LERP_RATE));
  }
  
  if (audioVLinesUnderh20) {
    if (showLinesMode && scene === 2 && !isQuietMode) {
      if (!audioVLinesUnderh20.isPlaying()) audioVLinesUnderh20.loop();
      audioVLinesUnderh20.setVolume(lerp(audioVLinesUnderh20.getVolume(), 0.6, LERP_RATE));
    } else {
      let currentVol = audioVLinesUnderh20.getVolume();
      audioVLinesUnderh20.setVolume(lerp(currentVol, 0.0, LERP_RATE));
      if (currentVol < 0.01 && audioVLinesUnderh20.isPlaying()) audioVLinesUnderh20.pause();
    }
  }
}

function drawWelcomeScreen() {
  if (!img94Abstractia || img94Abstractia.width === 0) return;
  push();
  tint(255, 255 * 0.85);
  let ratio = max(width / img94Abstractia.width, height / img94Abstractia.height);
  image(img94Abstractia, width / 2, height / 2, img94Abstractia.width * ratio, img94Abstractia.height * ratio);
  pop();
}

function drawVideoScreen() {
    drawOmbreBackground(); 
    let mediaToDraw = null;
    let baseBlendMode = BLEND;

    if (!showAlternateView) {
        mediaToDraw = imgAbstractLindiaGif;
        if (imgAbstractLindiaGif) imgAbstractLindiaGif.loop();
        if (showCompanionView) baseBlendMode = SCREEN; 
    }

    if (mediaToDraw && mediaToDraw.width > 0) {
        push();
        blendMode(baseBlendMode); 
        let ratioBase = max(width / mediaToDraw.width, height / mediaToDraw.height);
        image(mediaToDraw, width / 2, height / 2, mediaToDraw.width * ratioBase, mediaToDraw.height * ratioBase);
        pop();
    }

    if (showCompanionView) {
        push();
        blendMode(OVERLAY); 
        drawOmbreBackground();
        pop();
    }

    if (showLinesMode) drawWhimsicalOrganicLines();
    if (showWavesMode) drawUndulatingWavePattern();
    if (showMountainMode) drawMountainPattern(); 
}

function animateButton() {
  let scaleFactor = map(sin(frameCount * 0.05), -1, 1, 1, 1.05);
  button.style('transform', `translate(-50%, -50%) scale(${scaleFactor})`);
}

function handleDiveIn() {
  startAudioContext();
  if (audioSoftMystical && audioSoftMystical.isLoaded()) audioSoftMystical.play();
  if (videoOpeningVI) videoOpeningVI.pause();
  if (scene === 0) {
    scene = 1;
    button.attribute('disabled', '');
  }
}

function handleFadeOut() {
  fadeAlpha += fadeRate;
  fill(0, fadeAlpha);
  rect(0, 0, width, height);
  if (fadeAlpha >= 255) {
    fadeAlpha = 255;
    scene = 2;
    if (audioVCurious && !audioVCurious.isPlaying()) audioVCurious.play();
  }
}

function handleFadeIn() {
  fadeAlpha -= fadeRate;
  fill(0, fadeAlpha);
  rect(0, 0, width, height);
  if (fadeAlpha <= 0) fadeAlpha = 0;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  if (button) button.position(width / 2, height * 0.75 - 100);
}

class Bubble {
  constructor(x, y) {
    this.pos = createVector(x, y);
    this.vel = p5.Vector.fromAngle(random(TWO_PI), random(2, 5));
    this.lifespan = 255;
    this.size = random(18, 36);
  }
  update() {
    this.pos.add(this.vel);
    this.vel.y = lerp(this.vel.y, -2, 0.05); 
    this.vel.mult(0.98); 
    this.lifespan -= 2.5; 
  }
  display() {
    push();
    textSize(this.size);
    textAlign(CENTER, CENTER);
    fill(255, this.lifespan); 
    text("🫧", this.pos.x, this.pos.y);
    pop();
  }
  isDead() { return this.lifespan < 0; }
}

class BackgroundParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.pos = createVector(random(width), random(height));
    this.vel = createVector(random(-0.5, 0.5), random(-0.2, -0.8));
    this.size = random(2, 6);
    this.alpha = random(50, 150);
  }
  update() {
    this.pos.add(this.vel);
    if (this.pos.y < -10) this.pos.y = height + 10;
    if (this.pos.x < -10) this.pos.x = width + 10;
    if (this.pos.x > width + 10) this.pos.x = -10;
  }
  display() {
    push();
    noStroke();
    let c = colorsPalette[floor(random(colorsPalette.length))];
    fill(red(c), green(c), blue(c), this.alpha);
    circle(this.pos.x, this.pos.y, this.size);
    pop();
  }
}
