<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@0.7.0/lib/addons/p5.sound.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "mediabunny": "https://cdn.jsdelivr.net/npm/mediabunny@1.25.8/+esm"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      display: flex;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      overflow: auto;
      background: transparent;
    }

    main {
      height: 100%;
      display: flex;
      overflow: auto;
      justify-content: center;
      align-items: center;
    }

    #p5_loading {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      animation-delay: 1s;
      color: #4e5d7b;
      font-family: "FK Grotesk Regular", sans-serif;
      font-size: 30px;
      font-style: normal;
      font-weight: 400;
      line-height: 30px;
      letter-spacing: -1.5px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>
  <title>289 Abstractia Sherbet | Made on juno.transient.xyz</title>
</head>
<body>
  
    
  <script>
    let cnv, isMobile, button, fontRock3D, fontAsimovian;
let imgWifPatronsAbstractia, imgIsleChillGif, imgAbstractiaControlPanel;
let audioOpeningIIAbstractia, audioRelaxingLoop;

let scene = 0; 
let fadeAlpha = 0;
let fadeRate = 4;
let showAlternateView = false;
let showLinesMode = false; 
let showWavesMode = true; 
let showSauceMode = false; 
let isQuietMode = false;
let showControlsMenu = false;
let isEtherealMode = false;
let isHovering = false;

let bubbles = []; 
let sauceParticles = [];
let currentPalette = [];
let targetPalette = [];
let currentLinePalette = [];
let lineTargetPalette = [];
let paletteLerpRate = 0.005;
let paletteOffset = 0; 

const DAY_PALETTE = ["#03045e", "#023e8a", "#0077b6", "#0096c7", "#00b4d8", "#48cae4", "#90e0ef", "#ade8f4", "#ade8f4", "#ade8f4"];
const NIGHT_PALETTE = ["#10002b", "#240046", "#3c096c", "#5a189a", "#7b2cbf", "#9d4edd", "#c77dff", "#e0aaff", "#e0aaff", "#e0aaff"];
const TWILIGHT_PALETTE = ["#ae7981", "#543d4f", "#2d2c34", "#62354c", "#36222b", "#36222b", "#36222b", "#36222b", "#36222b", "#36222b"];
const DEEP_GREEN_PALETTE = ["#d8f3dc", "#b7e4c7", "#95d5b2", "#74c69d", "#52b788", "#40916c", "#2d6a4f", "#1b4332", "#081c15", "#081c15"];
const VIBRANT_GREEN_PALETTE = ["#007f5f", "#2b9348", "#55a630", "#80b918", "#aacc00", "#bfd200", "#d4d700", "#dddf00", "#eeef20", "#ffff3f"];
const PASTEL_PALETTE = ["#ffc1cf", "#e8ffb7", "#e2a0ff", "#c4f5fc", "#b7ffd8", "#ffc1cf", "#e8ffb7", "#e2a0ff", "#c4f5fc", "#b7ffd8"];
const METALLIC_GOLD_PALETTE = ["#FFD700", "#FDB931", "#E5B80B", "#8C6931", "#D4AF37", "#B8860B", "#FFDF00", "#FFD700", "#FFFFFF", "#C5B358"];

let lastPaletteType = "";

function preload() {
  imgAbstractiaControlPanel = loadImage("https://dae.transientusercontent.xyz/uploads/77457fdf-7af6-48e2-a543-021968683b78"); 
  imgWifPatronsAbstractia = loadImage("https://dae.transientusercontent.xyz/uploads/01e851eb-76aa-472b-b3ae-3803d37e82dc");
  fontRock3D = loadFont("https://dae.transientusercontent.xyz/uploads/fa827533-05e2-4540-b01f-5b7c3bcdeed4");
  fontAsimovian = loadFont("https://dae.transientusercontent.xyz/uploads/f88a5963-0f50-4500-a237-ad63ec609410");
  audioOpeningIIAbstractia = loadSound("https://dae.transientusercontent.xyz/uploads/bb00503d-13ad-4177-a995-d6d2c6b13b2c"); 
  audioRelaxingLoop = loadSound("https://dae.transientusercontent.xyz/uploads/39bfff89-214e-4794-b096-c56949ec8967"); 
}

function getPaletteByTime() {
  let h = hour();
  let m = minute();
  let totalMins = h * 60 + m;

  // 1:00 PM (780) to 4:39 PM (999)
  if (totalMins >= 780 && totalMins <= 999) return { bg: METALLIC_GOLD_PALETTE, lines: METALLIC_GOLD_PALETTE, type: "METALLIC_GOLD" };
  if (totalMins > 999 && totalMins <= 1075) return { bg: DEEP_GREEN_PALETTE, lines: VIBRANT_GREEN_PALETTE, type: "PM_GREEN" };
  if (totalMins >= 260 && totalMins <= 487) return { bg: VIBRANT_GREEN_PALETTE, lines: VIBRANT_GREEN_PALETTE, type: "AM_GREEN" };
  if (totalMins >= 488 && totalMins <= 731) return { bg: PASTEL_PALETTE, lines: PASTEL_PALETTE, type: "MORNING_PASTEL" };
  if (h >= 18 && h < 21) return { bg: TWILIGHT_PALETTE, lines: TWILIGHT_PALETTE, type: "TWILIGHT" };
  if (h >= 21 || h < 4) return { bg: NIGHT_PALETTE, lines: NIGHT_PALETTE, type: "NIGHT" };
  return { bg: DAY_PALETTE, lines: DAY_PALETTE, type: "DAY" };
}

function setup() {
  cnv = createCanvas(windowWidth, windowHeight);
  imageMode(CENTER);
  isMobile = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && width < 767;
  cnv.elt.style.touchAction = 'none';

  let fontStyle = document.createElement('style');
  fontStyle.innerHTML = `@font-face { font-family: 'AsimovianCustom'; src: url('https://dae.transientusercontent.xyz/uploads/f88a5963-0f50-4500-a237-ad63ec609410'); }`;
  document.head.appendChild(fontStyle);

  imgIsleChillGif = createVideo('https://dae.transientusercontent.xyz/uploads/ca95d956-ec63-44e1-8d40-e4aedcda7ced');
  imgIsleChillGif.elt.muted = true;
  imgIsleChillGif.elt.setAttribute('playsinline', '');
  imgIsleChillGif.loop();
  imgIsleChillGif.hide();

  button = createButton('Get Abstract');
  button.mousePressed(handleDiveIn);
  button.mouseOver(() => { isHovering = true; });
  button.mouseOut(() => { isHovering = false; });
  
  button.style('font-family', 'AsimovianCustom, sans-serif');
  button.style('font-size', '42px');
  button.style('padding', '20px 40px');
  button.style('border', 'none');
  button.style('cursor', 'pointer');
  button.style('color', 'white'); 
  button.style('background-color', 'transparent');
  button.style('position', 'absolute');
  button.position(width * 0.5, height * 0.85);
  
  let initial = getPaletteByTime(); 
  for (let i = 0; i < 10; i++) {
    currentPalette[i] = color(initial.bg[i]);
    targetPalette[i] = color(initial.bg[i]);
    currentLinePalette[i] = color(initial.lines[i]);
    lineTargetPalette[i] = color(initial.lines[i]);
  }
  lastPaletteType = initial.type;

  for(let i=0; i<60; i++) {
    sauceParticles.push(new SauceParticle());
  }
}

function updatePalette() {
  let result = getPaletteByTime();
  if (result.type !== lastPaletteType) {
    for (let i = 0; i < 10; i++) {
      targetPalette[i] = color(result.bg[i]);
      lineTargetPalette[i] = color(result.lines[i]);
    }
    lastPaletteType = result.type;
  }
}

function lerpPalettes() {
  for (let i = 0; i < 10; i++) {
    currentPalette[i] = lerpColor(currentPalette[i], targetPalette[i], paletteLerpRate);
    currentLinePalette[i] = lerpColor(currentLinePalette[i], lineTargetPalette[i], paletteLerpRate);
  }
}

function updateButtonShadow() {
  let col = currentLinePalette[0];
  let r = red(col), g = green(col), b = blue(col);
  button.style('text-shadow', `2px 2px 4px rgba(0,0,0,0.8), 0px 0px 20px rgba(${r},${g},${b},0.6)`);
  button.style('-webkit-text-stroke', '0.3px rgba(255,255,255,0.4)');
}

function draw() {
  updatePalette();
  lerpPalettes();
  background(0);

  if (scene === 0 || scene === 1) {
    drawOmbreBackground();
    drawUndulatingWavePattern();
    drawMetallicTitle();
    handleHoverEffects();
    animateButton();
    updateButtonShadow();
    if (scene === 1) handleFadeOut();
  }
  
  if (scene === 2) {
    drawVideoScreen(); 
    handleAudioVolume();
    handleFadeIn();
  }
}

function drawMetallicTitle() {
  push();
  textAlign(CENTER, CENTER);
  textFont(fontAsimovian);
  textSize(width * 0.1);
  let txt = "ABSTRACTIA";
  let x = width / 2, y = height * 0.45;
  let gradient = drawingContext.createLinearGradient(x - width*0.2, y - 50, x + width*0.2, y + 50);
  let shift = (frameCount * 0.00005) % 1; 
  gradient.addColorStop(0, '#444444');
  gradient.addColorStop((0.2 + shift) % 1, '#ffffff');
  gradient.addColorStop((0.4 + shift) % 1, '#aaaaaa');
  gradient.addColorStop((0.6 + shift) % 1, '#ffffff');
  gradient.addColorStop(1, '#444444');
  drawingContext.fillStyle = gradient;
  noStroke();
  text(txt, x, y);
  pop();
}

function drawOmbreBackground() {
  let step = 2; // Finer for softer gradients
  let scrollSpeed = frameCount * 0.00008; // Ultra slow
  for (let y = 0; y < height; y += step) {
    let rollingWave = sin(y * 0.001 + frameCount * 0.002) * 0.3 + cos(y * 0.002 - frameCount * 0.001) * 0.15;
    let noiseVal = noise(y * 0.0005 - scrollSpeed + rollingWave);
    let palettePos = noiseVal * 9;
    let idx = (floor(palettePos) + paletteOffset) % 10;
    let f = palettePos - floor(palettePos);
    let col = lerpColor(currentPalette[idx], currentPalette[(idx + 1) % 10], f);
    
    // Metallic roll shine
    let glint = sin(y * 0.004 + frameCount * 0.006) * 15;
    let r = constrain(red(col) + glint, 0, 255);
    let g = constrain(green(col) + glint, 0, 255);
    let b = constrain(blue(col) + glint, 0, 255);
    
    noStroke();
    fill(r, g, b);
    rect(0, y, width, step);
  }
}

function drawVideoScreen() {
  drawOmbreBackground(); 
  if (showSauceMode) drawSauceMode(); 
  if (showLinesMode) drawStraightLinePattern();
  if (showWavesMode) drawUndulatingWavePattern();

  if (showControlsMenu) {
    push();
    tint(255, 217); 
    let r = max(width / imgAbstractiaControlPanel.width, height / imgAbstractiaControlPanel.height);
    image(imgAbstractiaControlPanel, width / 2, height / 2, imgAbstractiaControlPanel.width * r, imgAbstractiaControlPanel.height * r);
    pop();
  }
  
  if (isEtherealMode) drawEtherealLinks();

  if (showAlternateView) {
    push();
    blendMode(SCREEN); 
    tint(255, 217); 
    let r = max(width / imgWifPatronsAbstractia.width, height / imgWifPatronsAbstractia.height);
    image(imgWifPatronsAbstractia, width / 2, height / 2, imgWifPatronsAbstractia.width * r, imgWifPatronsAbstractia.height * r);
    pop();
  }
}

function drawSauceMode() {
  for(let p of sauceParticles) {
    p.update();
    p.display();
  }
}

function drawEtherealLinks() {
  push();
  textAlign(CENTER, CENTER);
  textFont(fontAsimovian);
  blendMode(ADD);
  let time = frameCount * 0.0008;
  for(let i=0; i<42; i++){
    let ang = time + i * (TWO_PI/42);
    let rad = 280 + sin(time * 0.5 + i) * 120;
    let x = width/2 + cos(ang) * rad;
    let y = height/2 + sin(ang) * rad;
    let col = currentLinePalette[i % 10];
    stroke(red(col), green(col), blue(col), 60);
    strokeWeight(0.4);
    line(width/2, height/2, x, y);
    noStroke();
    fill(red(col), green(col), blue(col), 20);
    ellipse(x, y, 10, 10);
  }
  drawingContext.shadowBlur = 40;
  drawingContext.shadowColor = 'rgba(255, 255, 255, 0.5)';
  fill(255);
  textSize(width * 0.04);
  text("abstractia.today", width / 2, height * 0.45);
  textSize(width * 0.015);
  fill(200, 220, 255, 180);
  text("JOIN THE COLLECTIVE", width / 2, height * 0.52);
  textSize(width * 0.03);
  fill(255);
  text("t.me/abstractians", width / 2, height * 0.60);
  pop();
}

function drawUndulatingWavePattern() {
  push();
  blendMode(SCREEN); 
  strokeWeight(2.5);
  noFill();
  let numLines = 30; 
  for (let i = 0; i < numLines; i++) {
    let yBase = map(i, 0, numLines, height * 0.1, height * 0.9);
    let distMouse = dist(mouseX, mouseY, width/2, yBase);
    let colorIdx = (i + paletteOffset + floor(distMouse * 0.01)) % 10;
    stroke(currentLinePalette[colorIdx]);
    beginShape();
    for (let x = -60; x <= width + 60; x += 50) {
      let d = dist(x, yBase, mouseX, mouseY);
      let mouseInfluence = map(d, 0, 400, 100, 0, true);
      let drift = sin(frameCount * 0.0008 + yBase * 0.003 + x * 0.001) * 60; 
      let waveY = yBase + drift - mouseInfluence * sin(frameCount * 0.002 + d * 0.004);
      vertex(x, waveY);
    }
    endShape();
  }
  pop();
}

function drawStraightLinePattern() {
  push();
  blendMode(ADD);
  strokeWeight(0.1); // Fine/hair-thin
  let numLines = 200; 
  for (let i = 0; i < numLines; i++) {
    let y = i * (height / numLines);
    let colorIdx = (i + paletteOffset) % 10;
    let col = currentLinePalette[colorIdx];
    let shimmer = 30 + noise(frameCount * 0.015, i) * 180;
    stroke(red(col), green(col), blue(col), shimmer);
    let offset = (noise(frameCount * 0.0003, i * 0.15) - 0.5) * 150; 
    line(0, y + offset, width, y + offset);
  }
  pop();
}

function keyPressed() {
  let k = key.toLowerCase();
  if (k === 'b') {
    scene = 0; fadeAlpha = 0;
    showAlternateView = showLinesMode = showSauceMode = isQuietMode = showControlsMenu = isEtherealMode = false;
    showWavesMode = true; 
    if (audioRelaxingLoop) audioRelaxingLoop.stop();
    button.show();
  } else if (scene === 2) {
    if (k === 'a') { showAlternateView = !showAlternateView; if(showAlternateView) { showControlsMenu = false; isEtherealMode = false; } }
    if (k === 'c') { paletteOffset = (paletteOffset + 1) % 10; } 
    if (k === 'l') showLinesMode = !showLinesMode;
    if (k === 'w') showWavesMode = !showWavesMode;
    if (k === 's') showSauceMode = !showSauceMode;
    if (k === 'q') isQuietMode = !isQuietMode;
    if (k === 'i') { showControlsMenu = !showControlsMenu; if(showControlsMenu) { isEtherealMode = false; showAlternateView = false; } }
    if (k === 'd') { isEtherealMode = !isEtherealMode; if(isEtherealMode) { showControlsMenu = false; showAlternateView = false; } }
  }
}

function handleHoverEffects() {
  if (isHovering) {
    let centerX = width * 0.5, centerY = height * 0.85;
    bubbles.push(new Bubble(centerX + random(-70, 70), centerY + random(-30, 30)));
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    bubbles[i].update();
    bubbles[i].display();
    if (bubbles[i].isDead()) bubbles.splice(i, 1);
  }
}

function handleAudioVolume() {
  if (audioRelaxingLoop && audioRelaxingLoop.isPlaying()) {
    let targetVol = isQuietMode ? 0.0 : 0.4; 
    audioRelaxingLoop.setVolume(lerp(audioRelaxingLoop.getVolume(), targetVol, 0.03));
  }
}

function animateButton() {
  let scaleFactor = 1 + sin(frameCount * 0.008) * 0.02; 
  button.style('transform', `translate(-50%, -50%) scale(${scaleFactor})`);
}

function handleDiveIn() {
  if (getAudioContext().state !== 'running') getAudioContext().resume();
  if (audioOpeningIIAbstractia && audioOpeningIIAbstractia.isLoaded()) audioOpeningIIAbstractia.play();
  if (imgIsleChillGif) imgIsleChillGif.loop();
  scene = 1;
  button.hide();
}

function handleFadeOut() {
  fadeAlpha += fadeRate;
  fill(0, fadeAlpha);
  rect(0, 0, width, height);
  if (fadeAlpha >= 255) {
    scene = 2;
    if (audioRelaxingLoop && !audioRelaxingLoop.isPlaying()) {
      audioRelaxingLoop.loop();
      audioRelaxingLoop.play();
    }
  }
}

function handleFadeIn() {
  fadeAlpha -= fadeRate;
  if (fadeAlpha > 0) {
    fill(0, fadeAlpha);
    rect(0, 0, width, height);
  } else {
    fadeAlpha = 0;
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  button.position(width * 0.5, height * 0.85);
}

class Bubble {
  constructor(x, y) {
    this.pos = createVector(x, y);
    this.vel = p5.Vector.fromAngle(random(-PI, 0), random(1, 2));
    this.lifespan = 255;
    this.size = random(20, 45);
  }
  update() { this.pos.add(this.vel); this.lifespan -= 3; }
  display() {
    push();
    textSize(this.size);
    textAlign(CENTER, CENTER);
    fill(255, this.lifespan); 
    text("🫧", this.pos.x, this.pos.y);
    pop();
  }
  isDead() { return this.lifespan < 0; }
}

class SauceParticle {
  constructor() {
    this.reset();
  }
  reset() {
    this.pos = createVector(random(width), random(height));
    this.vel = createVector(random(-0.5, 0.5), random(-0.5, 0.5));
    this.size = random(40, 120);
    this.colorIdx = floor(random(10));
    this.offset = random(TWO_PI);
  }
  update() {
    let n = noise(this.pos.x * 0.001, this.pos.y * 0.001, frameCount * 0.001);
    let angle = n * TWO_PI * 1.5;
    this.vel.add(p5.Vector.fromAngle(angle, 0.015));
    this.vel.limit(0.8);
    this.pos.add(this.vel);
    
    if(this.pos.x < -200) this.pos.x = width + 200;
    if(this.pos.x > width + 200) this.pos.x = -200;
    if(this.pos.y < -200) this.pos.y = height + 200;
    if(this.pos.y > height + 200) this.pos.y = -200;
  }
  display() {
    let col = currentLinePalette[this.colorIdx];
    let breathe = sin(frameCount * 0.004 + this.offset) * (this.size * 0.3);
    let r = (this.size + breathe) / 2;
    
    push();
    translate(this.pos.x, this.pos.y);
    noFill();
    
    let stripeWeight = map(this.size, 40, 120, 1, 3);
    strokeWeight(stripeWeight);
    
    let stripeSpacing = 6;
    for (let i = -r; i < r; i += stripeSpacing) {
      let chordWidth = sqrt(r * r - i * i) * 2;
      let shimmer = map(sin(i * 0.05 + frameCount * 0.02 + this.offset), -1, 1, 50, 255);
      stroke(red(col), green(col), blue(col), shimmer * 0.4);
      line(-chordWidth / 2, i, chordWidth / 2, i);
    }
    pop();
  }
}
  </script>


</body></html>
