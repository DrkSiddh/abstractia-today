<canvas id="art"></canvas>

<script>
"use strict";
/* ============================================================
   ABSTRACTIA — LITE ENGINE
   Zero external graphics. Pure code, pure typography, pure
   gradient. The ultra-lightweight member of the family.
   ============================================================ */

const WORK = {
  number: 265,
  numeral: "CCLXV",
  title: "AWAKE",
  credit1: "INTERACTIVE FINE ART",
  credit2: "by Maxximillian",
  telegram: "t.me/abstractians",

  titleFont: "ZY Twinkle",

  sounds: { base: "library/sounds/", oneness: "", waves: "", lines: "" },

  tuning: { breath: 8, density: 1, drift: 1 },
  liveTime: false,
  colorLock: "DAY",
  btc: true,

  layers: [],

  palettes: {
    MORNING: ["ae8d9e","b997a5","c5a1a4","c2afb5","dfc7c7","d2c3c5","e6d9da","ede5e6"],
    DAY:     ["0d070a","2c151f","532125","563540","bf4344","89525b","c2777f","ca98a1"],
    SUNSET:  ["202a46","1d2749","1a194f","2b3152","3831b8","434682","5859c1","797dc5"],
    NIGHT:   ["1e0b1a","1f0a1a","2f0b1d","301527","6d143b","4d2039","7a234f","842d5e"],
    GRASS:   ["004b23","006400","007200","008000","38b000","70e000","9ef01a","ccff33"]
  },
  schedule: [
    { from:"05:00", to:"10:59", palette:"MORNING" },
    { from:"11:00", to:"17:59", palette:"DAY"     },
    { from:"18:00", to:"20:59", palette:"SUNSET"  },
    { from:"21:00", to:"04:59", palette:"NIGHT"   }
  ],
  grassWindow: { from:"16:20", to:"16:43" },

  clockOverride: null,

  lagniappe: {}
};

/* ============================================================
   ENGINE
   ============================================================ */

const cv = document.getElementById("art");
const ctx = cv.getContext("2d");
const beginBtn = document.getElementById("beginBtn");
const hintEl = document.getElementById("hint");

const UI_FONT = "Futura Light";
const CTA_FONT = "Rock3D";

let W = 0, H = 0, frame = 0;
let scene = 0;
let fadeAlpha = 0;
const FADE_RATE = 6;

let modeLines = false;       // L
let modeWaves = false;       // W
let modeOne   = false;       // O
let modeQuiet = false;       // Q
let modeMenu  = false;       // I
let modeDev   = false;       // D
let activeLagniappe = null;
const layerOn = {};          // artist glyph layers, by key

// C — Color shift: the collector holds the remote.
// -1 = live time. Otherwise locked to a palette of their choosing.
let colorShiftIdx = -1;
const SHIFT_ORDER = ["MORNING","DAY","SUNSET","NIGHT","GRASS"];

let currentPalette = [];
let targetKey = "";
const LERP_RATE = 0.015;

let menuHits = [];
let devHits = [];

/* the one global breath oscillator — every breathing layer reads it */
let breathPhase = 0;
let lastTs = 0;

/* ---------- helpers ---------- */
function hexToRgb(h){
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function minutesOf(str){
  const p = str.split(":");
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}
function nowMinutes(){
  if(WORK.clockOverride) return minutesOf(WORK.clockOverride);
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}
function inWindow(now, from, to){
  const f = minutesOf(from), t = minutesOf(to);
  return f <= t ? (now >= f && now <= t) : (now >= f || now <= t);
}
function grassOpen(){
  return inWindow(nowMinutes(), WORK.grassWindow.from, WORK.grassWindow.to);
}
function paletteKeyForNow(){
  const now = nowMinutes();
  if(grassOpen()) return "GRASS";           // Touching Grass overrides everything
  for(const s of WORK.schedule){
    if(inWindow(now, s.from, s.to)) return s.palette;
  }
  return "DAY";
}
function activePaletteKey(){
  if(grassOpen()) return "GRASS";           // arrives, nobody presses it
  return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : paletteKeyForNow();
}
function lerp(a,b,t){ return a + (b-a)*t; }
function rgba(c, a){ return "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")"; }
function lerpRgb(c1, c2, t){
  return [lerp(c1[0],c2[0],t), lerp(c1[1],c2[1],t), lerp(c1[2],c2[2],t)];
}
function tune(k, dflt){
  const v = WORK.tuning ? +WORK.tuning[k] : NaN;
  return isFinite(v) ? v : dflt;
}
function breath01(){ return (Math.sin(breathPhase) + 1) / 2; }

/* deterministic scatter for glyph layers — same work, same sky */
function keySeed(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function seedRand(seed){
  let s = seed >>> 0 || 1;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

/* ---------- palette lifecycle ---------- */
function snapPalette(key){
  targetKey = key;
  currentPalette = WORK.palettes[key].map(hexToRgb);
}
function updatePalette(){
  const key = activePaletteKey();
  if(key !== targetKey) targetKey = key;
  const target = WORK.palettes[targetKey].map(hexToRgb);
  for(let i=0;i<8;i++){
    currentPalette[i] = lerpRgb(currentPalette[i], target[i], LERP_RATE);
  }
}

/* ---------- SOUND STEMS — the mix IS the state ---------- */
const stems = { oneness:null, waves:null, lines:null };
const stemVol = { oneness:0, waves:0, lines:0 };
function loadStems(){
  for(const name of ["oneness","waves","lines"]){
    const file = WORK.sounds[name];
    if(!file) continue;
    const a = new Audio(WORK.sounds.base + file);
    a.loop = true; a.volume = 0;
    stems[name] = a;
  }
}
function startStems(){
  for(const k in stems){ if(stems[k]) stems[k].play().catch(function(){}); }
}
function stopStems(){
  for(const k in stems){
    if(stems[k]){ stems[k].pause(); stems[k].currentTime = 0; stemVol[k] = 0; }
  }
}
function mixStems(){
  const layers = (modeWaves?1:0) + (modeLines?1:0);
  const t = {
    oneness: modeQuiet ? 0 : (modeOne ? 0.5 : Math.max(0.22, 0.5 - 0.12*layers)),
    waves:   (modeQuiet || !modeWaves) ? 0 : 0.45,
    lines:   (modeQuiet || !modeLines) ? 0 : 0.45
  };
  for(const k in stems){
    if(!stems[k]) continue;
    stemVol[k] = lerp(stemVol[k], t[k], 0.05);
    stems[k].volume = Math.max(0, Math.min(1, stemVol[k]));
  }
}

/* ---------- THE OMBRE — smooth mode, the serene default ------ */
const strip = document.createElement("canvas");
const stripCtx = strip.getContext("2d");
function drawOmbre(targetCtx, w, h){
  strip.width = 1;
  strip.height = h;
  const id = stripCtx.createImageData(1, h);
  const d = id.data;
  const n = 8;
  const dNow = new Date();
  const timeFactor = (dNow.getHours() + dNow.getMinutes()/60) * 0.1;
  const scroll = -frame * 0.01 * tune("drift", 1);   // Drift — ombre scroll rate
  for(let y=0; y<h; y++){
    let pos = (y/h) * (n - 1.001) + scroll + timeFactor * 0.5;
    pos = pos % n; if(pos < 0) pos += n;
    const i1 = Math.floor(pos), i2 = (i1+1) % n, t = pos % 1;
    const c = lerpRgb(currentPalette[i1], currentPalette[i2], t);
    const k = y*4;
    d[k]=c[0]; d[k+1]=c[1]; d[k+2]=c[2]; d[k+3]=255;
  }
  stripCtx.putImageData(id, 0, 0);
  targetCtx.imageSmoothingEnabled = false;
  targetCtx.drawImage(strip, 0, 0, w, h);
  targetCtx.imageSmoothingEnabled = true;
}

/* ---------- WAVES — the exact original motion ---------- */
function drawWaves(){
  const dens = tune("density", 1);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 2;
  const numLines = Math.max(8, Math.round(50 * dens));
  const alpha = Math.max(0.12, Math.min(1, 0.7 * dens));
  for(let i=0; i<numLines; i++){
    const y = (i/numLines) * H;
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    for(let x=0; x<W; x+=10){
      const t = x / W;
      const c = lerpRgb(c1, c2, t);
      const y1 = y + Math.sin(frame*0.025 + y*0.01)*50 + Math.sin(frame*0.015 + x*0.02)*20;
      const y2 = y + Math.sin(frame*0.025 + y*0.01)*50 + Math.sin(frame*0.015 + (x+10)*0.02)*20;
      ctx.strokeStyle = rgba(c, alpha);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+10, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- LINES — the exact original shimmer ---------- */
function drawLines(){
  const dens = tune("density", 1);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 1.5;
  const numLines = Math.max(20, Math.round(150 * dens));
  const alpha = Math.max(0.12, Math.min(1, 0.7 * dens));
  for(let i=0; i<numLines; i++){
    const y = i * (H/numLines);
    const ci = Math.floor((i/numLines)*8) % 8;
    const c1 = currentPalette[ci], c2 = currentPalette[(ci+2)%8];
    for(let x=0; x<W; x+=20){
      const t = x / W;
      const c = lerpRgb(c1, c2, t);
      const y1 = y + Math.sin(frame*0.03 + y*0.01)*10 + Math.sin(frame*0.01 + x*0.02)*5;
      const y2 = y + Math.sin(frame*0.03 + y*0.01)*10 + Math.sin(frame*0.01 + (x+20)*0.02)*5;
      ctx.strokeStyle = rgba(c, alpha);
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x+20, y2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ---------- ONENESS — the breathing ring, one clock ---------- */
function drawOneness(){
  const dens = tune("density", 1);
  const b = breath01();
  const rings = Math.max(3, Math.round(9 * dens));
  const cx = W/2, cy = H/2;
  const maxR = Math.sqrt(W*W + H*H) * 0.55;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for(let i=0;i<rings;i++){
    const t = ((i/rings) + b) % 1;
    const r = maxR * t;
    const c = currentPalette[(i*2) % 8];
    const fade = Math.sin(Math.PI * t);
    ctx.strokeStyle = rgba(c, 0.30 * fade * Math.min(1, dens));
    ctx.lineWidth = Math.max(1, (Math.min(W,H) * 0.012) * (1 - t*0.6));
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  }
  const cc = currentPalette[5];
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * (0.18 + 0.10*b));
  g.addColorStop(0, rgba(cc, 0.22 * (0.4 + 0.6*b) * Math.min(1, dens)));
  g.addColorStop(1, rgba(cc, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* ---------- ARTIST GLYPH LAYERS — typographic, from the config */
function drawGlyphLayer(l){
  const dens = tune("density", 1);
  const dr = tune("drift", 1);
  const b = breath01();
  const n = Math.max(6, Math.round((l.count || 40) * dens));
  const rnd = seedRand(keySeed(l.key + "|" + l.name));
  const span = H + 120;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for(let i=0;i<n;i++){
    const bx = rnd() * W;
    const by = rnd() * span;
    const sz = (0.018 + rnd()*0.045) * Math.min(W,H);
    const sp = 0.15 + rnd()*0.5;
    const ci = Math.floor(rnd()*8) % 8;
    let y = by - frame * sp * dr * 0.6;
    y = ((y % span) + span) % span - 60;
    const c = currentPalette[ci];
    ctx.font = (sz * (0.9 + 0.2*b)) + "px '" + WORK.titleFont + "',Georgia,serif";
    ctx.fillStyle = rgba(c, 0.35 + 0.4*b);
    ctx.shadowColor = rgba(c, 0.85);
    ctx.shadowBlur = sz * 0.5;
    ctx.fillText(l.glyph, bx, y);
  }
  ctx.restore();
}

/* ---------- OPENING — the title IS the opening movie --------- */
function drawOpening(){
  drawOmbre(ctx, W, H);
  const title = WORK.title;
  const size = Math.min(W * 0.115, H * 0.2, 160);

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.font = size + "px '" + WORK.titleFont + "',Georgia,serif";
  const letters = title.split("");
  const widths = letters.map(function(ch){ return ctx.measureText(ch).width; });
  const spacing = size * 0.05;
  const total = widths.reduce(function(a,b){return a+b;},0) + spacing*(letters.length-1);
  let x = W/2 - total/2;
  const baseY = H * 0.38;

  for(let i=0;i<letters.length;i++){
    const c = currentPalette[(i + Math.floor(frame*0.02)) % 8];
    const yOff = Math.sin(frame*0.03 + i*0.7) * size*0.06;
    ctx.shadowColor = rgba(c, 0.9);
    ctx.shadowBlur = 28 + Math.sin(frame*0.05 + i)*10;
    ctx.fillStyle = "rgba(255,255,255,0.96)";
    ctx.fillText(letters[i], x + widths[i]/2, baseY + yOff);
    x += widths[i] + spacing;
  }

  // the credit — Interactive Fine Art by Maxximillian
  ctx.shadowBlur = 0;
  const credSize = Math.max(24, size * 0.2);
  ctx.font = credSize + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawTracked(WORK.credit1, W/2, baseY + size*0.72, credSize*0.35);
  const c2 = currentPalette[6];
  ctx.fillStyle = rgba(c2, 0.95);
  drawTracked(WORK.credit2, W/2, baseY + size*0.72 + credSize*1.7, credSize*0.18);

  if(WORK.numeral){
    ctx.font = (size*0.34) + "px '" + UI_FONT + "',Georgia,serif";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    drawTracked(WORK.numeral, W/2, baseY + size*0.72 + credSize*3.6, credSize*0.3);
  }
  ctx.restore();

  const s = 1 + Math.sin(frame*0.05)*0.025;
  beginBtn.style.transform = "translateX(-50%) scale(" + s + ")";
}
// letterspaced centered text — canvas has no letter-spacing of its own
function drawTracked(text, cx, y, track){
  const chars = text.split("");
  const widths = chars.map(function(ch){ return ctx.measureText(ch).width; });
  const total = widths.reduce(function(a,b){return a+b;},0) + track*(chars.length-1);
  let x = cx - total/2;
  for(let i=0;i<chars.length;i++){
    ctx.fillText(chars[i], x + widths[i]/2, y);
    x += widths[i] + track;
  }
}

/* ---------- COMMUNITY CARD (D) — typography only ------------- */
function drawCommunityCard(){
  devHits = [];
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.68)";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const big = Math.min(W*0.09, H*0.11, 96);
  ctx.font = big + "px '" + WORK.titleFont + "',Georgia,serif";
  const c = currentPalette[5];
  ctx.shadowColor = rgba(c, 0.9);
  ctx.shadowBlur = 30;
  ctx.fillStyle = "rgba(255,255,255,0.96)";
  ctx.fillText("ABSTRACTIANS", W/2, H*0.34);

  ctx.shadowBlur = 0;
  const sub = Math.max(25, big*0.32);
  ctx.font = sub + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawTracked("THE DAILY RITUAL, DELIVERED", W/2, H*0.34 + big*0.95, sub*0.25);

  const linkSize = Math.max(28, Math.min(W*0.05, 44));
  ctx.font = linkSize + "px '" + UI_FONT + "',Georgia,serif";
  const lw = ctx.measureText(WORK.telegram).width;
  const boxW = lw + linkSize*2.2, boxH = linkSize*2.4;
  const boxX = W/2 - boxW/2, boxY = H*0.56 - boxH/2;
  ctx.fillStyle = rgba(c, 0.18);
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = rgba(c, 0.95);
  ctx.lineWidth = 2;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = "rgba(255,255,255,0.98)";
  ctx.fillText(WORK.telegram, W/2, H*0.56);
  devHits.push({ x:boxX, y:boxY, w:boxW, h:boxH, act:"link" });

  ctx.font = "24px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("tap to join · tap anywhere else to return", W/2, H*0.56 + boxH);
  ctx.restore();
}

/* ---------- LAGNIAPPE — typographic, from the config ---------- */
function drawLagniappe(){
  const linesArr = WORK.lagniappe[activeLagniappe];
  if(!linesArr) return;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const size = Math.min(W*0.08, H*0.12, 90);
  ctx.font = size + "px '" + WORK.titleFont + "',Georgia,serif";
  const startY = H/2 - ((linesArr.length-1)*size*1.3)/2;
  for(let i=0;i<linesArr.length;i++){
    const c = currentPalette[(i*2+1) % 8];
    ctx.shadowColor = rgba(c, 0.95);
    ctx.shadowBlur = 34;
    ctx.fillStyle = "rgba(255,255,255,0.97)";
    ctx.fillText(linesArr[i], W/2, startY + i*size*1.3);
  }
  ctx.restore();
}

/* ---------- INTERACTIVE MENU ----------------------------------
   Built from the same layer registry the Forge panel renders
   from. One source of truth, two surfaces. Sauce and lagniappe
   never appear here. */
function menuRows(){
  const rows = [
    { k:"w", label:"Waves" },
    { k:"l", label:"Lines" },
    { k:"o", label:"Oneness" },
    { k:"c", label:"Color shift" },
    { k:"q", label:"All quiet" },
    { k:"d", label:"Community" }
  ];
  (WORK.layers || []).forEach(function(l){
    rows.push({ k:l.key, label:l.name, layer:true });
  });
  rows.push({ k:"b", label:"Begin again" });
  rows.push({ k:"x", label:"Close menu" });
  return rows;
}
function stateText(k){
  if(k==="w") return modeWaves ? "ON" : "OFF";
  if(k==="l") return modeLines ? "ON" : "OFF";
  if(k==="o") return modeOne ? "ON" : "OFF";
  if(k==="q") return modeQuiet ? "ON" : "OFF";
  if(k==="d") return modeDev ? "ON" : "OFF";
  if(k==="c") return colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : "LIVE";
  if(layerOn.hasOwnProperty(k)) return layerOn[k] ? "ON" : "OFF";
  return "";
}
function stateOn(k){
  if(k==="w") return modeWaves;
  if(k==="l") return modeLines;
  if(k==="o") return modeOne;
  if(k==="q") return modeQuiet;
  if(k==="d") return modeDev;
  if(k==="c") return colorShiftIdx >= 0;
  return !!layerOn[k];
}
function drawMenu(){
  menuHits = [];
  const ROWS = menuRows();
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.62)";
  ctx.fillRect(0,0,W,H);

  ctx.textBaseline = "middle";
  const fs = Math.max(20, Math.min(W,H)*0.04);
  const rowH = Math.min(Math.max(44, fs*2.1), (H*0.92)/ROWS.length);
  const startY = H/2 - (ROWS.length*rowH)/2;
  const rowW = Math.min(W*0.86, 560);
  const rowX = W/2 - rowW/2;

  for(let i=0;i<ROWS.length;i++){
    const r = ROWS[i];
    const y = startY + i*rowH;
    const on = stateOn(r.k);
    const c = currentPalette[i % 8];

    ctx.fillStyle = on ? rgba(c, 0.38) : "rgba(255,255,255,0.07)";
    ctx.fillRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    if(on){
      ctx.strokeStyle = rgba(c, 0.95);
      ctx.lineWidth = 2;
      ctx.strokeRect(rowX, y + rowH*0.08, rowW, rowH*0.84);
    }

    ctx.font = (rowH*0.42) + "px '" + UI_FONT + "',Georgia,serif";
    ctx.textAlign = "left";
    ctx.fillStyle = rgba(c, 1);
    ctx.fillText(r.k === "x" ? "✕" : r.k.toUpperCase(), rowX + rowW*0.06, y + rowH/2);

    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.fillText(r.label, rowX + rowW*0.17, y + rowH/2);

    const st = stateText(r.k);
    if(st){
      ctx.textAlign = "right";
      ctx.fillStyle = on ? rgba(c,1) : "rgba(255,255,255,0.3)";
      ctx.fillText(st, rowX + rowW*0.94, y + rowH/2);
    }

    menuHits.push({ x:rowX, y:y, w:rowW, h:rowH, k:r.k });
  }

  ctx.textAlign = "center";
  ctx.font = Math.max(18, rowH*0.34) + "px '" + UI_FONT + "',Georgia,serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  const tag = "ABSTRACTIA" + (WORK.numeral ? " " + WORK.numeral : "");
  ctx.fillText(tag, W/2, startY + ROWS.length*rowH + rowH*0.5);
  ctx.restore();
}

/* ---------- LIVE SCENE ---------- */
function drawLive(){
  drawOmbre(ctx, W, H);        // Smooth — the serene default
  if(modeOne) drawOneness();
  if(modeLines) drawLines();
  if(modeWaves) drawWaves();
  (WORK.layers || []).forEach(function(l){ if(layerOn[l.key]) drawGlyphLayer(l); });
  if(activeLagniappe) drawLagniappe();
  if(modeDev) drawCommunityCard();
  if(modeMenu) drawMenu();
}

/* ---------- main loop ---------- */
function loop(ts){
  frame++;
  const now = ts || 0;
  const dt = lastTs ? Math.min(0.1, (now - lastTs)/1000) : 0;
  lastTs = now;
  const period = Math.max(1, tune("breath", 8));
  breathPhase = (breathPhase + (Math.PI*2) * dt / period) % (Math.PI*2);

  updatePalette();
  ctx.clearRect(0,0,W,H);

  if(scene === 0){
    drawOpening();
  } else if(scene === 1){
    drawOpening();
    fadeAlpha += FADE_RATE;
    ctx.fillStyle = "rgba(0,0,0," + Math.min(1, fadeAlpha/255) + ")";
    ctx.fillRect(0,0,W,H);
    if(fadeAlpha >= 255){
      fadeAlpha = 255;
      scene = 2;
      beginBtn.style.display = "none";
      showHint();
      bridgeState();
    }
  } else {
    drawLive();
    mixStems();
    if(fadeAlpha > 0){
      fadeAlpha -= FADE_RATE;
      ctx.fillStyle = "rgba(0,0,0," + Math.max(0, fadeAlpha/255) + ")";
      ctx.fillRect(0,0,W,H);
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- hint: after Begin, gone in eight seconds ---------- */
let hintTimer = null;
function showHint(){
  hintEl.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ hintEl.classList.remove("on"); }, 8000);
}

/* ---------- one brain for keyboard AND touch ---------- */
function initialShift(){
  if(WORK.liveTime) return -1;
  const i = SHIFT_ORDER.indexOf(WORK.colorLock);
  return i >= 0 ? i : -1;
}
function resetToOpening(){
  scene = 0; fadeAlpha = 0;
  modeLines = modeWaves = modeOne = modeQuiet = modeMenu = modeDev = false;
  for(const k in layerOn) layerOn[k] = false;
  activeLagniappe = null;
  colorShiftIdx = initialShift();
  stopStems();
  beginBtn.style.display = "block";
  hintEl.classList.remove("on");
  snapPalette(activePaletteKey());
}
function isLayerKey(k){
  return (WORK.layers || []).some(function(l){ return l.key === k; });
}
function toggleMode(k){
  if(k === "s") return;                       // Sauce. Reserved. Waiting on a spell.
  if(k === "b"){ if(scene > 0) resetToOpening(); bridgeState(); return; }
  if(scene !== 2) return;
  if(k === "c"){
    colorShiftIdx++;
    if(colorShiftIdx >= SHIFT_ORDER.length) colorShiftIdx = -1;
  }
  else if(k === "l"){ modeLines = !modeLines; }
  else if(k === "w"){ modeWaves = !modeWaves; }
  else if(k === "o"){ modeOne   = !modeOne; }
  else if(k === "q"){ modeQuiet = !modeQuiet; }
  else if(k === "i"){ modeMenu = !modeMenu; if(modeMenu) modeDev = false; }
  else if(k === "d"){ modeDev = !modeDev; if(modeDev) modeMenu = false; }
  else if(k === "x"){ modeMenu = false; }
  else if(isLayerKey(k)){ layerOn[k] = !layerOn[k]; }
  else if(WORK.lagniappe[k]){
    activeLagniappe = (activeLagniappe === k) ? null : k;
  }
  bridgeState();
}

document.addEventListener("keydown", function(e){
  toggleMode(e.key.toLowerCase());
});

/* ---------- touch + mouse ---------- */
document.addEventListener("touchstart", function(e){
  if(scene === 2 && e.touches.length === 2 && !modeMenu && !modeDev){
    modeMenu = true;
    bridgeState();
  }
}, {passive:true});

cv.addEventListener("pointerdown", function(e){
  if(scene !== 2) return;
  const x = e.clientX, y = e.clientY;

  if(modeMenu){
    for(const h of menuHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h){
        toggleMode(h.k);
        return;
      }
    }
    modeMenu = false;      // tapped the art — let it breathe
    bridgeState();
    return;
  }

  if(modeDev){
    for(const h of devHits){
      if(x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h && h.act === "link"){
        window.open("https://" + WORK.telegram, "_blank", "noopener");
        return;
      }
    }
    modeDev = false;       // tapped outside the doorway — return to the work
    bridgeState();
  }
});

/* ---------- begin ---------- */
beginBtn.addEventListener("click", function(){
  if(scene === 0){
    startStems();          // inside the gesture — autoplay never blocks
    scene = 1;
  }
});

/* ============================================================
   FORGE BRIDGE — only alive inside the Cauldron's preview.
   A standalone work never speaks to anyone.
   ============================================================ */
const EMBEDDED = (function(){ try{ return window.parent && window.parent !== window; }catch(e){ return false; } })();

function bridgeState(){
  if(!EMBEDDED) return;
  const layers = {};
  (WORK.layers || []).forEach(function(l){ layers[l.key] = !!layerOn[l.key]; });
  window.parent.postMessage({
    source:"ABSTRACTIA_WORK", type:"state",
    state:{
      w:modeWaves, l:modeLines, o:modeOne, q:modeQuiet, i:modeMenu, d:modeDev,
      c: colorShiftIdx >= 0 ? SHIFT_ORDER[colorShiftIdx] : "LIVE",
      palette: activePaletteKey(),
      grass: grassOpen(),
      scene: scene,
      layers: layers
    }
  }, "*");
}

function forceLive(){
  if(scene === 2) return;
  scene = 2; fadeAlpha = 0;
  beginBtn.style.display = "none";
  hintEl.classList.remove("on");
}

function applyFace(family, dataUrl){
  if(!family || !dataUrl || !window.FontFace) return;
  try{
    const face = new FontFace(family, "url(" + dataUrl + ")");
    face.load().then(function(f){ document.fonts.add(f); }).catch(function(){});
  }catch(e){ /* a face that will not load is not worth a crash */ }
}

function applyPatch(p){
  if(!p) return;
  if(p.hasOwnProperty("title"))    WORK.title    = String(p.title);
  if(p.hasOwnProperty("credit1"))  WORK.credit1  = String(p.credit1);
  if(p.hasOwnProperty("credit2"))  WORK.credit2  = String(p.credit2);
  if(p.hasOwnProperty("numeral"))  WORK.numeral  = String(p.numeral);
  if(p.hasOwnProperty("number"))   WORK.number   = p.number;
  if(p.hasOwnProperty("telegram")) WORK.telegram = String(p.telegram);
  if(p.hasOwnProperty("btc"))      WORK.btc      = p.btc;
  if(p.face)      applyFace(p.face.family, p.face.dataUrl);
  if(p.titleFont) WORK.titleFont = String(p.titleFont);
  if(p.tuning){
    for(const k in p.tuning){ WORK.tuning[k] = +p.tuning[k]; }
  }
  if(p.palettes){
    for(const k in p.palettes){ WORK.palettes[k] = p.palettes[k].slice(); }
  }
  if(p.hasOwnProperty("clockOverride")) WORK.clockOverride = p.clockOverride || null;
  if(p.hasOwnProperty("liveTime")){
    WORK.liveTime = !!p.liveTime;
    if(!WORK.liveTime && colorShiftIdx < 0 && WORK.colorLock){
      colorShiftIdx = SHIFT_ORDER.indexOf(WORK.colorLock);
    }
  }
  if(p.hasOwnProperty("colorLock")) WORK.colorLock = p.colorLock || "";
  if(p.layers){
    WORK.layers = p.layers.slice();
    const live = {};
    WORK.layers.forEach(function(l){ live[l.key] = !!layerOn[l.key]; });
    for(const k in layerOn) delete layerOn[k];
    for(const k in live) layerOn[k] = live[k];
  }
  if(p.begin) forceLive();
  if(p.hasOwnProperty("colorIdx")){    // Color Shift tints the opening too
    colorShiftIdx = p.colorIdx;
  }
  if(p.layerToggle){                   // artist glyph layer, explicit on/off
    const lt = p.layerToggle;
    if(scene !== 2) forceLive();
    layerOn[lt.key] = !!lt.on;
  }
  if(p.key){                           // one vocabulary, two doors
    if(scene !== 2 && p.key !== "b") forceLive();
    toggleMode(p.key);
  }
  if(p.modes){
    // only leave the opening once a real mode is asked for
    const anyOn = Object.keys(p.modes).some(function(k){ return p.modes[k]; });
    if(anyOn && scene !== 2) forceLive();
    if(scene === 2){
      for(const k in p.modes){
        const want = !!p.modes[k];
        if(stateOn(k) !== want) toggleMode(k);
      }
    }
  }
}

if(EMBEDDED){
  window.addEventListener("message", function(e){
    const d = e.data;
    if(!d || d.source !== "ABSTRACTIA_FORGE") return;
    if(d.type === "patch"){
      applyPatch(d.patch);
      window.parent.postMessage({ source:"ABSTRACTIA_WORK", type:"ack", seq:d.seq }, "*");
      bridgeState();
    }
  });
  setInterval(bridgeState, 1000);   // the grass lamp stays truthful
}

/* ---------- resize: square, portrait, landscape — always right */
function fit(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W; cv.height = H;
}
window.addEventListener("resize", fit);

/* ---------- boot ---------- */
fit();
colorShiftIdx = initialShift();
snapPalette(activePaletteKey());
loadStems();
if(document.fonts && document.fonts.load){
  document.fonts.load("100px '" + WORK.titleFont + "'").catch(function(){});
  document.fonts.load("100px '" + UI_FONT + "'").catch(function(){});
  document.fonts.load("100px '" + CTA_FONT + "'").catch(function(){});
}
if(EMBEDDED){
  window.parent.postMessage({ source:"ABSTRACTIA_WORK", type:"ready" }, "*");
  bridgeState();
}
requestAnimationFrame(loop);
</script>
