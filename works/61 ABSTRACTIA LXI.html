<body>
  
    
  <script>
    let cnv;
let isMobile;
let videoIsleAbstractia; 
let imgAbstractiaWallSculptures;
let imgAbstractiaCommunityCard;
let imgAbstractiaControlPanelStationMap;
let imgPepavaggioSignature;
let imgPepavaggioArt;
let imgAbstractLindiaGif;
let audioOpeningIIAbstractia;
let audioAbstractiaIV;
let audioSandsUnderh20;
let audioHolidayInTheHood;
let button;

let scene = 0; 
let fadeAlpha = 0;
let fadeRate = 6;
let showAlternateView = false;
let showCompanionView = false; 
let showLinesMode = false; 
let showWavesMode = false;
let waveCount = 5;
let wavePressCount = 0;
let showMountainMode = false; 
const LERP_RATE = 0.05;
let isQuietMode = false;
let isDevMuted = false;
let devVolume = 1.0;
let showControlsMenu = false;
let isDeveloperMode = false;
let isHovering = false;
let isPepavaggio = false;
let isPepavaggioArt = false;
let isMusicMode = false;

let isSecretMode = false;
let secretKeyBuffer = "";
let secretTab = 0; 
let secretTabs = ["COLOR/TEXTURE", "AUDIO", "THAT PURPLE STUFF"];

let secretContent = [
  [
    { key: "[S]", title: "MORE SAUCE", desc: "Initiates aesthetic indulgence protocol.\nIncreases saturation, shimmer, gloss, and unapologetic excess.\nFor when minimalism feels like diet water and you prefer a full-bodied visual reduction." },
    { key: "[P]", title: "PEPAVAGGIO COLOR WAY", desc: "Overrides default palette with high-drama chromatic conviction.\nBaroque meets blockchain.\nThis is not subtle. This is curated audacity with excellent posture." },
    { key: "[A]", title: "MUSEUM REALITY OVERRIDE", desc: "Replaces physical walls with programmable existence.\nGallery optional. Universe preferred." },
    { key: "[C]", title: "COLOR CRESCENDO", desc: "Engages gradient acceleration.\nHue migrates with intention.\nFor moments requiring emotional voltage." },
    { key: "[L]", title: "STRUCTURAL DISCOMFORT", desc: "Introduces foreground interference patterns.\nVisual tension without apology.\nSafe for walls. Unsafe for expectations." },
    { key: "[W]", title: "OCEAN MEMORY PROTOCOL", desc: "Activates oscillation logic derived from tidal systems.\nEverything moves, even when it appears still." }
  ],
  [
    { key: "[Q]", title: "QUIET MODE", desc: "Reduces master output to ambient levels.\nIdeal for deep focus or late night exploration." },
    { key: "[M]", title: "TOGGLE MUTE", desc: "Kills all system audio output immediately." },
    { key: "[E]", title: "ENDODECA MUSIC", desc: "Engages Holiday in the Hood.\nFades ambient layers for sonic clarity." },
    { key: "[SPACE]", title: "PLAY/PAUSE", desc: "Manual override for active audio tracks." },
    { key: "[B]", title: "BEGIN AGAIN", desc: "Returns the system to origin state.\nNot because it failed.\nBecause evolution prefers cycles." }
  ],
  [
    { key: "143GG", title: "🌹 PEPAVAGGIO ART MODE", desc: "Activates romantic maximalism engine.\nColor becomes devotional. Contrast becomes theatrical.\nFor collectors who believe art should feel like it’s slightly in love with you." },
    { key: "[I]", title: "STATION MAP", desc: "Displays navigational coordinates for Abstractia IV." },
    { key: "[D]", title: "DEVELOPER CARD", desc: "Access the system architect's identification protocol." },
    { key: "SRR", title: "SUPREMERACKETRECORDS.TRADE", desc: "External connection to the official archival node." }
  ]
];

let bubbles = []; 
let backgroundBlobs = [];

let colorsPalette = []; 
let targetPaletteHex = [];
let paletteLerpRate = 0.02;
let paletteShift = 0;
let lastPaletteType = ""; 

const DAY_PALETTE = ["03045e", "023e8a", "0077b6", "0096c7", "00b4d8", "48cae4"];
const NIGHT_PALETTE = ["10002b", "240046", "3c096c", "5a189a", "7b2cbf", "9d4edd"];
const TWILIGHT_PALETTE = ["ae7981", "543d4f", "2d2c34", "62354c", "36222b", "8b5e83"];
const LIME_PALETTE = ["004b23", "006400", "007200", "008000", "38b000", "70e000"];
const DAWN_PALETTE_BASE = ["dfbbb1", "f56476", "e43f6f", "be3e82", "5e4352", "7a5c61"];
const BRIGHTS_PALETTE = ["35ff69", "42bfdd", "0a090c", "f5b700", "00a1e4", "e63462", "d138bf"];
const GOLDEN_HOUR_PALETTE = ["fbdc60", "edc531", "c9a227", "e8c773", "dea82b"];
const MORNING_PALETTE = ["fe6a86", "fd969a", "ffdce0", "fee255", "ffdd13"]; 
const PEPAVAGGIO_SCHEDULED = ["7d84b2", "8e9dcc", "d9dbf1", "dbf4a7"]; 
const PEPAVAGGIO_GRADIENT = ["7d84b2", "8e9dcc", "d9dbf1", "f9f9ed", "dbf4a7"]; 

function preload() {
  imgAbstractiaWallSculptures = loadImage("https://dae.transientusercontent.xyz/uploads/d5e653c2-de13-43e6-89ba-13ff94f22823");
  imgAbstractiaCommunityCard = loadImage("https://dae.transientusercontent.xyz/uploads/067b752f-b4bd-41f1-8ab5-3df1f95453b6");
  imgAbstractiaControlPanelStationMap = loadImage("https://dae.transientusercontent.xyz/uploads/77457fdf-7af6-48e2-a543-021968683b78"); 
  imgPepavaggioSignature = loadImage("https://dae.transientusercontent.xyz/uploads/568cef53-6c4e-4a83-b812-2949f912046f");
  imgPepavaggioArt = loadImage("https://dae.transientusercontent.xyz/uploads/e006ef6a-212a-47ed-a3af-f44071686aef");
  audioOpeningIIAbstractia = loadSound("https://dae.transientusercontent.xyz/uploads/bb00503d-13ad-4177-a995-d6d2c6b13b2c"); 
  audioAbstractiaIV = loadSound("https://dae.transientusercontent.xyz/uploads/b8517588-e48c-4409-8df2-d866f151a537"); 
  audioSandsUnderh20 = loadSound("https://dae.transientusercontent.xyz/uploads/e93ae68a-319b-4ec4-9507-6cfddee62a80");
  audioHolidayInTheHood = loadSound("https://dae.transientusercontent.xyz/uploads/b3a04de7-1faa-4d7d-b801-5cc7d1c984d2");
}

function getPaletteByTime() {
    let h = hour();
    let m = minute();
    let totalMins = h * 60 + m;
    let p;
    if (isPepavaggio) return { colors: PEPAVAGGIO_GRADIENT, type: "PEPAVAGGIO_MANUAL" };
    if (totalMins >= 488 && totalMins <= 670) p = { colors: MORNING_PALETTE, type: "MORNING" };
    else if (totalMins >= 980 && totalMins <= 1003) p = { colors: PEPAVAGGIO_SCHEDULED, type: "PEPAVAGGIO_SCHEDULED" };
    else if (totalMins >= 300 && totalMins < 488) p = { colors: GOLDEN_HOUR_PALETTE, type: "GOLDEN" };
    else if (totalMins >= 213 && totalMins < 300) p = { colors: DAWN_PALETTE_BASE, type: "DAWN" };
    else if (totalMins > 670 && totalMins < 980) p = { colors: BRIGHTS_PALETTE, type: "BRIGHTS" };
    else if (totalMins > 1003 && totalMins <= 1080) p = { colors: LIME_PALETTE, type: "LIME" };
    else if (h >= 18 && h < 21) p = { colors: TWILIGHT_PALETTE, type: "TWILIGHT" };
    else if (h >= 21 || h < 3) p = { colors: NIGHT_PALETTE, type: "NIGHT" };
    else p = { colors: DAY_PALETTE, type: "DAY" };
    return p;
}

function setup() {
  cnv = createCanvas(windowWidth, windowHeight);
  imageMode(CENTER);
  isMobile = (('ontouchstart' in window) || navigator.maxTouchPoints > 0) && width < 767;
  cnv.elt.style.touchAction = 'none';
  cnv.elt.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
  
  let style = document.createElement('style');
  style.innerHTML = `@font-face { font-family: 'Rock3D-Regular'; src: url('https://dae.transientusercontent.xyz/uploads/fa827533-05e2-4540-b01f-5b7c3bcdeed4') format('truetype'); }`;
  document.head.appendChild(style);

  imgAbstractiaWallSculptures.loadPixels();
  for (let i = 0; i < imgAbstractiaWallSculptures.pixels.length; i += 4) {
    let r = imgAbstractiaWallSculptures.pixels[i];
    let g = imgAbstractiaWallSculptures.pixels[i + 1];
    let b = imgAbstractiaWallSculptures.pixels[i + 2];
    if (g > 115 && g > r * 1.3 && g > b * 1.3) {
        imgAbstractiaWallSculptures.pixels[i+3] = 76;
    }
  }
  imgAbstractiaWallSculptures.updatePixels();

  videoIsleAbstractia = createVideo('https://dae.transientusercontent.xyz/uploads/47a1e069-77cf-4cb4-8d03-ccdec3aa5996');
  videoIsleAbstractia.elt.muted = true;
  videoIsleAbstractia.elt.setAttribute('playsinline', '');
  videoIsleAbstractia.elt.setAttribute('webkit-playsinline', '');
  videoIsleAbstractia.loop(); 
  videoIsleAbstractia.hide();

  imgAbstractLindiaGif = createVideo('https://dae.transientusercontent.xyz/uploads/ee55ee3a-c3c7-4095-b2dc-7baaef466749');
  imgAbstractLindiaGif.elt.muted = true;
  imgAbstractLindiaGif.elt.setAttribute('playsinline', '');
  imgAbstractLindiaGif.elt.setAttribute('webkit-playsinline', '');
  imgAbstractLindiaGif.loop();
  imgAbstractLindiaGif.hide();
  imgAbstractLindiaGif.pause();

  if (audioOpeningIIAbstractia) audioOpeningIIAbstractia.setVolume(0.8);
  if (audioAbstractiaIV) { audioAbstractiaIV.setLoop(true); audioAbstractiaIV.setVolume(0.5); }
  if (audioSandsUnderh20) { audioSandsUnderh20.setLoop(true); audioSandsUnderh20.setVolume(0); }

  button = createButton('Get Abstract');
  button.mousePressed(handleDiveIn);
  button.mouseOver(() => { isHovering = true; });
  button.mouseOut(() => { isHovering = false; });
  button.style('font-family', "Rock3D-Regular, sans-serif"); 
  button.style('letter-spacing', '2px');
  button.style('font-size', '36px');
  button.style('padding', '15px 30px');
  button.style('border', 'none');
  button.style('border-radius', '8px');
  button.style('cursor', 'pointer');
  button.style('color', 'white'); 
  button.style('background-color', 'transparent');
  button.style('position', 'absolute');
  button.style('white-space', 'nowrap');
  button.position(width * 0.9 - 160, height * 0.75 + 110);
  
  let initial = getPaletteByTime(); 
  targetPaletteHex = [...initial.colors];
  lastPaletteType = initial.type;
  for (let hex of targetPaletteHex) colorsPalette.push(color('#' + hex));

  for(let i=0; i<15; i++) {
    backgroundBlobs.push({
      x: random(width), y: random(height),
      size: random(width * 0.6, width * 1.5),
      vx: random(-0.5, 0.5), vy: random(-0.5, 0.5),
      angle: random(TWO_PI), colIndex: i % colorsPalette.length
    });
  }
}

function updatePalette() {
    let result = getPaletteByTime();
    if (result.type !== lastPaletteType) {
        targetPaletteHex = [...result.colors];
        lastPaletteType = result.type;
    }
}

function lerpPalettes() {
    for (let i = 0; i < targetPaletteHex.length; i++) {
        let targetColor = color('#' + targetPaletteHex[i]);
        if (colorsPalette[i]) colorsPalette[i] = lerpColor(colorsPalette[i], targetColor, paletteLerpRate);
        else colorsPalette[i] = targetColor;
    }
}

function resetModes() {
  showAlternateView = false; showCompanionView = false;
  showLinesMode = false; showWavesMode = false;
  showMountainMode = false; isDeveloperMode = false;
  isPepavaggio = false; isPepavaggioArt = false; isMusicMode = false;
  wavePressCount = 0;
  if (audioHolidayInTheHood) audioHolidayInTheHood.stop();
}

function keyPressed() {
  if (isSecretMode) {
    if (key === '1') secretTab = 0;
    else if (key === '2') secretTab = 1;
    else if (key === '3') secretTab = 2;
    else { isSecretMode = false; secretKeyBuffer = ""; }
    return;
  }
  if (isPepavaggioArt && keyCode !== 32 && key.toLowerCase() !== 'e') {
    isPepavaggioArt = false; secretKeyBuffer = ""; return;
  }
  secretKeyBuffer += key.toLowerCase();
  if (secretKeyBuffer.length > 5) secretKeyBuffer = secretKeyBuffer.substring(secretKeyBuffer.length - 5);
  if (secretKeyBuffer === "143xx") { isSecretMode = true; return; }
  if (secretKeyBuffer === "143gg") { isPepavaggioArt = true; return; }

  if (key === 'b' || key === 'B') {
    scene = 0; fadeAlpha = 0; resetModes();
    waveCount = 5; isQuietMode = false; showControlsMenu = false;
    videoIsleAbstractia.loop();
    if (audioAbstractiaIV && audioAbstractiaIV.isPlaying()) audioAbstractiaIV.stop();
    if (audioSandsUnderh20 && audioSandsUnderh20.isPlaying()) audioSandsUnderh20.stop();
    button.show(); button.removeAttribute('disabled');
  } else if (key === 'a' || key === 'A') {
    if (scene === 2) { showAlternateView = !showAlternateView; isDeveloperMode = false; }
  } else if (key === 'c' || key === 'C') {
    if (scene === 2) { paletteShift++; showCompanionView = !showCompanionView; if (showCompanionView) isDeveloperMode = false; }
  } else if (key === 'l' || key === 'L') {
    if (scene === 2) { showLinesMode = !showLinesMode; isDeveloperMode = false; }
  } else if (key === 'w' || key === 'W') {
    if (scene === 2) {
      isDeveloperMode = false;
      wavePressCount++;
      if (!showWavesMode) { showWavesMode = true; waveCount = 5; } 
      else { waveCount += 25; if (waveCount > 155) { showWavesMode = false; waveCount = 5; wavePressCount = 0; } }
    }
  } else if (key === 's' || key === 'S') {
    if (scene === 2) { showMountainMode = !showMountainMode; isDeveloperMode = false; }
  } else if (key === 'q' || key === 'Q') {
    if (scene === 2) isQuietMode = !isQuietMode;
  } else if (key === 'm' || key === 'M') {
    if (scene === 2) isDevMuted = !isDevMuted;
  } else if (key === 'e' || key === 'E') {
    if (scene === 2 || isPepavaggioArt) {
      isMusicMode = true;
      if (audioHolidayInTheHood) { audioHolidayInTheHood.stop(); audioHolidayInTheHood.play(); }
    }
  } else if (key === ' ') {
    if (isMusicMode && audioHolidayInTheHood) {
        if (audioHolidayInTheHood.isPlaying()) audioHolidayInTheHood.pause();
        else audioHolidayInTheHood.play();
    }
    return false; 
  } else if (key === 'i' || key === 'I') {
    if (scene === 2) { showControlsMenu = !showControlsMenu; if (showControlsMenu) { isDeveloperMode = false; showAlternateView = false; } }
  } else if (key === 'd' || key === 'D') { 
    if (scene === 2) { isDeveloperMode = !isDeveloperMode; if (isDeveloperMode) { showControlsMenu = false; showAlternateView = false; } }
  } else if (key === 'p' || key === 'P') {
    if (scene === 2) isPepavaggio = !isPepavaggio;
  }
}

function handleClick() {
    if (isSecretMode) {
      let boxW = min(1200, width * 0.9);
      let tabColW = isMobile ? 120 : 220;
      let startX = width/2 - boxW/2;
      let startY = height/2 - (height * 0.75)/2;
      for (let i = 0; i < secretTabs.length; i++) {
        let ty = startY + 100 + (i * 48);
        if (mouseX > startX && mouseX < startX + tabColW && mouseY > ty - 15 && mouseY < ty + 15) {
          secretTab = i; return;
        }
      }
    }
    if (isPepavaggioArt) {
        let sigScale = (isMobile ? 0.053 : 0.08) / 1.5;
        let sigW = imgPepavaggioSignature.width * sigScale;
        let sigH = imgPepavaggioSignature.height * sigScale;
        let sigX = 40; 
        let sigY = height - sigH - 34;
        if (mouseX > sigX && mouseX < sigX + sigW && mouseY > sigY && mouseY < sigY + sigH) {
            isMusicMode = true;
            if (audioHolidayInTheHood) {
                if (audioHolidayInTheHood.isPlaying()) audioHolidayInTheHood.pause();
                else audioHolidayInTheHood.play();
            }
        }
    }
}

function mouseClicked() { if (!isMobile) handleClick(); }
function touchEnded() { if (isMobile) { handleClick(); return false; } }

function draw() {
  updatePalette();
  lerpPalettes();
  background(0);
  if (isSecretMode) { drawSecretMode(); return; }
  if (isPepavaggioArt) { drawPepavaggioArtMode(); return; }
  if (scene === 0 || scene === 1) { drawSoftBackground(); drawWelcomeScreen(); }
  if (scene === 2) {
    drawVideoScreen(); 
    handleAudioVolume();
    if (showControlsMenu) drawControlsImageOverlay();
    if (isDeveloperMode) drawDeveloperCardOverlay();
    if (showAlternateView) drawAlternateImageOverlay();
  }
  if (scene === 0) { animateButton(); handleHoverEffects(); button.show(); } 
  else if (scene === 1) { handleFadeOut(); button.hide(); } 
  else if (scene === 2) { handleFadeIn(); }
}

function drawSecretMode() {
  push();
  background(10, 10, 15);
  
  let boxW = min(1200, width * 0.9);
  let boxH = height * 0.8;
  let panelX = width/2 - boxW/2;
  let panelY = height/2 - boxH/2;
  
  let t = (frameCount * 0.01) % TWO_PI;
  let colA = color("#00f0ff");
  let colB = color("#7a00ff");
  let borderCol = lerpColor(colA, colB, sin(t) * 0.5 + 0.5);
  
  noFill();
  stroke(borderCol);
  strokeWeight(2);
  drawingContext.shadowBlur = 10;
  drawingContext.shadowColor = borderCol.toString();
  rect(panelX, panelY, boxW, boxH, 12);
  drawingContext.shadowBlur = 0;
  
  fill(0); noStroke();
  rect(panelX + 2, panelY + 2, boxW - 4, boxH - 4, 10);
  
  let tabColW = isMobile ? 120 : 220;
  textAlign(LEFT, CENTER);
  textFont('monospace');
  textSize(isMobile ? 11 : 14);
  
  for (let i = 0; i < secretTabs.length; i++) {
    let ty = panelY + 100 + (i * 48);
    let isActive = secretTab === i;
    if (isActive) {
      fill(255, 0, 170);
      drawingContext.shadowBlur = 10;
      drawingContext.shadowColor = "#ff00aa";
    } else {
      fill(68);
      drawingContext.shadowBlur = 0;
    }
    text(secretTabs[i], panelX + (isMobile ? 15 : 40), ty);
    drawingContext.shadowBlur = 0;
  }
  
  fill(0, 255, 0);
  textSize(isMobile ? 14 : 20);
  textAlign(LEFT, BOTTOM);
  text("STATUS: YOU ARE LOVED.", panelX + (isMobile ? 15 : 40), panelY + boxH - 40);

  let contentX = panelX + tabColW + (isMobile ? 10 : 40);
  let colWidth = (boxW - tabColW - (isMobile ? 40 : 100)) / (isMobile ? 1 : 2);
  let items = secretContent[secretTab];
  
  for (let i = 0; i < items.length; i++) {
    let ix = (isMobile || i % 2 === 0) ? contentX : contentX + colWidth + 20;
    let iy = panelY + 100 + (isMobile ? i * 110 : floor(i / 2) * 140);
    
    if (isMobile && iy > panelY + boxH - 80) continue; 

    fill(255, 0, 170);
    textSize(isMobile ? 13 : 16);
    textStyle(NORMAL);
    text(items[i].key + " – " + items[i].title, ix, iy);
    
    fill(200);
    textSize(isMobile ? 10 : 12);
    drawingContext.letterSpacing = '1px';
    textLeading(isMobile ? 14 : 18);
    text(items[i].desc, ix, iy + 20, colWidth, 100);
  }
  pop();
}

function drawPepavaggioArtMode() {
  handleAudioVolume();
  let h = hour();
  let sunFactor = map(abs(h - 12), 0, 12, 1, 0); 
  background(20 * (1 - sunFactor));
  if (imgPepavaggioArt && imgPepavaggioArt.width > 0) {
    let ratio = max(width / imgPepavaggioArt.width, height / imgPepavaggioArt.height);
    let drawW = imgPepavaggioArt.width * ratio;
    let drawH = imgPepavaggioArt.height * ratio;
    image(imgPepavaggioArt, width / 2, height / 2, drawW, drawH);
    push();
    if (h >= 5 && h < 9) { blendMode(ADD); tint(255, 120, 80, 80); } 
    else if (h >= 17 && h < 20) { blendMode(OVERLAY); tint(255, 150, 50, 120); } 
    else if (h >= 9 && h < 17) { blendMode(SCREEN); tint(255, 255, 255, 40); } 
    else { blendMode(MULTIPLY); tint(180, 180, 255, 100); }
    image(imgPepavaggioArt, width / 2, height / 2, drawW, drawH);
    pop();
  }
  if (imgPepavaggioSignature && imgPepavaggioSignature.width > 0) {
    push(); imageMode(CORNER);
    let sigScale = (isMobile ? 0.053 : 0.08) / 1.5;
    let sigW = imgPepavaggioSignature.width * sigScale;
    let sigH = imgPepavaggioSignature.height * sigScale;
    let sigX = 40; let sigY = height - sigH - 34;
    image(imgPepavaggioSignature, sigX, sigY, sigW, sigH);
    pop();
  }
}

function drawSoftBackground() {
  push(); noStroke(); blendMode(BLEND);
  for (let i = 0; i < backgroundBlobs.length; i++) {
    let blob = backgroundBlobs[i];
    blob.angle += 0.003;
    let swoopX = sin(blob.angle) * 250;
    let swoopY = cos(blob.angle * 0.7) * 200;
    blob.x += blob.vx; blob.y += blob.vy;
    if (blob.x < -blob.size) blob.x = width + blob.size;
    if (blob.x > width + blob.size) blob.x = -blob.size;
    if (blob.y < -blob.size) blob.y = height + blob.size;
    if (blob.y > height + blob.size) blob.y = -blob.size;
    let c = colorsPalette[(blob.colIndex + paletteShift) % colorsPalette.length];
    for (let r = blob.size; r > 0; r -= 60) {
      let alpha = map(r, 0, blob.size, 55, 0);
      fill(red(c), green(c), blue(c), alpha);
      ellipse(blob.x + swoopX, blob.y + swoopY, r, r);
    }
  }
  pop();
}

function drawMountainPattern() {
  push(); blendMode(BLEND); noStroke();
  let layers = 10; let time = frameCount * 0.01;
  for (let i = 0; i < layers; i++) {
    let c = colorsPalette[(i + paletteShift) % colorsPalette.length];
    fill(red(c), green(c), blue(c), map(i, 0, layers, 150, 20));
    beginShape(); vertex(-100, height * 1.5); 
    let layerBaseY = height * 0.5 + (i * 40);
    for (let x = -100; x <= width + 100; x += 30) {
      let roll1 = sin(x * 0.002 + time + i * 0.4) * 110;
      let roll2 = cos(x * 0.001 + time * 0.6 + i * 0.7) * 90;
      let fluid = noise(x * 0.005, time * 0.5) * 40;
      vertex(x, layerBaseY + roll1 + roll2 + fluid);
    }
    vertex(width + 100, height * 1.5); endShape(CLOSE);
  }
  pop();
}

function drawRollingOmbrePattern() {
  push(); blendMode(BLEND); noStroke();
  let layers = 45; let time = frameCount * 0.02;
  for (let i = 0; i < layers; i++) {
    let c = colorsPalette[(i + paletteShift) % colorsPalette.length];
    fill(red(c), green(c), blue(c), 240); 
    beginShape(); let baseY = map(i, 0, layers, -height * 0.3, height * 1.1);
    vertex(-100, height * 1.5); 
    for (let x = -100; x <= width + 100; x += 40) {
      let n = noise(x * 0.004, i * 0.12, time) * 380;
      let roll = sin(x * 0.0015 + time + i * 0.35) * 200;
      vertex(x, baseY + n + roll);
    }
    vertex(width + 100, height * 1.5); endShape(CLOSE);
  }
  pop();
}

function drawWarpedMoirePattern() {
  push(); blendMode(BLEND); noFill();
  let time = frameCount * 0.08; 
  let numRibbons = 18; 
  for (let i = 0; i < numRibbons; i++) {
    let c = colorsPalette[(colorsPalette.length - 1 - (i + paletteShift) % colorsPalette.length)];
    let dynamicAlpha = map(noise(i, frameCount * 0.02), 0, 1, 80, 235);
    stroke(red(c), green(c), blue(c), dynamicAlpha); 
    strokeWeight(45); 
    beginShape(); 
    let startY = height * 0.05 + (i * (height * 0.9 / numRibbons));
    for (let x = -100; x <= width + 100; x += 40) {
      let d = dist(x, startY, mouseX, mouseY);
      let warp = map(min(d, 400), 0, 400, 150, 0); 
      let wave = sin(x * 0.003 + time + i * 0.2) * (30 + warp * 0.5); 
      vertex(x, startY + wave);
    }
    endShape();
  }
  drawCursorPulse();
  pop();
}

function drawUndulatingWavePattern() {
  if (wavePressCount >= 7) {
    drawSecretWaves();
    return;
  }
  push(); blendMode(ADD); noFill();
  let time = frameCount * 0.05;
  let isIntense = waveCount >= 105;
  let ampScale = isIntense ? map(waveCount, 105, 155, 1.2, 4.2) : 1;
  let weightScale = isIntense ? map(waveCount, 105, 155, 1.2, 3.5) : 1;
  for (let i = 0; i < waveCount; i++) {
    let baseY = map(i, 0, waveCount, -height * 0.3, height * 1.3);
    let c = colorsPalette[(i + paletteShift) % colorsPalette.length];
    stroke(red(c), green(c), blue(c), isIntense ? 100 : 160);
    strokeWeight((isIntense ? 3 : 5) * weightScale);
    beginShape();
    for (let x = -100; x < width + 100; x += 25) {
        let d = dist(x, baseY, mouseX, mouseY);
        let influence = map(min(d, 350), 0, 350, 150, 0);
        let roll = sin(x * 0.003 + time * 1.1 + i * 0.15) * (150 * ampScale);
        vertex(x, baseY + roll - influence);
    }
    endShape();
  }
  drawCursorPulse();
  pop();
}

function drawSecretWaves() {
  push(); blendMode(SCREEN); noFill();
  let time = frameCount * 0.005; 
  let rows = 12;
  for (let i = 0; i < rows; i++) {
    let c = colorsPalette[(i + paletteShift) % colorsPalette.length];
    let alph = map(sin(time * 2 + i), -1, 1, 40, 150);
    stroke(red(c), green(c), blue(c), alph);
    strokeWeight(width/rows * 0.6);
    beginShape();
    let xBase = map(i, 0, rows, width * 0.1, width * 0.9);
    for (let y = -100; y < height + 100; y += 40) {
      let offset = sin(y * 0.001 + time + i * 0.7) * 200;
      let swell = cos(y * 0.0005 - time * 0.8) * 150;
      curveVertex(xBase + offset + swell, y);
    }
    endShape();
  }
  pop();
}

function drawCursorPulse() {
    push(); blendMode(ADD); noStroke();
    for(let i = 0; i < 6; i++) {
        let c = colorsPalette[(frameCount + i*2) % colorsPalette.length];
        let r = (80 - (i * 10)) * 0.18;
        fill(red(c), green(c), blue(c), map(i, 0, 6, 45, 5));
        ellipse(mouseX, mouseY, r, r);
    }
    pop();
}

function drawControlsImageOverlay() {
  let img = imgAbstractiaControlPanelStationMap;
  if (img && img.width > 0) {
    push(); blendMode(EXCLUSION); tint(255, 230); 
    let ratio = max(width / img.width, height / img.height);
    image(img, width / 2, height / 2, img.width * ratio, img.height * ratio);
    pop(); 
  }
}

function drawDeveloperCardOverlay() {
  let img = imgAbstractiaCommunityCard;
  if (img && img.width > 0) {
    push(); 
    fill(20, 20); rect(0,0,width,height); 
    blendMode(MULTIPLY); 
    let ratio = max(width / img.width, height / img.height);
    image(img, width / 2, height / 2, img.width * ratio, img.height * ratio);
    pop();
  }
}

function drawAlternateImageOverlay() {
    let img = imgAbstractiaWallSculptures; if (!img || img.width === 0) return;
    push(); blendMode(BLEND); 
    let ratioImg = max(width / img.width, height / img.height);
    image(img, width / 2, height / 2, img.width * ratioImg, img.height * ratioImg);
    pop(); 
}

function handleHoverEffects() {
  if (isHovering) {
    let centerX = (width * 0.9) - 160, centerY = height * 0.75 + 110;
    for (let i = 0; i < 2; i++) bubbles.push(new Bubble(centerX + random(-10, 10), centerY + random(-10, 10)));
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    bubbles[i].update(); bubbles[i].display();
    if (bubbles[i].isDead()) bubbles.splice(i, 1);
  }
}

function handleAudioVolume() {
  let wavesFactor = map(waveCount, 5, 155, 0.2, 1.0);
  if (!showWavesMode) wavesFactor = 0;
  
  let musicMute = (isMusicMode && audioHolidayInTheHood && audioHolidayInTheHood.isPlaying()) ? 0 : 1;
  
  if (audioAbstractiaIV && audioAbstractiaIV.isPlaying()) {
    let baseTarget = isQuietMode ? 0.0 : 0.5; 
    let crossfadeBG = 1.0 - wavesFactor;
    audioAbstractiaIV.setVolume(lerp(audioAbstractiaIV.getVolume(), baseTarget * crossfadeBG * musicMute, LERP_RATE));
  }
  if (audioSandsUnderh20 && audioSandsUnderh20.isPlaying()) {
    let sandsTarget = isQuietMode ? 0.0 : wavesFactor;
    audioSandsUnderh20.setVolume(lerp(audioSandsUnderh20.getVolume(), sandsTarget * musicMute, LERP_RATE));
  }
}

function drawWelcomeScreen() {
  if (!videoIsleAbstractia || videoIsleAbstractia.width === 0) return;
  push(); tint(255, 204); 
  let ratio = max(width / videoIsleAbstractia.width, height / videoIsleAbstractia.height);
  image(videoIsleAbstractia, width / 2, height / 2, videoIsleAbstractia.width * ratio, videoIsleAbstractia.height * ratio);
  pop();
}

function drawVideoScreen() {
    drawSoftBackground(); 
    let mediaToDraw = imgAbstractLindiaGif;
    if (mediaToDraw && mediaToDraw.width > 0) {
        imgAbstractLindiaGif.loop();
        push(); blendMode(showCompanionView ? SCREEN : BLEND); 
        let ratioBase = max(width / mediaToDraw.width, height / mediaToDraw.height);
        image(mediaToDraw, width / 2, height / 2, mediaToDraw.width * ratioBase, mediaToDraw.height * ratioBase);
        pop();
    }
    if (showMountainMode) drawMountainPattern(); 
    if (showCompanionView) drawRollingOmbrePattern();
    if (showWavesMode) drawUndulatingWavePattern();
    if (showLinesMode) drawWarpedMoirePattern();
}

function animateButton() {
  let sF = map(sin(frameCount * 0.05), -1, 1, 1, 1.05);
  button.style('transform', `translate(-50%, -55%) scale(${sF})`);
}

function handleDiveIn() {
  if (getAudioContext().state !== 'running') getAudioContext().resume();
  if (audioOpeningIIAbstractia) audioOpeningIIAbstractia.play();
  if (audioSandsUnderh20 && !audioSandsUnderh20.isPlaying()) { audioSandsUnderh20.loop(); audioSandsUnderh20.setVolume(0); }
  if (scene === 0) { scene = 1; button.attribute('disabled', ''); }
}

function handleFadeOut() {
  fadeAlpha += fadeRate;
  fill(0, fadeAlpha); rect(0, 0, width, height);
  if (fadeAlpha >= 255) {
    fadeAlpha = 255; scene = 2;
    videoIsleAbstractia.pause();
    if (audioAbstractiaIV && !audioAbstractiaIV.isPlaying()) audioAbstractiaIV.play();
  }
}

function handleFadeIn() {
  fadeAlpha -= fadeRate;
  fill(0, fadeAlpha); rect(0, 0, width, height);
  if (fadeAlpha <= 0) fadeAlpha = 0;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  button.position(width * 0.9 - 160, height * 0.75 + 110);
}

class Bubble {
  constructor(x, y) {
    this.pos = createVector(x, y);
    this.vel = p5.Vector.fromAngle(random(TWO_PI), random(2, 5));
    this.lifespan = 255; this.size = random(18, 36);
  }
  update() {
    this.pos.add(this.vel);
    this.vel.y = lerp(this.vel.y, -2, 0.05); 
    this.vel.mult(0.98); this.lifespan -= 2.5; 
  }
  display() {
    push(); textSize(this.size); textAlign(CENTER, CENTER);
    fill(255, this.lifespan); text("🫧", this.pos.x, this.pos.y);
    pop();
  }
  isDead() { return this.lifespan < 0; }
}
  </script>
